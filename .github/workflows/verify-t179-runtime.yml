name: Verify T17.9 REAL-TP Interleave

on:
  pull_request:
    branches: [ feat/recovery-t16-arcs-stacked ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/RunT179RealTpTests.mq5'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t179_realtp_model.cpp'
      - 'BlackDragon_v14/docs/vibecode/T17_9_*'
      - '.github/workflows/verify-t179-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  t179-model-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Run T17.9 independent interleave model
        shell: bash
        run: |
          set -euo pipefail
          SRC='BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t179_realtp_model.cpp'
          g++ -std=c++17 -O2 -Wall -Wextra "$SRC" -o /tmp/t179
          /tmp/t179 | tee /tmp/t179.out
          grep -q 'T17.9 REAL-TP interleave model: 40 passed, 0 failed' /tmp/t179.out
          grep -q 'ALL GREEN' /tmp/t179.out
      - name: Verify exact T17.9 source contracts and frozen backlog
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          r=Path('BlackDragon_v14/Include/BlackDragon')
          coord=(r/'Recovery/RecoveryExitCoordinator.mqh').read_text(encoding='utf-8')
          policy=(r/'Recovery/RecoveryT179RealTpPolicy.mqh').read_text(encoding='utf-8')
          strategy=(r/'Strategy.mqh').read_text(encoding='utf-8')
          base=(r/'StrategyT176Base.mqh').read_text(encoding='utf-8')
          execution=(r/'ExecutionLayer.mqh').read_text(encoding='utf-8')
          pyramid=(r/'Pyramid/PyramidConfig.mqh').read_text(encoding='utf-8')
          assert 'ClassifyCoreRealTpDealT179' in coord
          assert 'POSITION_IDENTIFIER' in coord and 'positionIds' in coord
          assert 'PrepareRealTpEpoch' in coord and 'ObserveRealTpSettlement' in coord
          assert 'BlocksSameSideAdd' in coord and 'settling' in coord
          assert 'Recovery_T179ClassifyBrokerTpPure' in policy
          assert 'ObserveRealTpSettlement' in strategy and 'BlocksRealTpAdd' in strategy
          assert 'PrepareRealTpEpoch' in base and 'Recovery_T179ModifyCandidatePure' in base
          assert 'POSITION_TICKET' in execution and 'req.position==0' in execution
          assert 'ArraySort(work);' in pyramid
          def blob(path): return subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
          assert blob(r/'Recovery/RecoveryArcsStackT177HedgeLadderC4Base.mqh') == '32100a677f2e70247c0da9d41fd29427440afdb3'
          assert blob(r/'Recovery/RecoveryExitCoordinatorT177Base.mqh') == 'ebbcbf8493381603c4dc89c11bee31e1fc1dad57'
          assert blob(r/'Pyramid/PyramidConfig.mqh') == '2427f5cdb0908c000d8d77bd252a6bffeda90490'
          print('T17.9 source contract PASS; Hedge ladder and unit backlog unchanged')
      - name: Record exact identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"

  t179-native:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if(-not(Test-Path "$env:MT5_DIR\metaeditor64.exe")){throw 'metaeditor64.exe not found'}
      - name: Warm terminal and mirror exact tree
        shell: pwsh
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA){throw 'checkout mismatch'}
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru;Start-Sleep -Seconds 40;$t|Stop-Process -Force -ErrorAction SilentlyContinue;Start-Sleep -Seconds 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')){New-Item -ItemType Directory -Force -Path "$mql5\$d"|Out-Null;Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force}
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")){Get-ChildItem $r -Recurse -File|Where-Object{$_.Extension -in '.mq5','.mqh'}|ForEach-Object{$txt=Get-Content $_.FullName -Raw -Encoding UTF8;[IO.File]::WriteAllText($_.FullName,$txt,$enc)}}
      - name: Compile focused script and full EA
        shell: pwsh
        run: |
          $mql5="$env:MT5_DIR\MQL5";$editor="$env:MT5_DIR\metaeditor64.exe";$b="$env:GITHUB_WORKSPACE\build-t179";New-Item -ItemType Directory -Force $b|Out-Null
          $targets=@(@{N='RunT179RealTpTests';S="$mql5\Scripts\BlackDragon\Tests\RunT179RealTpTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunT179RealTpTests.ex5"},@{N='BlackDragon';S="$mql5\Experts\BlackDragon\BlackDragon.mq5";O="$mql5\Experts\BlackDragon\BlackDragon.ex5"})
          foreach($t in $targets){$log="$b\$($t.N)-compile.log";Start-Process $editor -ArgumentList "/compile:`"$($t.S)`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow;$x=Get-Content $log -Encoding Unicode -Raw;Write-Host $x;$e=@(($x-split"`r?`n")|Where-Object{$_-match' : error '});$w=@(($x-split"`r?`n")|Where-Object{$_-match' : warning '});if(-not(Test-Path $t.O)-or$e.Count-or$w.Count){throw "$($t.N) compile failed: $($e.Count) errors/$($w.Count) warnings"};Copy-Item $t.O $b -Force}
          $head=(git rev-parse HEAD).Trim();$tree=(git show -s --format=%T HEAD).Trim();$hash=(Get-FileHash "$b\BlackDragon.ex5" -Algorithm SHA256).Hash.ToLowerInvariant();"HEAD=$head`nTREE=$tree`nBLACKDRAGON_EX5_SHA256=$hash`n"|Out-File "$b\PROVENANCE.txt" -Encoding utf8;Write-Host "T17.9 MetaEditor PASS 0 errors/0 warnings HEAD=$head TREE=$tree EX5=$hash"
      - name: Execute native T17.9 tests
        shell: pwsh
        run: |
          $b="$env:GITHUB_WORKSPACE\build-t179";$ld="$env:MT5_DIR\MQL5\Logs";Get-Process terminal64 -ErrorAction SilentlyContinue|Stop-Process -Force;New-Item -ItemType Directory -Force $ld|Out-Null;Get-ChildItem $ld -Filter '*.log' -ErrorAction SilentlyContinue|Remove-Item -Force -ErrorAction SilentlyContinue
          $cfg="$b\RunT179RealTpTests.ini";$txt="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\RunT179RealTpTests`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n";[IO.File]::WriteAllText($cfg,$txt,[Text.Encoding]::Unicode);$p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru;$dl=(Get-Date).AddMinutes(4);while(-not$p.HasExited-and(Get-Date)-lt$dl){Start-Sleep 2;$p.Refresh()};if(-not$p.HasExited){Stop-Process -Id $p.Id -Force;throw 'T17.9 native timeout'};$logs=Get-ChildItem $ld -Filter '*.log'|Sort-Object LastWriteTime;if(-not$logs){throw 'T17.9 native log missing'};$raw=Get-Content $logs[-1].FullName -Raw;Copy-Item $logs[-1].FullName "$b\RunT179RealTpTests-native.log" -Force;Write-Host $raw;$m=[regex]::Match($raw,'T17\.9 REAL-TP tests:\s*(\d+) passed,\s*(\d+) failed');if(-not$m.Success-or[int]$m.Groups[1].Value-ne32-or[int]$m.Groups[2].Value-ne0-or$raw-notmatch'ALL GREEN'){throw 'T17.9 expected 32/0'}
      - uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t179-focused-exact-tree
          path: build-t179/
          if-no-files-found: error
