name: Verify T17.7 C2 Core Anchor

on:
  pull_request:
    branches: [ feat/recovery-t16-arcs-stacked ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/RunT177AnchorTests.mq5'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t177_anchor_model.cpp'
      - '.github/workflows/verify-t177-c2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  t177-c2-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Run T17.7 C2 independent anchor model
        shell: bash
        run: |
          set -euo pipefail
          SRC='BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t177_anchor_model.cpp'
          g++ -std=c++17 -O2 -Wall -Wextra "$SRC" -o /tmp/t177c2
          /tmp/t177c2 | tee /tmp/t177c2.out
          grep -q 'T17.7 C2 anchor model: 14 passed, 0 failed' /tmp/t177c2.out
          grep -q 'ALL GREEN' /tmp/t177c2.out

      - name: Verify C2 source contract
        shell: python
        run: |
          from pathlib import Path

          anchor=Path('BlackDragon_v14/Include/BlackDragon/Pyramid/PyramidAnchorT177.mqh').read_text(encoding='utf-8')
          wrapper=Path('BlackDragon_v14/Include/BlackDragon/Pyramid/CorePyramidT177Anchor.mqh').read_text(encoding='utf-8')
          base=Path('BlackDragon_v14/Include/BlackDragon/Pyramid/CorePyramid.mqh').read_text(encoding='utf-8')
          ea=Path('BlackDragon_v14/Experts/BlackDragon/BlackDragon.mq5').read_text(encoding='utf-8')
          native=Path('BlackDragon_v14/Scripts/BlackDragon/Tests/RunT177AnchorTests.mq5').read_text(encoding='utf-8')

          for token in ['eCorePyramidAnchorMode','pyramid_anchor_DYNAMIC',
                        'pyramid_anchor_FIRST_CORE_CUMULATIVE',
                        'CorePyramidAnchorMode_ = pyramid_anchor_DYNAMIC',
                        'BD_T177_ANCHOR_POLICY_REV 1',
                        'Pyramid_T177CumulativeDistancePure',
                        'Pyramid_T177FirstCoreTriggerPricePure',
                        'Pyramid_T177FirstCoreGapHitPure',
                        'Pyramid_T177ExtendedSemanticText']:
              assert token in anchor
          assert 'if(CorePyramidAnchorMode_ == pyramid_anchor_DYNAMIC) return legacy;' in anchor
          assert 'total += Pyramid_SeqValue(distance, i);' in anchor

          assert '#define CCorePyramidEngine CCorePyramidEngineT176Base' in wrapper
          assert '#include "CorePyramid.mqh"' in wrapper
          assert 'return CCorePyramidEngineT176Base::Drive' in wrapper
          assert 'm_campaignStartDeal[dir]' in wrapper
          for token in ['DEAL_MAGIC','DEAL_ENTRY','DEAL_TYPE','DEAL_PRICE']:
              assert token in wrapper
          assert 'Pyramid_T177CumulativeDistancePure(m_distance, level)' in wrapper
          assert 'anchor = m_firstCorePrice[dir]' in wrapper
          assert 'CorePyramidMode_ == pyramid_CHU_KY_SACH && stats.exitDeals > 0' in wrapper
          assert 'recoveryOwns = c.state != recovery_CORE_ONLY;' in wrapper

          # Legacy DYNAMIC implementation remains untouched and is delegated to
          # directly rather than being reimplemented in C2.
          assert 'Pyramid_T173RearmAnchorPure' in base
          assert 'double gapPips = Pyramid_SeqValue(m_distance, level - 1);' in base

          anchor_inc=ea.index('#include <BlackDragon/Pyramid/PyramidAnchorT177.mqh>')
          semantic_define=ea.index('#define Pyramid_SemanticText Pyramid_T177ExtendedSemanticText')
          recovery_inc=ea.index('#include <BlackDragon/Recovery/RecoveryEngine.mqh>')
          semantic_undef=ea.index('#undef Pyramid_SemanticText')
          wrapper_inc=ea.index('#include <BlackDragon/Pyramid/CorePyramidT177Anchor.mqh>')
          strategy_inc=ea.index('#include <BlackDragon/Strategy.mqh>')
          assert anchor_inc < semantic_define < recovery_inc < semantic_undef < wrapper_inc < strategy_inc
          assert 'CoreAnchor=' in ea

          assert 'T17.7 C2 anchor tests:' in native
          assert 'cumulative L4 repeats last = 136' in native
          print('T17.7 C2 Core Anchor source contract PASS')

      - name: Record exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"

  t177-c2-native:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$env:MT5_DIR\metaeditor64.exe")) { throw 'metaeditor64.exe not found' }
          if (-not (Test-Path "$env:MT5_DIR\terminal64.exe")) { throw 'terminal64.exe not found' }

      - name: Warm terminal and mirror exact tree
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "checkout mismatch actual=$actual expected=$env:SOURCE_SHA" }
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 40
          $t | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')) {
            New-Item -ItemType Directory -Force -Path "$mql5\$d" | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force
          }
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")) {
            if(Test-Path $r) {
              Get-ChildItem $r -Recurse -File | Where-Object {$_.Extension -in '.mq5','.mqh'} | ForEach-Object {
                $txt=Get-Content $_.FullName -Raw -Encoding UTF8
                [System.IO.File]::WriteAllText($_.FullName,$txt,$enc)
              }
            }
          }

      - name: Compile exact C2 targets
        shell: pwsh
        run: |
          $editor="$env:MT5_DIR\metaeditor64.exe"; $mql5="$env:MT5_DIR\MQL5"; $build="$env:GITHUB_WORKSPACE\build-t177c2"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $targets=@(
            @{N='RunT177AnchorTests';S="$mql5\Scripts\BlackDragon\Tests\RunT177AnchorTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunT177AnchorTests.ex5"},
            @{N='BlackDragon';S="$mql5\Experts\BlackDragon\BlackDragon.mq5";O="$mql5\Experts\BlackDragon\BlackDragon.ex5"}
          )
          foreach($t in $targets) {
            $log="$build\$($t.N).log"
            Start-Process $editor -ArgumentList "/compile:`"$($t.S)`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow
            if(-not(Test-Path $log)){throw "$($t.N): no compile log"}
            $text=Get-Content $log -Encoding Unicode -Raw; Write-Host $text
            $err=@(($text -split "`r?`n")|Where-Object{$_ -match ' : error '})
            $warn=@(($text -split "`r?`n")|Where-Object{$_ -match ' : warning '})
            if(-not(Test-Path $t.O)){throw "$($t.N): EX5 missing"}
            if($err.Count -or $warn.Count){throw "$($t.N): $($err.Count) errors / $($warn.Count) warnings"}
            Copy-Item $t.O $build -Force
          }
          $head=(git rev-parse HEAD).Trim(); $tree=(git show -s --format=%T HEAD).Trim()
          if($head -ne $env:SOURCE_SHA){throw 'provenance HEAD mismatch'}
          $eaHash=(Get-FileHash (Join-Path $build 'BlackDragon.ex5') -Algorithm SHA256).Hash.ToLowerInvariant()
          "HEAD=$head`nTREE=$tree`nBLACKDRAGON_EX5_SHA256=$eaHash`n" | Out-File "$build\PROVENANCE.txt" -Encoding utf8
          Write-Host "T17.7 C2 MetaEditor PASS: 0 errors / 0 warnings"
          Write-Host "HEAD=$head TREE=$tree BlackDragon.ex5 SHA256=$eaHash"

      - name: Execute native C2 anchor script
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t177c2"; $logDir="$env:MT5_DIR\MQL5\Logs"
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $cfg=Join-Path $build 'RunT177AnchorTests.ini'
          $cfgText="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\RunT177AnchorTests`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n"
          [IO.File]::WriteAllText($cfg,$cfgText,[Text.Encoding]::Unicode)
          $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru
          $deadline=(Get-Date).AddMinutes(4)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'T17.7 C2 native timeout'}
          $logs=Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          if(-not $logs){throw 'T17.7 C2 native log missing'}
          $latest=$logs[-1]
          Copy-Item $latest.FullName (Join-Path $build 'RunT177AnchorTests-native.log') -Force
          $raw=Get-Content $latest.FullName -Raw; Write-Host $raw
          $m=[regex]::Match($raw,'T17\.7 C2 anchor tests:\s*(\d+) passed,\s*(\d+) failed')
          if(-not $m.Success){throw 'T17.7 C2 summary missing'}
          if([int]$m.Groups[1].Value -ne 14 -or [int]$m.Groups[2].Value -ne 0 -or $raw -notmatch 'ALL GREEN')
          { throw 'T17.7 C2 expected 14/0' }
          Write-Host 'T17.7 C2 native PASS 14/0'

      - name: Package exact C2 evidence
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t177c2"
          Compress-Archive "$build\*" "$env:GITHUB_WORKSPACE\BlackDragon-T17.7-C2-evidence.zip" -Force
          $h=(Get-FileHash "$env:GITHUB_WORKSPACE\BlackDragon-T17.7-C2-evidence.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "PACKAGE_SHA256=$h" | Add-Content "$build\PROVENANCE.txt"
          Write-Host "PACKAGE_SHA256=$h"

      - name: Upload exact C2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t177-c2-exact-tree
          path: |
            build-t177c2/
            BlackDragon-T17.7-C2-evidence.zip
          if-no-files-found: error
