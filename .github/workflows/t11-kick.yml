name: T11 Kick Dispatcher

on:
  push:
    branches: [ feat/adaptive-recovery-t11-global-flatten-reset ]
    paths: [ '.github/t11-kick.txt' ]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch T11 implementation gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run t11-apply-global-flatten-fix.yml \
            --repo "${{ github.repository }}" \
            --ref feat/adaptive-recovery-t11-global-flatten-reset
