name: Verify T17 T16 Regression

on:
  push:
    branches: [ feat/t17-full-pyramid ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/**'
      - '.github/workflows/verify-t17-regression.yml'
  pull_request:
    branches: [ feat/recovery-t16-arcs-stacked ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/**'
      - '.github/workflows/verify-t17-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  model-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Run established T1-T16.6 model regression matrix
        shell: bash
        run: |
          set -euo pipefail
          ROOT='BlackDragon_v14/Scripts/BlackDragon/Tests'
          suites=(offline_suite.cpp recovery_foundation_suite.cpp execution_t2_suite.cpp \
                  recovery_t3_shadow_suite.cpp recovery_t4_bundle_suite.cpp \
                  recovery_t5_exit_suite.cpp recovery_t6_lock_suite.cpp \
                  recovery_t7_dca_suite.cpp recovery_t8_coord_suite.cpp \
                  recovery_t9_persistence_suite.cpp recovery_t10_runtime_guard_suite.cpp \
                  execution_t14_identity_suite.cpp recovery_t16_arcs_suite.cpp \
                  recovery_t16_event_order_suite.cpp recovery_t162_overlap_slreject_suite.cpp \
                  recovery_t163_liveness_suite.cpp recovery_t164_reachability_suite.cpp \
                  recovery_t165_guard_margin_log_suite.cpp recovery_t166_broker_min_suite.cpp)
          for src in "${suites[@]}"; do
            echo "::group::$src"
            exe="/tmp/${src%.cpp}"
            out="/tmp/${src%.cpp}.out"
            g++ -std=c++17 -O2 -Wall -Wextra "$ROOT/$src" -o "$exe"
            "$exe" | tee "$out"
            grep -Eq '(^|[^0-9])0 failed([^0-9]|$)' "$out"
            echo '::endgroup::'
          done
          echo 'T17 established model regression PASS: T1-T16.6 all report 0 failed'

      - name: Verify T16.5 and T16.6 safety invariants remain wired
        shell: python
        run: |
          from pathlib import Path
          cfg=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryT16Config.mqh').read_text(encoding='utf-8')
          exitp=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExit.mqh').read_text(encoding='utf-8')
          reserve=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryT165MarginReserve.mqh').read_text(encoding='utf-8')
          arcs=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStack.mqh').read_text(encoding='utf-8')
          final=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStackPostDeal.mqh').read_text(encoding='utf-8')
          strategy=Path('BlackDragon_v14/Include/BlackDragon/Strategy.mqh').read_text(encoding='utf-8')
          assert 'RecoveryDcaMarginReserve_' in cfg and 'RecoveryWaitLogSeconds_' in cfg
          assert 'BD_ARCS_MIN_VOLUME_POLICY_REV 1' in cfg
          assert 'Recovery_T16NewGenerationRawUnitsPure' in cfg
          assert 'Recovery_T166ClampPositiveGenerationUnitsPure' in cfg
          assert 'Recovery_T16CurrentBrokerMinUnits' in cfg
          assert '|minVolumePolicyRev=' in cfg
          assert 'Recovery_T166ExecutablePartialCloseUnitsPure' in exitp
          assert 'Recovery_T16NewGenerationUnitsPure' in reserve
          assert 'Recovery_T165ProjectedDcaReserveAllows' in strategy
          assert 'T16.5 CAPACITY_WAIT' in final and 'DriveBuildingCapacitySafe' in final
          start=arcs.index('bool StartGeneration')
          zero=arcs.index('if(target <= 0)', start)
          min_check=arcs.index('if(target < meta.minUnits)', start)
          assert start < zero < min_check
          print('T17 T16.5/T16.6 source regression invariants PASS')

      - name: Record exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"

  native-regression:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$env:MT5_DIR\metaeditor64.exe")) { throw 'metaeditor64.exe not found' }
          if (-not (Test-Path "$env:MT5_DIR\terminal64.exe")) { throw 'terminal64.exe not found' }

      - name: Warm terminal and mirror exact tree
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "checkout mismatch actual=$actual expected=$env:SOURCE_SHA" }
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 40
          $t | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')) {
            New-Item -ItemType Directory -Force -Path "$mql5\$d" | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force
          }
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")) {
            if(Test-Path $r) {
              Get-ChildItem $r -Recurse -File | Where-Object {$_.Extension -in '.mq5','.mqh'} | ForEach-Object {
                $txt=Get-Content $_.FullName -Raw -Encoding UTF8
                [System.IO.File]::WriteAllText($_.FullName,$txt,$enc)
              }
            }
          }

      - name: Compile established native regression targets
        shell: pwsh
        run: |
          $editor="$env:MT5_DIR\metaeditor64.exe"; $mql5="$env:MT5_DIR\MQL5"; $build="$env:GITHUB_WORKSPACE\build-t17-regression"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $names=@('RunTests','RunRecoveryMutationTests','RunRecoveryIdentityTests','RunRecoveryArcsTests','RunRecoveryLivenessTests','RunRecoveryReachabilityTests','RunRecoveryT165Tests','RunRecoveryT166Tests')
          foreach($n in $names) {
            $src="$mql5\Scripts\BlackDragon\Tests\$n.mq5"; $out="$mql5\Scripts\BlackDragon\Tests\$n.ex5"; $log="$build\$n.log"
            Start-Process $editor -ArgumentList "/compile:`"$src`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow
            if(-not(Test-Path $log)){throw "${n}: no compile log"}
            $text=Get-Content $log -Encoding Unicode -Raw; Write-Host $text
            $err=@(($text -split "`r?`n")|Where-Object{$_ -match ' : error '}); $warn=@(($text -split "`r?`n")|Where-Object{$_ -match ' : warning '})
            if(-not(Test-Path $out)){throw "${n}: EX5 missing"}
            if($err.Count -or $warn.Count){throw "${n}: $($err.Count) errors / $($warn.Count) warnings"}
            Copy-Item $out $build -Force
          }
          $eaSrc="$mql5\Experts\BlackDragon\BlackDragon.mq5"; $eaOut="$mql5\Experts\BlackDragon\BlackDragon.ex5"; $eaLog="$build\BlackDragon.log"
          Start-Process $editor -ArgumentList "/compile:`"$eaSrc`" /inc:`"$mql5`" /log:`"$eaLog`"" -Wait -NoNewWindow
          $text=Get-Content $eaLog -Encoding Unicode -Raw; Write-Host $text
          $err=@(($text -split "`r?`n")|Where-Object{$_ -match ' : error '}); $warn=@(($text -split "`r?`n")|Where-Object{$_ -match ' : warning '})
          if(-not(Test-Path $eaOut)){throw 'BlackDragon: EX5 missing'}
          if($err.Count -or $warn.Count){throw "BlackDragon: $($err.Count) errors / $($warn.Count) warnings"}
          Copy-Item $eaOut $build -Force
          $head=(git rev-parse HEAD).Trim(); $tree=(git show -s --format=%T HEAD).Trim()
          if($head -ne $env:SOURCE_SHA){throw 'provenance HEAD mismatch'}
          $eaHash=(Get-FileHash (Join-Path $build 'BlackDragon.ex5') -Algorithm SHA256).Hash.ToLowerInvariant()
          "HEAD=$head`nTREE=$tree`nBLACKDRAGON_EX5_SHA256=$eaHash`n" | Out-File "$build\PROVENANCE.txt" -Encoding utf8
          Write-Host "T17 regression MetaEditor PASS: all established targets 0 errors / 0 warnings"
          Write-Host "HEAD=$head TREE=$tree BlackDragon.ex5 SHA256=$eaHash"

      - name: Execute established native MT5 regression matrix
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t17-regression"
          $tests=@(
            @{N='RunTests';P='BlackDragon v14 unit tests:\s*(\d+) passed,\s*(\d+) failed';E=246},
            @{N='RunRecoveryMutationTests';P='Recovery T13 mutation policy tests:\s*(\d+) passed,\s*(\d+) failed';E=26},
            @{N='RunRecoveryIdentityTests';P='Recovery T14 identity tests:\s*(\d+) passed,\s*(\d+) failed';E=17},
            @{N='RunRecoveryArcsTests';P='Recovery T16 ARCS tests:\s*(\d+) passed,\s*(\d+) failed';E=33},
            @{N='RunRecoveryLivenessTests';P='Recovery T16\.3 liveness tests:\s*(\d+) passed,\s*(\d+) failed';E=18},
            @{N='RunRecoveryReachabilityTests';P='Recovery T16\.4 reachability tests:\s*(\d+) passed,\s*(\d+) failed';E=20},
            @{N='RunRecoveryT165Tests';P='Recovery T16\.5 guard/margin/log tests:\s*(\d+) passed,\s*(\d+) failed';E=20},
            @{N='RunRecoveryT166Tests';P='Recovery T16\.6 broker-min tests:\s*(\d+) passed,\s*(\d+) failed';E=16}
          )
          foreach($t in $tests) {
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
            $logDir="$env:MT5_DIR\MQL5\Logs"; New-Item -ItemType Directory -Force -Path $logDir | Out-Null
            Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
            $cfg=Join-Path $build "$($t.N).ini"
            $cfgText="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\$($t.N)`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n"
            [IO.File]::WriteAllText($cfg,$cfgText,[Text.Encoding]::Unicode)
            $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru
            $deadline=(Get-Date).AddMinutes(4)
            while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw "$($t.N) timeout"}
            $logs=Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
            if(-not $logs){throw "$($t.N) native log missing"}
            $latest=$logs[-1]; Copy-Item $latest.FullName (Join-Path $build "$($t.N)-native.log") -Force
            $raw=Get-Content $latest.FullName -Raw; Write-Host "--- native $($t.N) ---`n$raw"
            $m=[regex]::Match($raw,$t.P); if(-not $m.Success){throw "$($t.N) summary missing"}
            $pass=[int]$m.Groups[1].Value; $fail=[int]$m.Groups[2].Value
            if($pass -ne $t.E -or $fail -ne 0 -or $raw -notmatch 'ALL GREEN'){throw "$($t.N): expected $($t.E)/0 got $pass/$fail"}
            Write-Host "$($t.N): native PASS $pass/0"
          }
          Write-Host 'T17 native regression PASS: legacy 246/0; T13 26/0; T14 17/0; T16.2 33/0; T16.3 18/0; T16.4 20/0; T16.5 20/0; T16.6 16/0'

      - name: Package exact T17 regression evidence
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t17-regression"
          Compress-Archive "$build\*" "$env:GITHUB_WORKSPACE\BlackDragon-T17-regression-evidence.zip" -Force
          $h=(Get-FileHash "$env:GITHUB_WORKSPACE\BlackDragon-T17-regression-evidence.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "PACKAGE_SHA256=$h" | Add-Content "$build\PROVENANCE.txt"
          Write-Host "PACKAGE_SHA256=$h"

      - name: Upload exact T17 regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t17-regression-exact-tree
          path: |
            build-t17-regression/
            BlackDragon-T17-regression-evidence.zip
          if-no-files-found: error
