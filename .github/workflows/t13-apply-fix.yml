name: T13 Apply Recovery Side-Mutation Fix

on:
  push:
    branches:
      - feat/adaptive-recovery-t13-overlap-side-finalizer

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-recovery-t13-overlap-side-finalizer
          fetch-depth: 0

      - name: Apply exact T13 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {n}")
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) Formalize ARMED -> CORE_ONLY when an operator/Overlap mutation
          #    removes enough Core depth that the activation threshold is no longer true.
          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryStateMachine.mqh',
              '''      case recovery_ARMED:\n         return toState == recovery_HEDGE_BUILDING;''',
              '''      case recovery_ARMED:\n         return toState == recovery_HEDGE_BUILDING ||\n                toState == recovery_CORE_ONLY; // T13: confirmed pre-hedge Core trim may disarm''')

          # 2) New pure policy used by coordinator + deterministic tests.
          policy = r'''//+------------------------------------------------------------------+
//| RecoveryMutationPolicy.mqh — T13 side-mutation/Overlap policy    |
//| Pure policy only: no broker API, persistence, or global writes.  |
//+------------------------------------------------------------------+
#ifndef BD_RECOVERY_MUTATION_POLICY_MQH
#define BD_RECOVERY_MUTATION_POLICY_MQH

#include "RecoveryTypes.mqh"

enum eRecoveryOverlapPolicy
{
   recovery_OVERLAP_BYPASS = 0,
   recovery_OVERLAP_COORDINATE,
   recovery_OVERLAP_DEFER
};

// CORE_ONLY/COMPLETED have no active Recovery topology to protect.
// ARMED/HEDGE_ACTIVE/HEDGE_LOCKED are stable enough to coordinate a Core trim.
// All mutation/pause/reconcile states defer Overlap until Recovery is stable.
eRecoveryOverlapPolicy Recovery_OverlapPolicyPure(const eRecoveryState state)
{
   if(state == recovery_CORE_ONLY || state == recovery_COMPLETED)
      return recovery_OVERLAP_BYPASS;
   if(state == recovery_ARMED ||
      state == recovery_HEDGE_ACTIVE ||
      state == recovery_HEDGE_LOCKED)
      return recovery_OVERLAP_COORDINATE;
   return recovery_OVERLAP_DEFER;
}

bool Recovery_SideMutationStableStatePure(const eRecoveryState state)
{
   return state == recovery_CORE_ONLY ||
          state == recovery_ARMED ||
          state == recovery_HEDGE_ACTIVE ||
          state == recovery_HEDGE_LOCKED ||
          state == recovery_COMPLETED;
}

#endif // BD_RECOVERY_MUTATION_POLICY_MQH
'''
          Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryMutationPolicy.mqh').write_text(policy, encoding='utf-8')

          # 3) RecoveryEngine: accurate ACTIVE/SHADOW log prefix.
          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh',
              '''      Log_Info("Recovery", "SHADOW " + Recovery_DirectionName(dir) + " " +\n               Recovery_StateName(before.state) + " -> " + Recovery_StateName(after.state));''',
              '''      string prefix = m_cfg.mode == recovery_ACTIVE ? "ACTIVE " : "SHADOW ";\n      Log_Info("Recovery", prefix + Recovery_DirectionName(dir) + " " +\n               Recovery_StateName(before.state) + " -> " + Recovery_StateName(after.state));''')

          # RecoveryEngine needs the pure policy for the stable-state gate.
          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh',
              '''#include "RecoveryRegistry.mqh"\n#include "RecoveryExit.mqh"''',
              '''#include "RecoveryRegistry.mqh"\n#include "RecoveryMutationPolicy.mqh"\n#include "RecoveryExit.mqh"''')

          # T13 side-scoped atomic finalizer. It does NOT globally re-arm a
          # previously unhealthy engine; it only persists the proven side mutation.
          side_method = r'''

   //--- T13 confirmed side/magic Core mutation boundary -----------------
   // Called by T8 only after its Core/Hedge close plan is broker-observable,
   // the cycle journal is quiet, and no strict reconcile evidence remains.
   // Unlike T12 global flatten, this is side-scoped and preserves the other
   // Recovery direction. Partial Overlap is accepted only from stable states.
   bool FinalizeConfirmedSideMutation(CExecutionLayer &exec,
                                      const eRecoveryCoreDirection dir,
                                      const datetime now,
                                      string &why)
   {
      why = "";
      if(m_cfg.mode != recovery_ACTIVE) return true;
      if(!m_initialized)
      {
         why = "RecoveryEngine is not initialized";
         return false;
      }
      if(m_persistenceBlocked)
      {
         why = "Recovery persistence is blocked by startup integrity/identity failure";
         return false;
      }

      const int idx = DirIndex(dir);
      const int cycleKey = Recovery_CycleKey(dir);
      exec.ReconcileCycle(cycleKey);
      if(exec.HasReconcileRequired(cycleKey))
      {
         why = "side mutation execution journal still requires strict reconciliation";
         return false;
      }
      if(exec.HasPendingForCycle(cycleKey) || m_pending[idx].active)
      {
         why = "side mutation finalizer requires a quiet cycle journal/durable command";
         return false;
      }

      long currentCore = CoreUnits(dir);
      long currentHedge = RawRecoveryUnits(dir);
      SRecoveryCycle c;
      m_registry.GetCycle(dir, c);

      if(currentCore <= 0 && currentHedge <= 0)
      {
         bool alreadyCompleted = c.state == recovery_COMPLETED;
         if(!alreadyCompleted)
         {
            if(!Recovery_StateTransitionAllowed(c.state, recovery_COMPLETED) ||
               !m_registry.Transition(dir, recovery_COMPLETED, now,
                                      "confirmed side/magic Core flatten"))
            {
               why = "Recovery registry rejected side completion for " + Recovery_DirectionName(dir);
               return false;
            }
            m_registry.GetCycle(dir, c);
         }

         c.cycleSerial = Recovery_GlobalFlattenNextSerialPure(c.cycleSerial, alreadyCompleted);
         c.state                     = recovery_COMPLETED;
         c.armed                     = false;
         c.coreCount                 = 0;
         c.coreLots                  = 0.0;
         c.coreNetBE                 = 0.0;
         c.activeHedgeLots           = 0.0;
         c.hedgeNetBE                = 0.0;
         c.coveragePercent           = 0.0;
         c.corridorPrice             = 0.0;
         c.armedDcaCount             = 0;
         c.anchorDeal                = 0;
         c.anchorPosition            = 0;
         c.anchorPrice               = 0.0;
         c.anchorTicks               = 0;
         c.anchorTime                = 0;
         c.hedgeGeneration           = 0;
         c.bundleId                  = 0;
         c.bundleTargetUnits         = 0;
         c.bundleBaselineActiveUnits = 0;
         c.bundleConfirmedUnits      = 0;
         c.bundleSubmittedChildren   = 0;
         c.bundleChildInFlight       = false;
         c.bundlePartialCoverage     = false;
         c.bundleBlockedAfterReject  = false;
         c.bundleReconcileRequired   = false;
         c.bundleComplete            = false;
         c.bundleCoveragePercent     = 0.0;
         c.shadowDecision            = recovery_SHADOW_NONE;
         c.shadowDecisionLatched     = false;
         c.shadowTargetUnits         = 0;
         c.shadowTriggerPrice        = 0.0;
         c.shadowDecisionAt          = 0;
         c.shadowPlannedChildren     = 0;
         c.shadowPlanValid           = false;
         c.anchorEvidenceWaitLogged  = false;

         if(!m_registry.RestoreCycle(dir, c))
         {
            why = "Recovery registry rejected sanitized side COMPLETED cycle";
            return false;
         }
         Recovery_PendingInit(m_pending[idx]);
         Recovery_T5RuntimeInit(m_t5[idx]);
         ResetT6Cycle(idx);
         m_t5CycleSerial[idx] = c.cycleSerial;
      }
      else
      {
         // Partial mutations are permitted only from states with no active
         // T4/T5/T6 mutation chain. This is the key serialization boundary
         // that keeps Overlap from colliding with realized-credit/lock logic.
         if(!Recovery_SideMutationStableStatePure(c.state) || c.state == recovery_COMPLETED)
         {
            why = "partial Core mutation reached a non-stable Recovery state: " +
                  Recovery_StateName(c.state);
            return false;
         }

         if(c.state == recovery_ARMED)
         {
            if(currentHedge != 0)
            {
               why = "ARMED side mutation unexpectedly has Recovery hedge exposure";
               return false;
            }

            int count = CoreCount(dir);
            if(!Recovery_DcaThresholdReached(count, m_cfg.startAfterDca))
            {
               if(!m_registry.Transition(dir, recovery_CORE_ONLY, now,
                                         "confirmed Core trim moved below Recovery activation threshold"))
               {
                  why = "registry rejected ARMED -> CORE_ONLY after confirmed Core trim";
                  return false;
               }
               m_registry.GetCycle(dir, c);
               c.armed                    = false;
               c.armedDcaCount            = 0;
               c.anchorDeal               = 0;
               c.anchorPosition           = 0;
               c.anchorPrice              = 0.0;
               c.anchorTicks              = 0;
               c.anchorTime               = 0;
               c.anchorEvidenceWaitLogged = false;
               if(!m_registry.RestoreCycle(dir, c))
               {
                  why = "registry rejected disarmed CORE_ONLY snapshot";
                  return false;
               }
               Log_Info("Recovery", "T13 " + Recovery_DirectionName(dir) +
                        " disarmed after Core trim moved below RecoveryStartAfterDca_");
            }
            else
            {
               SRecoveryCorePositionSnapshot buyPos[];
               SRecoveryCorePositionSnapshot sellPos[];
               double buyLots = 0.0, sellLots = 0.0;
               BuildCoreSnapshots(buyPos, sellPos, buyLots, sellLots);
               int thresholdIndex = m_cfg.startAfterDca;
               int n = dir == recovery_CORE_BUY ? ArraySize(buyPos) : ArraySize(sellPos);
               if(thresholdIndex < 0 || thresholdIndex >= n)
               {
                  why = "current Core threshold position is unavailable after partial mutation";
                  return false;
               }
               ulong thresholdTicket = dir == recovery_CORE_BUY ?
                                       buyPos[thresholdIndex].ticket : sellPos[thresholdIndex].ticket;
               if(c.anchorPosition != thresholdTicket)
               {
                  c.anchorDeal = 0;
                  c.anchorPosition = 0;
                  c.anchorPrice = 0.0;
                  c.anchorTicks = 0;
                  c.anchorTime = 0;
                  if(!m_registry.RestoreCycle(dir, c) || !EnsureCurrentAnchor(dir, now, why))
                  {
                     if(why == "") why = "failed to rebuild ARMED threshold anchor after Core trim";
                     return false;
                  }
                  Log_Info("Recovery", "T13 " + Recovery_DirectionName(dir) +
                           " threshold anchor rebuilt after confirmed Core trim");
               }
            }
         }

         UpdateBrokerMetrics(dir);
      }

      SeedLatestRelevantCursor();
      m_dirty = true;
      string saveWhy = "";
      if(!SaveState(saveWhy))
      {
         why = "confirmed side mutation could not be persisted: " + saveWhy;
         return false;
      }
      Log_Info("Recovery", "T13 " + Recovery_DirectionName(dir) +
               " side mutation reconciled and persisted; coordinator may release");
      return true;
   }
'''
          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh',
              '''\n\n\n   bool StartupReconcile(CExecutionLayer &exec, string &why)''',
              side_method + '''\n\n   bool StartupReconcile(CExecutionLayer &exec, string &why)''')

          # 4) Coordinator includes policy and treats ARMED as coordinated.
          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh',
              '''#include "RecoveryGlobalFlatten.mqh"\n#include <BlackDragon/BasketManager.mqh>''',
              '''#include "RecoveryGlobalFlatten.mqh"\n#include "RecoveryMutationPolicy.mqh"\n#include <BlackDragon/BasketManager.mqh>''')

          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh',
              '''bool Recovery_ExitStateNeedsCoordination(const eRecoveryState state)\n{\n   return state != recovery_CORE_ONLY &&\n          state != recovery_ARMED &&\n          state != recovery_COMPLETED;\n}''',
              '''bool Recovery_ExitStateNeedsCoordination(const eRecoveryState state)\n{\n   // T13: once ARMED, any Core topology mutation belongs to Recovery lifecycle.\n   return state != recovery_CORE_ONLY &&\n          state != recovery_COMPLETED;\n}''')

          old_begin = '''      int idx = Index(dir);\n      if(m_cycle[idx].reconcileHold) return recovery_EXIT_BLOCKED;\n      if(!CycleRequiresCoordination(dir)) return recovery_EXIT_BYPASS;\n      if(firstTicket == 0 && secondTicket == 0) return recovery_EXIT_BLOCKED;\n      if(m_cycle[idx].active) return recovery_EXIT_LATCHED;'''
          new_begin = '''      int idx = Index(dir);\n      if(m_cycle[idx].reconcileHold) return recovery_EXIT_BLOCKED;\n\n      // T13: Overlap is a non-emergency topology mutation. Let it bypass only\n      // before Recovery owns the cycle, coordinate it in stable Recovery\n      // states, and DEFER while T4/T5/T6 is mutating/pausing/reconciling.\n      if(reason == recovery_EXIT_REASON_LEGACY_OVERLAP)\n      {\n         SRecoveryCycle cycle;\n         m_recovery.GetCycle(dir, cycle);\n         eRecoveryOverlapPolicy p = Recovery_OverlapPolicyPure(cycle.state);\n         if(p == recovery_OVERLAP_BYPASS) return recovery_EXIT_BYPASS;\n         if(p == recovery_OVERLAP_DEFER || !m_recovery.ActiveReady())\n            return recovery_EXIT_BLOCKED;\n      }\n      else if(!CycleRequiresCoordination(dir))\n         return recovery_EXIT_BYPASS;\n\n      if(firstTicket == 0 && secondTicket == 0) return recovery_EXIT_BLOCKED;\n      if(m_cycle[idx].active) return recovery_EXIT_LATCHED;'''
          replace_once('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh', old_begin, new_begin)

          # Retry only coordinator-owned finalization holds. External mutations
          # remain intentionally fail-closed and are never auto-cleared.
          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh',
              '''   bool DriveCycle(const int idx, const datetime now, string &why)\n   {\n      if(m_cycle[idx].reconcileHold && !m_cycle[idx].active) return true;\n      if(!m_cycle[idx].active) return false;''',
              '''   bool DriveCycle(const int idx, const datetime now, string &why)\n   {\n      if(m_cycle[idx].reconcileHold && !m_cycle[idx].active)\n      {\n         if(m_cycle[idx].kind == recovery_EXIT_COORD_EXTERNAL)\n         {\n            why = "external Core/Recovery mutation remains fail-closed pending explicit reconciliation";\n            return true;\n         }\n         string finalizeWhy = "";\n         if(m_recovery != NULL &&\n            m_recovery.FinalizeConfirmedSideMutation(*m_exec, Direction(idx), now, finalizeWhy))\n         {\n            Log_Info("Recovery", "T13 deferred side-mutation finalization succeeded for " +\n                     Recovery_DirectionName(Direction(idx)));\n            ResetCycle(idx);\n            return false;\n         }\n         why = "T13 side-mutation finalizer still blocked: " + finalizeWhy;\n         return true;\n      }\n      if(!m_cycle[idx].active) return false;''')

          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh',
              '''      if(step == recovery_EXIT_STEP_RECONCILE_HOLD)\n      {\n         m_cycle[idx].active = false;\n         SRecoveryCycle cycle;\n         m_recovery.GetCycle(dir, cycle);\n         if(currentCoreUnits <= 0 && activeHedgeUnits <= 0)\n            m_cycle[idx].reconcileHold = false;\n         else if(cycle.state == recovery_CORE_ONLY && activeHedgeUnits <= 0 &&\n                 !m_exec.HasPendingForCycle(cycleKey))\n            m_cycle[idx].reconcileHold = false;\n         else\n            m_cycle[idx].reconcileHold = true;\n         return m_cycle[idx].reconcileHold;\n      }\n\n      if(step == recovery_EXIT_STEP_COMPLETE)\n      {\n         bool partial = m_cycle[idx].kind == recovery_EXIT_COORD_TICKETS;\n         m_cycle[idx].active = false;\n         // Deterministic Overlap changes cycle exposure but does not flatten it;\n         // T9 must rebuild registry metrics/anchors before normal ACTIVE work.\n         m_cycle[idx].reconcileHold = partial &&\n                                      (currentCoreUnits > 0 || activeHedgeUnits > 0);\n         return m_cycle[idx].reconcileHold;\n      }''',
              '''      if(step == recovery_EXIT_STEP_RECONCILE_HOLD)\n      {\n         m_cycle[idx].active = false;\n         if(currentCoreUnits <= 0 && activeHedgeUnits <= 0 &&\n            m_cycle[idx].kind == recovery_EXIT_COORD_EXTERNAL)\n         {\n            string finalizeWhy = "";\n            if(m_recovery.FinalizeConfirmedSideMutation(*m_exec, dir, now, finalizeWhy))\n            {\n               Log_Info("Recovery", "T13 externally-flattened " + Recovery_DirectionName(dir) +\n                        " terminalized safely");\n               ResetCycle(idx);\n               return false;\n            }\n            why = "T13 external flat finalizer blocked: " + finalizeWhy;\n         }\n         // Partial/unknown external changes remain fail-closed.\n         m_cycle[idx].reconcileHold = true;\n         return true;\n      }\n\n      if(step == recovery_EXIT_STEP_COMPLETE)\n      {\n         // T13 replaces the old permanent partial reconcileHold with an\n         // explicit side-scoped broker reconciliation + durable save. This\n         // handles both full-side/magic closes and stable-state Overlap.\n         string finalizeWhy = "";\n         if(!m_recovery.FinalizeConfirmedSideMutation(*m_exec, dir, now, finalizeWhy))\n         {\n            m_cycle[idx].active = false;\n            m_cycle[idx].reconcileHold = true;\n            why = "T13 side-mutation finalizer blocked: " + finalizeWhy;\n            return true;\n         }\n         Log_Info("Recovery", "T13 coordinated Core mutation complete for " +\n                  Recovery_DirectionName(dir) + " — Recovery state persisted");\n         ResetCycle(idx);\n         return false;\n      }''')

          # 5) DCA observability: no more silent stale-state block.
          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryDca.mqh',
              '''      if(m_recovery == NULL || m_basket == NULL) return false;\n      if(!m_recovery.ActiveReady()) return false;''',
              '''      if(m_recovery == NULL || m_basket == NULL)\n      {\n         Log_Warn("Recovery", "dcagate" + (string)dir,\n                  "Core DCA blocked: Recovery engine/basket adapter unavailable");\n         return false;\n      }\n      if(!m_recovery.ActiveReady())\n      {\n         Log_Warn("Recovery", "dcagate" + (string)dir,\n                  "Core DCA blocked: Recovery ACTIVE is not reconciled/ready");\n         return false;\n      }''')

          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryDca.mqh',
              '''      if(!Recovery_DcaStateAllows(RecoveryMode_, ContinueDcaAfterHedge_, cycle.state))\n         return false;''',
              '''      if(!Recovery_DcaStateAllows(RecoveryMode_, ContinueDcaAfterHedge_, cycle.state))\n      {\n         Log_Warn("Recovery", "dcastate" + (string)dir,\n                  "Core DCA blocked by Recovery state=" + Recovery_StateName(cycle.state) +\n                  "; ContinueDcaAfterHedge=" + (ContinueDcaAfterHedge_ ? "true" : "false"));\n         return false;\n      }''')

          replace_once(
              'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryDca.mqh',
              '''         if(!Recovery_ReadDcaHedgeMetrics(_Symbol, RecoveryMagic_, recoveryDir,\n                                          needCorridor, hedgeLots, hedgeBE))\n            return false;''',
              '''         if(!Recovery_ReadDcaHedgeMetrics(_Symbol, RecoveryMagic_, recoveryDir,\n                                          needCorridor, hedgeLots, hedgeBE))\n         {\n            Log_Warn("Recovery", "dcametric" + (string)dir,\n                     "Core DCA blocked: required live Recovery hedge metrics are unavailable");\n            return false;\n         }''')

          # 6) Dedicated deterministic T13 script; existing 246 regression remains untouched.
          test = r'''//+------------------------------------------------------------------+
//| RunRecoveryMutationTests.mq5 — T13 deterministic policy tests    |
//+------------------------------------------------------------------+
+#property script_show_inputs
+#include <BlackDragon/Config.mqh>
+#include <BlackDragon/Recovery/RecoveryTypes.mqh>
+#include <BlackDragon/Recovery/RecoveryStateMachine.mqh>
+#include <BlackDragon/Recovery/RecoveryMutationPolicy.mqh>
+
+int g_pass = 0;
+int g_fail = 0;
+
+void Check(const string name, const bool cond)
+{
+   if(cond) { g_pass++; return; }
+   g_fail++;
+   Print("FAIL: ", name);
+}
+
+void OnStart()
+{
+   Check("CORE_ONLY overlap bypass", Recovery_OverlapPolicyPure(recovery_CORE_ONLY) == recovery_OVERLAP_BYPASS);
+   Check("COMPLETED overlap bypass", Recovery_OverlapPolicyPure(recovery_COMPLETED) == recovery_OVERLAP_BYPASS);
+   Check("ARMED overlap coordinated", Recovery_OverlapPolicyPure(recovery_ARMED) == recovery_OVERLAP_COORDINATE);
+   Check("HEDGE_ACTIVE overlap coordinated", Recovery_OverlapPolicyPure(recovery_HEDGE_ACTIVE) == recovery_OVERLAP_COORDINATE);
+   Check("HEDGE_LOCKED overlap coordinated", Recovery_OverlapPolicyPure(recovery_HEDGE_LOCKED) == recovery_OVERLAP_COORDINATE);
+
+   Check("HEDGE_BUILDING overlap deferred", Recovery_OverlapPolicyPure(recovery_HEDGE_BUILDING) == recovery_OVERLAP_DEFER);
+   Check("HEDGE_TP_PENDING overlap deferred", Recovery_OverlapPolicyPure(recovery_HEDGE_TP_PENDING) == recovery_OVERLAP_DEFER);
+   Check("CORE_CLOSE_PENDING overlap deferred", Recovery_OverlapPolicyPure(recovery_CORE_CLOSE_PENDING) == recovery_OVERLAP_DEFER);
+   Check("HEDGE_LOCK_PENDING overlap deferred", Recovery_OverlapPolicyPure(recovery_HEDGE_LOCK_PENDING) == recovery_OVERLAP_DEFER);
+   Check("REHEDGE_PENDING overlap deferred", Recovery_OverlapPolicyPure(recovery_REHEDGE_PENDING) == recovery_OVERLAP_DEFER);
+   Check("PAUSE_SOFT overlap deferred", Recovery_OverlapPolicyPure(recovery_PAUSE_SOFT) == recovery_OVERLAP_DEFER);
+   Check("PAUSE_HARD overlap deferred", Recovery_OverlapPolicyPure(recovery_PAUSE_HARD) == recovery_OVERLAP_DEFER);
+   Check("RECONCILE overlap deferred", Recovery_OverlapPolicyPure(recovery_RECONCILE_REQUIRED) == recovery_OVERLAP_DEFER);
+   Check("GLOBAL_STOP overlap deferred", Recovery_OverlapPolicyPure(recovery_GLOBAL_STOP) == recovery_OVERLAP_DEFER);
+
+   Check("CORE_ONLY stable side mutation", Recovery_SideMutationStableStatePure(recovery_CORE_ONLY));
+   Check("ARMED stable side mutation", Recovery_SideMutationStableStatePure(recovery_ARMED));
+   Check("HEDGE_ACTIVE stable side mutation", Recovery_SideMutationStableStatePure(recovery_HEDGE_ACTIVE));
+   Check("HEDGE_LOCKED stable side mutation", Recovery_SideMutationStableStatePure(recovery_HEDGE_LOCKED));
+   Check("COMPLETED stable side mutation", Recovery_SideMutationStableStatePure(recovery_COMPLETED));
+   Check("HEDGE_BUILDING not stable", !Recovery_SideMutationStableStatePure(recovery_HEDGE_BUILDING));
+   Check("HEDGE_TP_PENDING not stable", !Recovery_SideMutationStableStatePure(recovery_HEDGE_TP_PENDING));
+   Check("CORE_CLOSE_PENDING not stable", !Recovery_SideMutationStableStatePure(recovery_CORE_CLOSE_PENDING));
+   Check("HEDGE_LOCK_PENDING not stable", !Recovery_SideMutationStableStatePure(recovery_HEDGE_LOCK_PENDING));
+   Check("REHEDGE_PENDING not stable", !Recovery_SideMutationStableStatePure(recovery_REHEDGE_PENDING));
+
+   Check("T13 ARMED may disarm to CORE_ONLY after confirmed trim",
+         Recovery_StateTransitionAllowed(recovery_ARMED, recovery_CORE_ONLY));
+   Check("T13 ARMED still may build hedge",
+         Recovery_StateTransitionAllowed(recovery_ARMED, recovery_HEDGE_BUILDING));
+
+   PrintFormat("Recovery T13 mutation policy tests: %d passed, %d failed", g_pass, g_fail);
+   if(g_fail == 0) Print("ALL GREEN — T13 side-mutation/Overlap deterministic policy passed.");
+}
+'''
          Path('BlackDragon_v14/Scripts/BlackDragon/Tests/RunRecoveryMutationTests.mq5').write_text(test, encoding='utf-8')

          # Static contract checks: the exact bug patterns must be absent/present.
          coord = Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh').read_text(encoding='utf-8')
          eng = Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh').read_text(encoding='utf-8')
          assert 'partial &&\n                                      (currentCoreUnits > 0 || activeHedgeUnits > 0)' not in coord
          assert 'FinalizeConfirmedSideMutation' in coord
          assert 'FinalizeConfirmedSideMutation' in eng
          assert 'recovery_OVERLAP_DEFER' in coord
          assert 'ARMED -> CORE_ONLY' in Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryStateMachine.mqh').read_text(encoding='utf-8')
          PY

      - name: Diff sanity
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff -- BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryStateMachine.mqh \
                     BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryMutationPolicy.mqh \
                     BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh \
                     BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh \
                     BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryDca.mqh \
                     BlackDragon_v14/Scripts/BlackDragon/Tests/RunRecoveryMutationTests.mq5

      - name: Commit product patch
