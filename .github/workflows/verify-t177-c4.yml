name: Verify T17.7 C4 Hedge Ladder

on:
  pull_request:
    branches: [ feat/recovery-t16-arcs-stacked ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/RunT177HedgeLadderTests.mq5'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t177_hedge_ladder_model.cpp'
      - '.github/workflows/verify-t177-c4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  t177-c4-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Run T17.7 C4 independent Hedge ladder model
        shell: bash
        run: |
          set -euo pipefail
          SRC='BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t177_hedge_ladder_model.cpp'
          g++ -std=c++17 -O2 -Wall -Wextra "$SRC" -o /tmp/t177c4
          /tmp/t177c4 | tee /tmp/t177c4.out
          grep -q 'T17.7 C4 Hedge ladder model: 20 passed, 0 failed' /tmp/t177c4.out
          grep -q 'ALL GREEN' /tmp/t177c4.out

      - name: Verify C4 source contract
        shell: python
        run: |
          from pathlib import Path

          policy=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryT177HedgeLadder.mqh').read_text(encoding='utf-8')
          runtime=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStackT177HedgeLadderC4Base.mqh').read_text(encoding='utf-8')
          engine=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh').read_text(encoding='utf-8')
          native=Path('BlackDragon_v14/Scripts/BlackDragon/Tests/RunT177HedgeLadderTests.mq5').read_text(encoding='utf-8')

          for token in ['BD_T177_HEDGE_LADDER_POLICY_REV 1',
                        'Recovery_T177EffectiveFinalCoveragePercentPure',
                        'Recovery_T177ExecutableGenerationTargetPure',
                        'Recovery_T177BuildExecutableHedgeLadderPure',
                        'gapAccumulator +=',
                        'planned > finalGenerationRawUnits',
                        'Recovery_T177StageSourceKeptPure']:
              assert token in policy
          assert 'keep the first stage' in policy.lower()
          assert 'preserving cumulative favorable-price geometry' in policy

          assert 'class CRecoveryArcsStackT177C4 : public CRecoveryArcsStackT17' in runtime
          for token in ['BuildExecutablePlanC4','DriveBuildingC4',
                        'plan[stage].gapFromPreviousPips',
                        'effectiveStageNo=stage+1',
                        'SaveBeforeMutation(why)',
                        'OpenMarketOwned',
                        'EXEC_RECONCILE_FAIL_CLOSED',
                        'trùng lot thực thi',
                        'target yêu cầu=',
                        'không vượt hard cap']:
              assert token in runtime
          assert 'Pyramid_SeqValue(m_gap, stage - 1)' not in runtime
          wait_block=runtime[runtime.index('bool DriveBuildingC4'):runtime.index('public:', runtime.index('bool DriveBuildingC4'))]
          assert 'return false;' in wait_block
          assert 'exec.HasPendingForCycle(key)) return true;' in wait_block

          scheduler_inc=engine.index('#include "RecoveryArcsStackT177Scheduler.mqh"')
          c4_inc=engine.index('#include "RecoveryArcsStackT177HedgeLadder.mqh"')
          assert scheduler_inc < c4_inc
          assert 'CRecoveryArcsStackT177C4 m_arcs;' in engine

          assert 'T17.7 C4 Hedge ladder tests:' in native
          assert 'skipped82 remaps gap81to85 as25' in native
          print('T17.7 C4 Hedge ladder source contract PASS')

      - name: Record exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"

  t177-c4-native:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$env:MT5_DIR\metaeditor64.exe")) { throw 'metaeditor64.exe not found' }
          if (-not (Test-Path "$env:MT5_DIR\terminal64.exe")) { throw 'terminal64.exe not found' }

      - name: Warm terminal and mirror exact tree
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "checkout mismatch actual=$actual expected=$env:SOURCE_SHA" }
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 40
          $t | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')) {
            New-Item -ItemType Directory -Force -Path "$mql5\$d" | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force
          }
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")) {
            if(Test-Path $r) {
              Get-ChildItem $r -Recurse -File | Where-Object {$_.Extension -in '.mq5','.mqh'} | ForEach-Object {
                $txt=Get-Content $_.FullName -Raw -Encoding UTF8
                [System.IO.File]::WriteAllText($_.FullName,$txt,$enc)
              }
            }
          }

      - name: Compile exact C4 targets
        shell: pwsh
        run: |
          $editor="$env:MT5_DIR\metaeditor64.exe"; $mql5="$env:MT5_DIR\MQL5"; $build="$env:GITHUB_WORKSPACE\build-t177c4"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $targets=@(
            @{N='RunT177HedgeLadderTests';S="$mql5\Scripts\BlackDragon\Tests\RunT177HedgeLadderTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunT177HedgeLadderTests.ex5"},
            @{N='BlackDragon';S="$mql5\Experts\BlackDragon\BlackDragon.mq5";O="$mql5\Experts\BlackDragon\BlackDragon.ex5"}
          )
          foreach($t in $targets) {
            $log="$build\$($t.N).log"
            Start-Process $editor -ArgumentList "/compile:`"$($t.S)`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow
            if(-not(Test-Path $log)){throw "$($t.N): no compile log"}
            $text=Get-Content $log -Encoding Unicode -Raw; Write-Host $text
            $err=@(($text -split "`r?`n")|Where-Object{$_ -match ' : error '})
            $warn=@(($text -split "`r?`n")|Where-Object{$_ -match ' : warning '})
            if(-not(Test-Path $t.O)){throw "$($t.N): EX5 missing"}
            if($err.Count -or $warn.Count){throw "$($t.N): $($err.Count) errors / $($warn.Count) warnings"}
            Copy-Item $t.O $build -Force
          }
          $head=(git rev-parse HEAD).Trim(); $tree=(git show -s --format=%T HEAD).Trim()
          if($head -ne $env:SOURCE_SHA){throw 'provenance HEAD mismatch'}
          $eaHash=(Get-FileHash (Join-Path $build 'BlackDragon.ex5') -Algorithm SHA256).Hash.ToLowerInvariant()
          "HEAD=$head`nTREE=$tree`nBLACKDRAGON_EX5_SHA256=$eaHash`n" | Out-File "$build\PROVENANCE.txt" -Encoding utf8
          Write-Host "T17.7 C4 MetaEditor PASS: 0 errors / 0 warnings"
          Write-Host "HEAD=$head TREE=$tree BlackDragon.ex5 SHA256=$eaHash"

      - name: Execute native C4 Hedge ladder script
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t177c4"; $logDir="$env:MT5_DIR\MQL5\Logs"
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $cfg=Join-Path $build 'RunT177HedgeLadderTests.ini'
          $cfgText="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\RunT177HedgeLadderTests`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n"
          [IO.File]::WriteAllText($cfg,$cfgText,[Text.Encoding]::Unicode)
          $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru
          $deadline=(Get-Date).AddMinutes(4)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'T17.7 C4 native timeout'}
          $logs=Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          if(-not $logs){throw 'T17.7 C4 native log missing'}
          $latest=$logs[-1]
          Copy-Item $latest.FullName (Join-Path $build 'RunT177HedgeLadderTests-native.log') -Force
          $raw=Get-Content $latest.FullName -Raw; Write-Host $raw
          $m=[regex]::Match($raw,'T17\.7 C4 Hedge ladder tests:\s*(\d+) passed,\s*(\d+) failed')
          if(-not $m.Success){throw 'T17.7 C4 summary missing'}
          if([int]$m.Groups[1].Value -ne 20 -or [int]$m.Groups[2].Value -ne 0 -or $raw -notmatch 'ALL GREEN')
          { throw 'T17.7 C4 expected 20/0' }
          Write-Host 'T17.7 C4 native PASS 20/0'

      - name: Package exact C4 evidence
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t177c4"
          Compress-Archive "$build\*" "$env:GITHUB_WORKSPACE\BlackDragon-T17.7-C4-evidence.zip" -Force
          $h=(Get-FileHash "$env:GITHUB_WORKSPACE\BlackDragon-T17.7-C4-evidence.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "PACKAGE_SHA256=$h" | Add-Content "$build\PROVENANCE.txt"
          Write-Host "PACKAGE_SHA256=$h"

      - name: Upload exact C4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t177-c4-exact-tree
          path: |
            build-t177c4/
            BlackDragon-T17.7-C4-evidence.zip
          if-no-files-found: error
