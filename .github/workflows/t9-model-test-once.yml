name: Run T9 persistence model suite once
on:
  push:
    branches:
      - feat/adaptive-recovery-t9-persistence-active
    paths:
      - .github/workflows/t9-model-test-once.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-recovery-t9-persistence-active
      - name: Regular compile and run
        shell: bash
        run: |
          set -euo pipefail
          src='BlackDragon_v14/Scripts/BlackDragon/Tests/recovery_t9_persistence_suite.cpp'
          g++ -std=c++17 -Wall -Wextra -pedantic "$src" -o /tmp/t9_regular
          /tmp/t9_regular
      - name: ASan UBSan compile and run
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          src='BlackDragon_v14/Scripts/BlackDragon/Tests/recovery_t9_persistence_suite.cpp'
          g++ -std=c++17 -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer "$src" -o /tmp/t9_san
          /tmp/t9_san
