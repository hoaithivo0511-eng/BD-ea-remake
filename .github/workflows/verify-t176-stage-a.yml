name: Verify T17.6 Stage A Hardening

on:
  push:
    branches: [ feat/t17-full-pyramid ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/RunT176HardeningTests.mq5'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t176_model.cpp'
      - '.github/workflows/verify-t176-stage-a.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  t176-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Run independent T17.6 model oracle
        shell: bash
        run: |
          set -euo pipefail
          SRC='BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t176_model.cpp'
          g++ -std=c++17 -O2 -Wall -Wextra "$SRC" -o /tmp/t176
          /tmp/t176 | tee /tmp/t176.out
          grep -q 'T17.6 pure model: 10 passed, 0 failed' /tmp/t176.out
          grep -q 'ALL GREEN' /tmp/t176.out

      - name: Verify T17.6 Stage-A source invariants
        shell: python
        run: |
          import re
          from pathlib import Path
          t16=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryT16Config.mqh').read_text(encoding='utf-8')
          hedge=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStackT17Pyramid.mqh').read_text(encoding='utf-8')
          cfg=Path('BlackDragon_v14/Include/BlackDragon/Pyramid/PyramidConfig.mqh').read_text(encoding='utf-8')
          native=Path('BlackDragon_v14/Scripts/BlackDragon/Tests/RunT176HardeningTests.mq5').read_text(encoding='utf-8')

          assert '#define BD_T176_HEDGE_POLICY_REV 1' in t16
          assert 'Recovery_T176RebasedGenerationTargetPure' in t16
          assert 'Recovery_T17AttainableCoveragePercentPure' in t16
          assert 'Recovery_T17CrossInputsValidPure' in t16
          assert 'HedgePyramidMode_ == hedge_pyramid_TAT ? policy : HEDGE_CAN_BANG' in t16
          assert 't176HedgePolicyRev=' in t16

          start=hedge.index('long StageRawUnits(')
          stop=hedge.index('long StageUnits(', start)
          stage=hedge[start:stop]
          assert 'ARCS_XEP_LOP' not in stage
          assert 'return desired > before ? desired - before : 0;' in stage
          assert 'Recovery_T176RebasedGenerationTargetPure' in hedge
          assert 'final Hedge Pyramid target drift khi generation đang BUILDING' not in hedge
          assert 'generation live volume vượt persisted target' in hedge
          assert 'target rebase' in hedge

          inputs=re.findall(r'^input\s+(?!group\b)[^\n]+', cfg, flags=re.M)
          assert len(inputs)==20, f'Pyramid input compatibility changed: {len(inputs)}'
          for token in ['rebase raises BUILDING target','post-Hedge DCA cannot demand unreachable staged coverage']:
              assert token in native
          print('T17.6 Stage-A source invariants PASS')

      - name: Record exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"

  t176-metaeditor-native:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$env:MT5_DIR\metaeditor64.exe")) { throw 'metaeditor64.exe not found' }
          if (-not (Test-Path "$env:MT5_DIR\terminal64.exe")) { throw 'terminal64.exe not found' }

      - name: Warm terminal and mirror exact tree
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "checkout mismatch actual=$actual expected=$env:SOURCE_SHA" }
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 40
          $t | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')) {
            New-Item -ItemType Directory -Force -Path "$mql5\$d" | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force
          }
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")) {
            if(Test-Path $r) {
              Get-ChildItem $r -Recurse -File | Where-Object {$_.Extension -in '.mq5','.mqh'} | ForEach-Object {
                $txt=Get-Content $_.FullName -Raw -Encoding UTF8
                [System.IO.File]::WriteAllText($_.FullName,$txt,$enc)
              }
            }
          }

      - name: Compile exact T17.6 Stage-A targets
        shell: pwsh
        run: |
          $editor="$env:MT5_DIR\metaeditor64.exe"; $mql5="$env:MT5_DIR\MQL5"; $build="$env:GITHUB_WORKSPACE\build-t176a"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $targets=@(
            @{N='RunT176HardeningTests';S="$mql5\Scripts\BlackDragon\Tests\RunT176HardeningTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunT176HardeningTests.ex5"},
            @{N='RunPyramidT17Tests';S="$mql5\Scripts\BlackDragon\Tests\RunPyramidT17Tests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunPyramidT17Tests.ex5"},
            @{N='BlackDragon';S="$mql5\Experts\BlackDragon\BlackDragon.mq5";O="$mql5\Experts\BlackDragon\BlackDragon.ex5"}
          )
          foreach($t in $targets) {
            $log="$build\$($t.N).log"
            Start-Process $editor -ArgumentList "/compile:`"$($t.S)`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow
            if(-not(Test-Path $log)){throw "$($t.N): no compile log"}
            $text=Get-Content $log -Encoding Unicode -Raw; Write-Host $text
            $err=@(($text -split "`r?`n")|Where-Object{$_ -match ' : error '})
            $warn=@(($text -split "`r?`n")|Where-Object{$_ -match ' : warning '})
            if(-not(Test-Path $t.O)){throw "$($t.N): EX5 missing"}
            if($err.Count -or $warn.Count){throw "$($t.N): $($err.Count) errors / $($warn.Count) warnings"}
            Copy-Item $t.O $build -Force
          }
          $head=(git rev-parse HEAD).Trim(); $tree=(git show -s --format=%T HEAD).Trim()
          if($head -ne $env:SOURCE_SHA){throw 'provenance HEAD mismatch'}
          $eaHash=(Get-FileHash (Join-Path $build 'BlackDragon.ex5') -Algorithm SHA256).Hash.ToLowerInvariant()
          "HEAD=$head`nTREE=$tree`nBLACKDRAGON_EX5_SHA256=$eaHash`n" | Out-File "$build\PROVENANCE.txt" -Encoding utf8
          Write-Host "T17.6 Stage-A MetaEditor PASS: 0 errors / 0 warnings"
          Write-Host "HEAD=$head TREE=$tree BlackDragon.ex5 SHA256=$eaHash"

      - name: Execute native T17.6 hardening script
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t176a"; $logDir="$env:MT5_DIR\MQL5\Logs"
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $cfg=Join-Path $build 'RunT176HardeningTests.ini'
          $cfgText="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\RunT176HardeningTests`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n"
          [IO.File]::WriteAllText($cfg,$cfgText,[Text.Encoding]::Unicode)
          $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru
          $deadline=(Get-Date).AddMinutes(4)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'T17.6 hardening native timeout'}
          $logs=Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          if(-not $logs){throw 'T17.6 hardening native log missing'}
          $latest=$logs[-1]
          Copy-Item $latest.FullName (Join-Path $build 'RunT176HardeningTests-native.log') -Force
          $raw=Get-Content $latest.FullName -Raw; Write-Host $raw
          $m=[regex]::Match($raw,'T17\.6 hardening tests:\s*(\d+) passed,\s*(\d+) failed')
          if(-not $m.Success){throw 'T17.6 hardening summary missing'}
          if([int]$m.Groups[1].Value -ne 12 -or [int]$m.Groups[2].Value -ne 0 -or $raw -notmatch 'ALL GREEN')
          { throw 'T17.6 hardening expected 12/0' }
          Write-Host 'T17.6 hardening native PASS 12/0'

      - name: Execute established native T17.5 regression script
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t176a"; $logDir="$env:MT5_DIR\MQL5\Logs"
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $cfg=Join-Path $build 'RunPyramidT17Tests.ini'
          $cfgText="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\RunPyramidT17Tests`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n"
          [IO.File]::WriteAllText($cfg,$cfgText,[Text.Encoding]::Unicode)
          $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru
          $deadline=(Get-Date).AddMinutes(4)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'T17.5 regression native timeout'}
          $logs=Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          if(-not $logs){throw 'T17.5 regression native log missing'}
          $latest=$logs[-1]
          Copy-Item $latest.FullName (Join-Path $build 'RunPyramidT17Tests-native.log') -Force
          $raw=Get-Content $latest.FullName -Raw; Write-Host $raw
          $m=[regex]::Match($raw,'Pyramid T17\.5 tests:\s*(\d+) passed,\s*(\d+) failed')
          if(-not $m.Success){throw 'T17.5 regression summary missing'}
          if([int]$m.Groups[1].Value -ne 116 -or [int]$m.Groups[2].Value -ne 0 -or $raw -notmatch 'ALL GREEN')
          { throw 'T17.5 regression expected 116/0' }
          Write-Host 'T17.5 regression native PASS 116/0'

      - name: Package exact T17.6 Stage-A evidence
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t176a"
          Compress-Archive "$build\*" "$env:GITHUB_WORKSPACE\BlackDragon-T17.6-Stage-A-evidence.zip" -Force
          $h=(Get-FileHash "$env:GITHUB_WORKSPACE\BlackDragon-T17.6-Stage-A-evidence.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "PACKAGE_SHA256=$h" | Add-Content "$build\PROVENANCE.txt"
          Write-Host "PACKAGE_SHA256=$h"

      - name: Upload exact T17.6 Stage-A evidence
        uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t176-stage-a-exact-tree
          path: |
            build-t176a/
            BlackDragon-T17.6-Stage-A-evidence.zip
          if-no-files-found: error
