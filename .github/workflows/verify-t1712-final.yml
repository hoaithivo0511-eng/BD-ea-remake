name: Verify T17.12 Final Owner QA

on:
  push:
    branches: [ feat/t17-full-pyramid ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/**'
      - 'BlackDragon_v14/docs/vibecode/**'
      - '.github/workflows/verify-t1712-final.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  final-model-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"
          mkdir -p build-t1712-model
          printf 'HEAD=%s\nTREE=%s\nRUN_ID=%s\nRUN_ATTEMPT=%s\n' \
            "$(git rev-parse HEAD)" "$(git show -s --format=%T HEAD)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > build-t1712-model/PROVENANCE.txt

      - name: Run T1-T16 established model matrix
        shell: bash
        run: |
          set -euo pipefail
          ROOT='BlackDragon_v14/Scripts/BlackDragon/Tests'
          suites=(offline_suite.cpp recovery_foundation_suite.cpp execution_t2_suite.cpp recovery_t3_shadow_suite.cpp recovery_t4_bundle_suite.cpp recovery_t5_exit_suite.cpp recovery_t6_lock_suite.cpp recovery_t7_dca_suite.cpp recovery_t8_coord_suite.cpp recovery_t9_persistence_suite.cpp recovery_t10_runtime_guard_suite.cpp execution_t14_identity_suite.cpp recovery_t16_arcs_suite.cpp recovery_t16_event_order_suite.cpp recovery_t162_overlap_slreject_suite.cpp recovery_t163_liveness_suite.cpp recovery_t164_reachability_suite.cpp recovery_t165_guard_margin_log_suite.cpp recovery_t166_broker_min_suite.cpp)
          for src in "${suites[@]}"; do
            exe="/tmp/${src%.cpp}"; out="build-t1712-model/${src%.cpp}.log"
            g++ -std=c++17 -O2 -Wall -Wextra "$ROOT/$src" -o "$exe"
            "$exe" | tee "$out"
            grep -Eq '(^|[^0-9])0 failed([^0-9]|$)' "$out"
          done
          echo 'FINAL T1-T16 MODEL MATRIX GREEN'

      - name: Run T17-T17.12 model matrix
        shell: bash
        run: |
          set -euo pipefail
          R='BlackDragon_v14/Scripts/BlackDragon/Tests'
          run(){ src="$1"; phrase="$2"; exe="/tmp/${src%.cpp}"; out="build-t1712-model/${src%.cpp}.log"; g++ -std=c++17 -O2 -Wall -Wextra "$R/$src" -o "$exe"; "$exe" | tee "$out"; grep -q "$phrase" "$out"; grep -q 'ALL GREEN' "$out"; }
          run pyramid_t17_model.cpp 'Pyramid T17.5 model: 85 passed, 0 failed'
          run pyramid_t176_model.cpp 'T17.6 pure model: 10 passed, 0 failed'
          run pyramid_t177_scheduler_model.cpp 'T17.7 C1 scheduler model: 11 passed, 0 failed'
          run pyramid_t177_anchor_model.cpp 'T17.7 C2 anchor model: 14 passed, 0 failed'
          run pyramid_t177_overlap_model.cpp 'T17.7 C3 Overlap model: 26 passed, 0 failed'
          run pyramid_t177_hedge_ladder_model.cpp 'T17.7 C4 Hedge ladder model: 20 passed, 0 failed'
          run pyramid_t177_migration_model.cpp 'T17.7 C5 migration model: 32 passed, 0 failed'
          run pyramid_t177_journal_model.cpp 'T17.7 C6 journal model: 24 passed, 0 failed'
          run pyramid_t178_runtime_model.cpp 'T17.8 runtime fix model: 23 passed, 0 failed'
          run pyramid_t179_realtp_model.cpp 'T17.9 REAL-TP interleave model: 40 passed, 0 failed'
          run unit_system_t1710_model.cpp 'T17.10 unit model: 36 passed, 0 failed'
          run t1711_runtime_model.cpp 'T17.11 runtime model: 25 passed, 0 failed'
          run t1712_runtime_model.cpp 'T17.12 reference model: 25 passed, 0 failed'
          echo 'FINAL T17.12 MODEL MATRIX GREEN'

      - name: Frozen T17.10 source contract
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          r=Path('BlackDragon_v14/Include/BlackDragon')
          arcs=(r/'Recovery/RecoveryArcsStackT177HedgeLadder.mqh').read_text(encoding='utf-8')
          coord=(r/'Recovery/RecoveryExitCoordinator.mqh').read_text(encoding='utf-8')
          engine=(r/'Recovery/RecoveryEngine.mqh').read_text(encoding='utf-8')
          cfg=(r/'Recovery/RecoveryT16Config.mqh').read_text(encoding='utf-8')
          pyr=(r/'Pyramid/PyramidConfig.mqh').read_text(encoding='utf-8')
          logger=(r/'Logger.mqh').read_text(encoding='utf-8')
          unit=(r/'UnitSystem.mqh').read_text(encoding='utf-8')
          config=(r/'Config.mqh').read_text(encoding='utf-8')
          basket=(r/'BasketManager.mqh').read_text(encoding='utf-8')
          strategy=(r/'StrategyT176Base.mqh').read_text(encoding='utf-8')
          execution=(r/'ExecutionLayer.mqh').read_text(encoding='utf-8')
          assert 'CRecoveryArcsStackT178' in arcs
          assert 'Recovery_T178PersistenceOnlyYieldPure' in arcs
          assert 'CRecoveryExitCoordinatorT178' in coord
          assert 'BD_T178_TP_VERSION 1' in coord
          assert 'DEAL_REASON_TP' in coord and 'BeginFullSideClose' in coord
          assert 'ClassifyCoreRealTpDealT179' in coord
          assert 'PrepareRealTpEpoch' in coord and 'ObserveRealTpSettlement' in coord
          assert 'BlocksSameSideAdd' in coord and 'POSITION_IDENTIFIER' in coord
          assert (r/'Recovery/RecoveryT179RealTpPolicy.mqh').exists()
          assert 'CRecoveryArcsStackT177C4 m_arcs;' in engine
          assert 'Recovery_T177SemanticFingerprintC5' in cfg
          assert 'THÔNG TIN |' in logger and 'CẢNH BÁO |' in logger and 'LỖI |' in logger
          assert Path('BlackDragon_v14/docs/vibecode/T17_9_OWNER_QA_CHECKLIST.md').exists()
          assert Path('BlackDragon_v14/docs/vibecode/T17_11_OWNER_QA_CHECKLIST.md').exists()
          assert Path('BlackDragon_v14/docs/vibecode/T17_12_OWNER_QA_CHECKLIST.md').exists()
          assert 'unit_LEGACY_COMPAT' in unit and 'unit_PIP_UNIFIED' in unit
          assert 'Config_BindUnitProfile' in config and 'Cfg.DcaInputUnitPrice' in config
          assert 'Cfg.TPPrice' in basket and 'Unit_CostShiftPricePure' in basket
          assert 'DistancePrice(dcaSide.count, Cfg.DcaInputUnitPrice)' in strategy
          assert 'Exec_DeviationFromPrice' in execution
          assert 'ArraySort(work);' in pyr
          def blob(path): return subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
          assert blob(r/'Recovery/RecoveryArcsStackT177HedgeLadderC4Base.mqh') == '32100a677f2e70247c0da9d41fd29427440afdb3'
          assert blob(r/'Recovery/RecoveryExitCoordinatorT177Base.mqh') == 'ebbcbf8493381603c4dc89c11bee31e1fc1dad57'
          assert blob(r/'Pyramid/PyramidConfig.mqh') == '2427f5cdb0908c000d8d77bd252a6bffeda90490'
          print('FINAL T17.10 SOURCE CONTRACT GREEN; HEDGE SEMANTICS FROZEN, UNIT POLICY VERSIONED')

      - name: T17.11 source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 BlackDragon_v14/Scripts/BlackDragon/Tests/t1711_source_contract.py | tee build-t1712-model/t1711-source.log

      - name: T17.12 source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 BlackDragon_v14/Scripts/BlackDragon/Tests/t1712_source_contract.py | tee build-t1712-model/t1712-source.log

      - uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t1712-model-source
          path: build-t1712-model/
          if-no-files-found: error

  final-native-regression:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if(-not(Test-Path "$env:MT5_DIR\metaeditor64.exe")){throw 'metaeditor64.exe not found'}
          if(-not(Test-Path "$env:MT5_DIR\terminal64.exe")){throw 'terminal64.exe not found'}

      - name: Mirror exact tree
        shell: pwsh
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA){throw 'checkout mismatch'}
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 40
          $t|Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')){New-Item -ItemType Directory -Force -Path "$mql5\$d"|Out-Null;Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force}
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")){if(Test-Path $r){Get-ChildItem $r -Recurse -File|Where-Object{$_.Extension -in '.mq5','.mqh'}|ForEach-Object{$txt=Get-Content $_.FullName -Raw -Encoding UTF8;[IO.File]::WriteAllText($_.FullName,$txt,$enc)}}}

      - name: Compile final EA and 20 native suites
        shell: pwsh
        run: |
          $mql5="$env:MT5_DIR\MQL5";$editor="$env:MT5_DIR\metaeditor64.exe";$b="$env:GITHUB_WORKSPACE\build-t1712-final";New-Item -ItemType Directory -Force $b|Out-Null
          $names=@('RunT1712RuntimeTests','RunT1711RuntimeTests','RunT1710UnitSystemTests','RunT179RealTpTests','RunT178RuntimeFixTests','RunT177SchedulerTests','RunT177AnchorTests','RunT177OverlapTests','RunT177HedgeLadderTests','RunT177MigrationTests','RunT177JournalTests','RunTests','RunRecoveryMutationTests','RunRecoveryIdentityTests','RunRecoveryArcsTests','RunRecoveryLivenessTests','RunRecoveryReachabilityTests','RunRecoveryT165Tests','RunRecoveryT166Tests','RunT176HardeningTests')
          foreach($n in $names){$src="$mql5\Scripts\BlackDragon\Tests\$n.mq5";$out="$mql5\Scripts\BlackDragon\Tests\$n.ex5";$log="$b\$n-compile.log";Start-Process $editor -ArgumentList "/compile:`"$src`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow;$x=Get-Content $log -Encoding Unicode -Raw;Write-Host $x;$e=@(($x-split"`r?`n")|Where-Object{$_-match' : error '});$w=@(($x-split"`r?`n")|Where-Object{$_-match' : warning '});if(-not(Test-Path $out)-or$e.Count-or$w.Count){throw "$n compile failed: $($e.Count) errors/$($w.Count) warnings"};Copy-Item $out $b -Force}
          $src="$mql5\Experts\BlackDragon\BlackDragon.mq5";$out="$mql5\Experts\BlackDragon\BlackDragon.ex5";$log="$b\BlackDragon-compile.log";Start-Process $editor -ArgumentList "/compile:`"$src`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow;$x=Get-Content $log -Encoding Unicode -Raw;Write-Host $x;$e=@(($x-split"`r?`n")|Where-Object{$_-match' : error '});$w=@(($x-split"`r?`n")|Where-Object{$_-match' : warning '});if(-not(Test-Path $out)-or$e.Count-or$w.Count){throw "BlackDragon compile failed: $($e.Count) errors/$($w.Count) warnings"};Copy-Item $out $b -Force
          $head=(git rev-parse HEAD).Trim();$tree=(git show -s --format=%T HEAD).Trim();$hash=(Get-FileHash "$b\BlackDragon.ex5" -Algorithm SHA256).Hash.ToLowerInvariant();$size=(Get-Item "$b\BlackDragon.ex5").Length;"HEAD=$head`nTREE=$tree`nBLACKDRAGON_EX5_SHA256=$hash`nBLACKDRAGON_EX5_SIZE=$size`nRUN_ID=$env:GITHUB_RUN_ID`nRUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT`n"|Out-File "$b\PROVENANCE.txt" -Encoding utf8;Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\docs\vibecode\T17_12_OWNER_QA_CHECKLIST.md" $b -Force;Write-Host "FINAL T17.12 MetaEditor PASS 0 errors/0 warnings HEAD=$head TREE=$tree EX5=$hash SIZE=$size"

      - name: Execute final 20-suite native matrix
        shell: pwsh
        run: |
          $b="$env:GITHUB_WORKSPACE\build-t1712-final";$ld="$env:MT5_DIR\MQL5\Logs";$tests=@(
            @{N='RunT1712RuntimeTests';P='T17\.12 runtime tests:\s*(\d+) passed,\s*(\d+) failed';E=21},
            @{N='RunT1711RuntimeTests';P='T17\.11 runtime tests:\s*(\d+) passed,\s*(\d+) failed';E=30},
            @{N='RunT1710UnitSystemTests';P='T17\.10 unit tests:\s*(\d+) passed,\s*(\d+) failed';E=43},
            @{N='RunT179RealTpTests';P='T17\.9 REAL-TP tests:\s*(\d+) passed,\s*(\d+) failed';E=32},
            @{N='RunT178RuntimeFixTests';P='T17\.8 runtime fix tests:\s*(\d+) passed,\s*(\d+) failed';E=25},
            @{N='RunT177SchedulerTests';P='T17\.7 C1 scheduler tests:\s*(\d+) passed,\s*(\d+) failed';E=11},
            @{N='RunT177AnchorTests';P='T17\.7 C2 anchor tests:\s*(\d+) passed,\s*(\d+) failed';E=14},
            @{N='RunT177OverlapTests';P='T17\.7 C3 Overlap tests:\s*(\d+) passed,\s*(\d+) failed';E=26},
            @{N='RunT177HedgeLadderTests';P='T17\.7 C4 Hedge ladder tests:\s*(\d+) passed,\s*(\d+) failed';E=20},
            @{N='RunT177MigrationTests';P='T17\.7 C5 migration tests:\s*(\d+) passed,\s*(\d+) failed';E=39},
            @{N='RunT177JournalTests';P='T17\.7 C6 journal tests:\s*(\d+) passed,\s*(\d+) failed';E=24},
            @{N='RunTests';P='BlackDragon v14 unit tests:\s*(\d+) passed,\s*(\d+) failed';E=246},
            @{N='RunRecoveryMutationTests';P='Recovery T13 mutation policy tests:\s*(\d+) passed,\s*(\d+) failed';E=26},
            @{N='RunRecoveryIdentityTests';P='Recovery T14 identity tests:\s*(\d+) passed,\s*(\d+) failed';E=17},
            @{N='RunRecoveryArcsTests';P='Recovery T16 ARCS tests:\s*(\d+) passed,\s*(\d+) failed';E=33},
            @{N='RunRecoveryLivenessTests';P='Recovery T16\.3 liveness tests:\s*(\d+) passed,\s*(\d+) failed';E=18},
            @{N='RunRecoveryReachabilityTests';P='Recovery T16\.4 reachability tests:\s*(\d+) passed,\s*(\d+) failed';E=20},
            @{N='RunRecoveryT165Tests';P='Recovery T16\.5 guard/margin/log tests:\s*(\d+) passed,\s*(\d+) failed';E=20},
            @{N='RunRecoveryT166Tests';P='Recovery T16\.6 broker-min tests:\s*(\d+) passed,\s*(\d+) failed';E=16},
            @{N='RunT176HardeningTests';P='T17\.6 hardening tests:\s*(\d+) passed,\s*(\d+) failed';E=14})
          foreach($t in $tests){Get-Process terminal64 -ErrorAction SilentlyContinue|Stop-Process -Force;New-Item -ItemType Directory -Force $ld|Out-Null;Get-ChildItem $ld -Filter '*.log' -ErrorAction SilentlyContinue|Remove-Item -Force -ErrorAction SilentlyContinue;$cfg="$b\$($t.N).ini";$txt="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\$($t.N)`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n";[IO.File]::WriteAllText($cfg,$txt,[Text.Encoding]::Unicode);$p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru;$dl=(Get-Date).AddMinutes(4);while(-not$p.HasExited-and(Get-Date)-lt$dl){Start-Sleep 2;$p.Refresh()};if(-not$p.HasExited){Stop-Process -Id $p.Id -Force;throw "$($t.N) timeout"};$logs=Get-ChildItem $ld -Filter '*.log'|Sort-Object LastWriteTime;if(-not$logs){throw "$($t.N) log missing"};$raw=Get-Content $logs[-1].FullName -Raw;Copy-Item $logs[-1].FullName "$b\$($t.N)-native.log" -Force;Write-Host $raw;$m=[regex]::Match($raw,$t.P);if(-not$m.Success-or[int]$m.Groups[1].Value-ne$t.E-or[int]$m.Groups[2].Value-ne0-or$raw-notmatch'ALL GREEN'){throw "$($t.N) native mismatch expected $($t.E)/0"}}
          Write-Host 'FINAL T17.12 NATIVE MATRIX GREEN'

      - name: Package final T17.12 owner-QA artifact
        shell: pwsh
        run: |
          $b="$env:GITHUB_WORKSPACE\build-t1712-final";$zip="$env:GITHUB_WORKSPACE\BlackDragon-T17.12-FINAL-OWNER-QA.zip";Compress-Archive "$b\*" $zip -Force;$h=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$z=(Get-Item $zip).Length;"PACKAGE_SHA256=$h`nPACKAGE_SIZE=$z"|Add-Content "$b\PROVENANCE.txt";Write-Host "FINAL_PACKAGE_SHA256=$h SIZE=$z"

      - uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t1712-final-owner-qa
          path: |
            build-t1712-final/
            BlackDragon-T17.12-FINAL-OWNER-QA.zip
          if-no-files-found: error
