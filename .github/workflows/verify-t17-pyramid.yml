name: Verify T17 Full Pyramid

on:
  push:
    branches: [ feat/t17-full-pyramid ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/**'
      - '.github/workflows/verify-t17-pyramid.yml'
  pull_request:
    branches: [ feat/recovery-t16-arcs-stacked ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/**'
      - '.github/workflows/verify-t17-pyramid.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  t17-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Run T17 pure model oracle
        shell: bash
        run: |
          set -euo pipefail
          SRC='BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t17_model.cpp'
          g++ -std=c++17 -O2 -Wall -Wextra "$SRC" -o /tmp/t17
          /tmp/t17 | tee /tmp/t17.out
          grep -q 'Pyramid T17 model: 26 passed, 0 failed' /tmp/t17.out
          grep -q 'ALL GREEN' /tmp/t17.out

      - name: Verify T17 source invariants
        shell: python
        run: |
          import re
          from pathlib import Path
          cfg=Path('BlackDragon_v14/Include/BlackDragon/Pyramid/PyramidConfig.mqh').read_text(encoding='utf-8')
          core=Path('BlackDragon_v14/Include/BlackDragon/Pyramid/CorePyramid.mqh').read_text(encoding='utf-8')
          strategy=Path('BlackDragon_v14/Include/BlackDragon/Strategy.mqh').read_text(encoding='utf-8')
          book=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsBook.mqh').read_text(encoding='utf-8')
          t16=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryT16Config.mqh').read_text(encoding='utf-8')
          t17=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStackT17Pyramid.mqh').read_text(encoding='utf-8')
          types=Path('BlackDragon_v14/Include/BlackDragon/Types.mqh').read_text(encoding='utf-8')

          inputs=re.findall(r'^input\s+(?!group\b)[^\n]+', cfg, flags=re.M)
          assert len(inputs)==20, f'expected 20 T17 inputs, got {len(inputs)}'
          assert '23 — NHỒI DƯƠNG LỆNH CHÍNH (PYRAMID CORE)' in cfg
          assert '24 — NHỒI DƯƠNG RECOVERY HEDGE' in cfg
          assert 'PyramidRiskBudgetPercent_' in cfg and 'HedgePyramidCoverageSequence_' in cfg
          assert 'Pyramid_SemanticText' in cfg

          assert 'EXEC_CMD_CORE_PYRAMID_OPEN' in types
          assert 'EXEC_CMD_CORE_PYRAMID_CLOSE' in types
          assert 'm_campaignSeen' in core
          assert 'HistoryCampaignUsed' in core
          assert 'pyramid_CHU_KY_SACH' in core and 'm_campaignSeen[dir] && book.pyramidCount == 0' in core
          assert 'Pyramid_RiskCapLotPure' in core
          assert 'Pyramid_PeelHitPure' in core
          assert 'EXEC_RECONCILE_FAIL_CLOSED' in core

          assert 'BuildDcaView' in strategy
          assert 'm_pyramid.HasLegs' in strategy
          assert 'm_pyramid.Drive' in strategy
          assert strategy.index('m_pyramid.Drive') < strategy.index('TryOpenSeries(ctx)')
          assert 'if(m_pyramid != NULL && m_pyramid.HasLegs(side)) return;' in strategy

          assert 'Pyramid_IsComment(PositionGetString(POSITION_COMMENT))' in book
          assert 'Recovery_ArcsBuildEconomicCore' in book
          assert 'Recovery_ArcsBuildEconomicCore(dir, step, core)' in book
          assert 'Pyramid_SemanticText()' in t16
          assert 'HedgePyramidMode_ != hedge_pyramid_TAT' in t16

          assert 'class CRecoveryArcsStackT17' in t17
          assert '|P=' in t17
          assert 'FullMarginReserveAllows' in t17
          assert 'TpPriorityRequiresActivation' in t17
          assert 'ProjectedRoomAllows' in t17
          assert 'generationCount++' not in t17
          assert '++m_dir[' not in t17
          print('T17 source invariants PASS — 20 Vietnamese inputs + role isolation + staged Hedge coverage')

      - name: Record exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"

  t17-metaeditor-native:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$env:MT5_DIR\metaeditor64.exe")) { throw 'metaeditor64.exe not found' }
          if (-not (Test-Path "$env:MT5_DIR\terminal64.exe")) { throw 'terminal64.exe not found' }

      - name: Warm terminal and mirror exact tree
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "checkout mismatch actual=$actual expected=$env:SOURCE_SHA" }
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 40
          $t | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')) {
            New-Item -ItemType Directory -Force -Path "$mql5\$d" | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force
          }
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")) {
            if(Test-Path $r) {
              Get-ChildItem $r -Recurse -File | Where-Object {$_.Extension -in '.mq5','.mqh'} | ForEach-Object {
                $txt=Get-Content $_.FullName -Raw -Encoding UTF8
                [System.IO.File]::WriteAllText($_.FullName,$txt,$enc)
              }
            }
          }

      - name: Compile exact T17 targets
        shell: pwsh
        run: |
          $editor="$env:MT5_DIR\metaeditor64.exe"; $mql5="$env:MT5_DIR\MQL5"; $build="$env:GITHUB_WORKSPACE\build-t17"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $targets=@(
            @{N='RunPyramidT17Tests';S="$mql5\Scripts\BlackDragon\Tests\RunPyramidT17Tests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunPyramidT17Tests.ex5"},
            @{N='BlackDragon';S="$mql5\Experts\BlackDragon\BlackDragon.mq5";O="$mql5\Experts\BlackDragon\BlackDragon.ex5"}
          )
          foreach($t in $targets) {
            $log="$build\$($t.N).log"
            Start-Process $editor -ArgumentList "/compile:`"$($t.S)`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow
            if(-not (Test-Path $log)){throw "$($t.N): no compile log"}
            $text=Get-Content $log -Encoding Unicode -Raw; Write-Host $text
            $err=@(($text -split "`r?`n")|Where-Object{$_ -match ' : error '})
            $warn=@(($text -split "`r?`n")|Where-Object{$_ -match ' : warning '})
            if(-not(Test-Path $t.O)){throw "$($t.N): EX5 missing"}
            if($err.Count -or $warn.Count){throw "$($t.N): $($err.Count) errors / $($warn.Count) warnings"}
            Copy-Item $t.O $build -Force
          }
          $head=(git rev-parse HEAD).Trim(); $tree=(git show -s --format=%T HEAD).Trim()
          if($head -ne $env:SOURCE_SHA){throw 'provenance HEAD mismatch'}
          $ea=Join-Path $build 'BlackDragon.ex5'
          $eaHash=(Get-FileHash $ea -Algorithm SHA256).Hash.ToLowerInvariant()
          "HEAD=$head`nTREE=$tree`nBLACKDRAGON_EX5_SHA256=$eaHash`n" | Out-File "$build\PROVENANCE.txt" -Encoding utf8
          Write-Host "T17 MetaEditor exact-tree compile PASS: 0 errors / 0 warnings"
          Write-Host "HEAD=$head TREE=$tree BlackDragon.ex5 SHA256=$eaHash"

      - name: Execute native T17 policy script
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t17"
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $logDir="$env:MT5_DIR\MQL5\Logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $cfg=Join-Path $build 'RunPyramidT17Tests.ini'
          $cfgText="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\RunPyramidT17Tests`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n"
          [IO.File]::WriteAllText($cfg,$cfgText,[Text.Encoding]::Unicode)
          $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru
          $deadline=(Get-Date).AddMinutes(4)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'T17 native timeout'}
          $logs=Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          if(-not $logs){throw 'T17 native log missing'}
          $latest=$logs[-1]
          Copy-Item $latest.FullName (Join-Path $build 'RunPyramidT17Tests-native.log') -Force
          $raw=Get-Content $latest.FullName -Raw; Write-Host $raw
          $m=[regex]::Match($raw,'Pyramid T17 tests:\s*(\d+) passed,\s*(\d+) failed')
          if(-not $m.Success){throw 'T17 summary missing'}
          if([int]$m.Groups[1].Value -ne 26 -or [int]$m.Groups[2].Value -ne 0 -or $raw -notmatch 'ALL GREEN')
          { throw "T17 expected 26/0" }
          Write-Host 'T17 native PASS 26/0'

      - name: Package exact T17 evidence
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t17"
          Compress-Archive "$build\*" "$env:GITHUB_WORKSPACE\BlackDragon-T17-evidence.zip" -Force
          $h=(Get-FileHash "$env:GITHUB_WORKSPACE\BlackDragon-T17-evidence.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "PACKAGE_SHA256=$h" | Add-Content "$build\PROVENANCE.txt"
          Write-Host "PACKAGE_SHA256=$h"

      - name: Upload exact T17 evidence
        uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t17-exact-tree
          path: |
            build-t17/
            BlackDragon-T17-evidence.zip
          if-no-files-found: error
