name: T13 Hardening via Compile Workflow

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'feat/adaptive-recovery-t13-overlap-side-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply T13 retry and topology invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path);s=p.read_text(encoding='utf-8');n=s.count(old)
              if n!=1: raise SystemExit(f'{path}: expected 1 match got {n}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          coord='BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh'
          old='''      if(m_cycle[idx].reconcileHold && !m_cycle[idx].active)
      {
         if(m_cycle[idx].kind == recovery_EXIT_COORD_EXTERNAL)
         {
            why = "external Core/Recovery mutation remains fail-closed pending explicit reconciliation";
            return true;
         }
         string finalizeWhy = "";
         if(m_recovery != NULL &&
            m_recovery.FinalizeConfirmedSideMutation(*m_exec, Direction(idx), now, finalizeWhy))
         {
            Log_Info("Recovery", "T13 deferred side-mutation finalization succeeded for " +
                     Recovery_DirectionName(Direction(idx)));
            ResetCycle(idx);
            return false;
         }
         why = "T13 side-mutation finalizer still blocked: " + finalizeWhy;
         return true;
      }
      if(!m_cycle[idx].active) return false;'''
          new='''      if(m_cycle[idx].reconcileHold && !m_cycle[idx].active)
      {
         if(m_cycle[idx].kind == recovery_EXIT_COORD_EXTERNAL)
         {
            why = "external Core/Recovery mutation remains fail-closed pending explicit reconciliation";
            return true;
         }

         // T13: a coordinator-owned hold does not prove the target mutation
         // completed. Re-drive the original plan from current broker state.
         m_cycle[idx].reconcileHold = false;
         m_cycle[idx].active = true;
         Log_Warn("Recovery", "t13retry" + (string)Recovery_CycleKey(Direction(idx)),
                  "retrying coordinated side mutation from current broker state");
      }
      if(!m_cycle[idx].active) return false;'''
          rep(coord,old,new)

          eng='BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh'
          old2='''         if(!Recovery_SideMutationStableStatePure(c.state) || c.state == recovery_COMPLETED)
         {
  why = "partial Core mutation reached a non-stable Recovery state: " +
        Recovery_StateName(c.state);
  return false;
         }

         if(c.state == recovery_ARMED)'''
          new2='''         if(!Recovery_SideMutationStableStatePure(c.state) || c.state == recovery_COMPLETED)
         {
            why = "partial Core mutation reached a non-stable Recovery state: " +
                  Recovery_StateName(c.state);
            return false;
         }

         // Stable post-Hedge states require both Core and Recovery exposure.
         // Never persist stale HEDGE_* topology after a coordinated mutation.
         if((c.state == recovery_HEDGE_ACTIVE || c.state == recovery_HEDGE_LOCKED) &&
            (currentCore <= 0 || currentHedge <= 0))
         {
            why = "post-Hedge side mutation lost required Core/Hedge exposure in state " +
                  Recovery_StateName(c.state);
            return false;
         }
         if(c.state == recovery_CORE_ONLY && currentHedge != 0)
         {
            why = "CORE_ONLY side mutation unexpectedly has Recovery hedge exposure";
            return false;
         }

         if(c.state == recovery_ARMED)'''
          rep(eng,old2,new2)
          PY
          git diff --check
      - name: Commit hardening to T13 product branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh
          git commit -m "fix(recovery): harden T13 coordinator retry invariants"
          git push origin HEAD:feat/adaptive-recovery-t13-overlap-side-finalizer
