name: Verify T17.16 Rebase Capacity Final

on:
  push:
    branches: [ feat/t17-full-pyramid ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  model-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p build-t1716-model
          printf 'HEAD=%s\nTREE=%s\nRUN_ID=%s\nRUN_ATTEMPT=%s\nREPOSITORY=%s\n' \
            "$(git rev-parse HEAD)" "$(git show -s --format=%T HEAD)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REPOSITORY" \
            | tee build-t1716-model/PROVENANCE.txt
      - name: Established model regression plus T17.16
        shell: bash
        run: |
          set -euo pipefail
          R='BlackDragon_v14/Scripts/BlackDragon/Tests'
          suites=(
            offline_suite.cpp recovery_foundation_suite.cpp execution_t2_suite.cpp
            recovery_t3_shadow_suite.cpp recovery_t4_bundle_suite.cpp recovery_t5_exit_suite.cpp
            recovery_t6_lock_suite.cpp recovery_t7_dca_suite.cpp recovery_t8_coord_suite.cpp
            recovery_t9_persistence_suite.cpp recovery_t10_runtime_guard_suite.cpp
            execution_t14_identity_suite.cpp recovery_t16_arcs_suite.cpp recovery_t16_event_order_suite.cpp
            recovery_t162_overlap_slreject_suite.cpp recovery_t163_liveness_suite.cpp
            recovery_t164_reachability_suite.cpp recovery_t165_guard_margin_log_suite.cpp
            recovery_t166_broker_min_suite.cpp pyramid_t17_model.cpp pyramid_t176_model.cpp
            pyramid_t177_scheduler_model.cpp pyramid_t177_anchor_model.cpp pyramid_t177_overlap_model.cpp
            pyramid_t177_hedge_ladder_model.cpp pyramid_t177_migration_model.cpp
            pyramid_t177_journal_model.cpp pyramid_t178_runtime_model.cpp pyramid_t179_realtp_model.cpp
            unit_system_t1710_model.cpp t1711_runtime_model.cpp t1712_runtime_model.cpp
            t1713_concurrency_model.cpp t1714_runtime_model.cpp
            t1715_overlap_capability_model.cpp t1716_rebase_capacity_model.cpp)
          for src in "${suites[@]}"; do
            exe="/tmp/${src%.cpp}"; out="build-t1716-model/${src%.cpp}.log"
            g++ -std=c++17 -O2 -Wall -Wextra "$R/$src" -o "$exe"
            "$exe" | tee "$out"
            grep -q 'ALL GREEN' "$out" || grep -Eq '(^|[^0-9])0 failed([^0-9]|$)' "$out"
          done
          grep -q 'T17.16 rebase/capacity model: 22 passed, 0 failed' build-t1716-model/t1716_rebase_capacity_model.log
          echo 'FINAL T17.16 MODEL REGRESSION GREEN'
      - name: T17.11 through T17.16 source contracts
        shell: bash
        run: |
          set -euo pipefail
          for n in 1711 1712 1713 1714 1715 1716; do
            python3 "BlackDragon_v14/Scripts/BlackDragon/Tests/t${n}_source_contract.py" \
              | tee "build-t1716-model/t${n}-source.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t1716-model-source
          path: build-t1716-model/
          if-no-files-found: error

  native-final:
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Download and attest MetaTrader installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          $installerHash=(Get-FileHash '.\mt5setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if(-not(Test-Path "$env:MT5_DIR\metaeditor64.exe")){throw 'metaeditor64.exe not found'}
          if(-not(Test-Path "$env:MT5_DIR\terminal64.exe")){throw 'terminal64.exe not found'}
          New-Item -ItemType Directory -Force 'build-t1716-final'|Out-Null
          $editorVersion=(Get-Item "$env:MT5_DIR\metaeditor64.exe").VersionInfo.FileVersion
          "INSTALLER_SHA256=$installerHash`nMETAEDITOR_VERSION=$editorVersion" | Out-File 'build-t1716-final\TOOLCHAIN.txt' -Encoding utf8
      - name: Mirror exact tree and compile probe
        shell: pwsh
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA){throw 'checkout mismatch'}
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 40
          $t|Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')){New-Item -ItemType Directory -Force -Path "$mql5\$d"|Out-Null;Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force}
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")){if(Test-Path $r){Get-ChildItem $r -Recurse -File|Where-Object{$_.Extension -in '.mq5','.mqh'}|ForEach-Object{$txt=Get-Content $_.FullName -Raw -Encoding UTF8;[IO.File]::WriteAllText($_.FullName,$txt,$enc)}}}
          $probe="$mql5\Experts\VKMQLProbe.mq5";[IO.File]::WriteAllText($probe,"#property strict`r`nvoid OnTick(){}`r`n",$enc)
          $log="$env:GITHUB_WORKSPACE\build-t1716-final\ProbeEA-compile.log"
          Start-Process "$env:MT5_DIR\metaeditor64.exe" -ArgumentList "/compile:`"$probe`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow
          $x=Get-Content $log -Encoding Unicode -Raw;Write-Host $x
          if(-not(Test-Path "$mql5\Experts\VKMQLProbe.ex5")-or$x-match' : error '-or$x-match' : warning '){throw 'ProbeEA compile failed'}
      - name: Compile full EA and 24 native suites
        shell: pwsh
        run: |
          $mql5="$env:MT5_DIR\MQL5";$editor="$env:MT5_DIR\metaeditor64.exe";$b="$env:GITHUB_WORKSPACE\build-t1716-final"
          $names=@('RunT1716RebaseCapacityTests','RunT1715OverlapCapabilityTests','RunT1714RuntimeTests','RunT1713ConcurrencyTests','RunT1712RuntimeTests','RunT1711RuntimeTests','RunT1710UnitSystemTests','RunT179RealTpTests','RunT178RuntimeFixTests','RunT177SchedulerTests','RunT177AnchorTests','RunT177OverlapTests','RunT177HedgeLadderTests','RunT177MigrationTests','RunT177JournalTests','RunTests','RunRecoveryMutationTests','RunRecoveryIdentityTests','RunRecoveryArcsTests','RunRecoveryLivenessTests','RunRecoveryReachabilityTests','RunRecoveryT165Tests','RunRecoveryT166Tests','RunT176HardeningTests')
          foreach($n in $names){$src="$mql5\Scripts\BlackDragon\Tests\$n.mq5";$out="$mql5\Scripts\BlackDragon\Tests\$n.ex5";$log="$b\$n-compile.log";Start-Process $editor -ArgumentList "/compile:`"$src`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow;$x=Get-Content $log -Encoding Unicode -Raw;Write-Host $x;$e=@(($x-split"`r?`n")|Where-Object{$_-match' : error '});$w=@(($x-split"`r?`n")|Where-Object{$_-match' : warning '});if(-not(Test-Path $out)-or$e.Count-or$w.Count){throw "$n compile failed: $($e.Count) errors/$($w.Count) warnings"};Copy-Item $out $b -Force}
          $source="$env:GITHUB_WORKSPACE\BlackDragon_v14\Experts\BlackDragon\BlackDragon.mq5";$src="$mql5\Experts\BlackDragon\BlackDragon.mq5";$out="$mql5\Experts\BlackDragon\BlackDragon.ex5";$log="$b\BlackDragon-compile.log"
          $originalHash=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant();$stagedHash=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          Start-Process $editor -ArgumentList "/compile:`"$src`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow;$x=Get-Content $log -Encoding Unicode -Raw;Write-Host $x;$e=@(($x-split"`r?`n")|Where-Object{$_-match' : error '});$w=@(($x-split"`r?`n")|Where-Object{$_-match' : warning '});if(-not(Test-Path $out)-or$e.Count-or$w.Count){throw "BlackDragon compile failed: $($e.Count) errors/$($w.Count) warnings"};Copy-Item $out $b -Force
          $head=(git rev-parse HEAD).Trim();$tree=(git show -s --format=%T HEAD).Trim();$hash=(Get-FileHash "$b\BlackDragon.ex5" -Algorithm SHA256).Hash.ToLowerInvariant();$size=(Get-Item "$b\BlackDragon.ex5").Length
          "REPOSITORY=$env:GITHUB_REPOSITORY`nHEAD=$head`nTREE=$tree`nJOB=$env:GITHUB_JOB`nRUN_ID=$env:GITHUB_RUN_ID`nRUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT`nRUNNER_OS=$env:RUNNER_OS`nORIGINAL_MQ5_SHA256=$originalHash`nSTAGED_MQ5_SHA256=$stagedHash`nSTAGING_TRANSFORM=UTF16LE_BOM`nBLACKDRAGON_EX5_SHA256=$hash`nBLACKDRAGON_EX5_SIZE=$size"|Out-File "$b\PROVENANCE.txt" -Encoding utf8
          Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\docs\vibecode\T17_16_OWNER_QA_CHECKLIST.md" $b -Force
          Write-Host "FINAL T17.16 MetaEditor PASS 0 errors/0 warnings HEAD=$head TREE=$tree EX5=$hash SIZE=$size"
      - name: Execute 24-suite native matrix
        shell: pwsh
        run: |
          $b="$env:GITHUB_WORKSPACE\build-t1716-final";$ld="$env:MT5_DIR\MQL5\Logs";$tests=@(
            @{N='RunT1716RebaseCapacityTests';P='T17\.16 native rebase/capacity:\s*(\d+) passed,\s*(\d+) failed';E=18},
            @{N='RunT1715OverlapCapabilityTests';P='T17\.15 native Overlap capability:\s*(\d+) passed,\s*(\d+) failed';E=10},@{N='RunT1714RuntimeTests';P='T17\.14 native runtime:\s*(\d+) passed,\s*(\d+) failed';E=11},@{N='RunT1713ConcurrencyTests';P='T17\.13 native concurrency:\s*(\d+) passed,\s*(\d+) failed';E=23},@{N='RunT1712RuntimeTests';P='T17\.12 runtime tests:\s*(\d+) passed,\s*(\d+) failed';E=21},@{N='RunT1711RuntimeTests';P='T17\.11 runtime tests:\s*(\d+) passed,\s*(\d+) failed';E=30},@{N='RunT1710UnitSystemTests';P='T17\.10 unit tests:\s*(\d+) passed,\s*(\d+) failed';E=43},@{N='RunT179RealTpTests';P='T17\.9 REAL-TP tests:\s*(\d+) passed,\s*(\d+) failed';E=32},@{N='RunT178RuntimeFixTests';P='T17\.8 runtime fix tests:\s*(\d+) passed,\s*(\d+) failed';E=25},
            @{N='RunT177SchedulerTests';P='T17\.7 C1 scheduler tests:\s*(\d+) passed,\s*(\d+) failed';E=11},@{N='RunT177AnchorTests';P='T17\.7 C2 anchor tests:\s*(\d+) passed,\s*(\d+) failed';E=14},@{N='RunT177OverlapTests';P='T17\.7 C3 Overlap tests:\s*(\d+) passed,\s*(\d+) failed';E=26},@{N='RunT177HedgeLadderTests';P='T17\.7 C4 Hedge ladder tests:\s*(\d+) passed,\s*(\d+) failed';E=20},@{N='RunT177MigrationTests';P='T17\.7 C5 migration tests:\s*(\d+) passed,\s*(\d+) failed';E=39},@{N='RunT177JournalTests';P='T17\.7 C6 journal tests:\s*(\d+) passed,\s*(\d+) failed';E=24},
            @{N='RunTests';P='BlackDragon v14 unit tests:\s*(\d+) passed,\s*(\d+) failed';E=246},@{N='RunRecoveryMutationTests';P='Recovery T13 mutation policy tests:\s*(\d+) passed,\s*(\d+) failed';E=26},@{N='RunRecoveryIdentityTests';P='Recovery T14 identity tests:\s*(\d+) passed,\s*(\d+) failed';E=17},@{N='RunRecoveryArcsTests';P='Recovery T16 ARCS tests:\s*(\d+) passed,\s*(\d+) failed';E=33},@{N='RunRecoveryLivenessTests';P='Recovery T16\.3 liveness tests:\s*(\d+) passed,\s*(\d+) failed';E=18},@{N='RunRecoveryReachabilityTests';P='Recovery T16\.4 reachability tests:\s*(\d+) passed,\s*(\d+) failed';E=20},@{N='RunRecoveryT165Tests';P='Recovery T16\.5 guard/margin/log tests:\s*(\d+) passed,\s*(\d+) failed';E=20},@{N='RunRecoveryT166Tests';P='Recovery T16\.6 broker-min tests:\s*(\d+) passed,\s*(\d+) failed';E=16},@{N='RunT176HardeningTests';P='T17\.6 hardening tests:\s*(\d+) passed,\s*(\d+) failed';E=14})
          foreach($t in $tests){Get-Process terminal64 -ErrorAction SilentlyContinue|Stop-Process -Force;New-Item -ItemType Directory -Force $ld|Out-Null;Get-ChildItem $ld -Filter '*.log' -ErrorAction SilentlyContinue|Remove-Item -Force -ErrorAction SilentlyContinue;$cfg="$b\$($t.N).ini";$txt="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\$($t.N)`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n";[IO.File]::WriteAllText($cfg,$txt,[Text.Encoding]::Unicode);$p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru;$dl=(Get-Date).AddMinutes(4);while(-not$p.HasExited-and(Get-Date)-lt$dl){Start-Sleep 2;$p.Refresh()};if(-not$p.HasExited){Stop-Process -Id $p.Id -Force;throw "$($t.N) timeout"};$logs=Get-ChildItem $ld -Filter '*.log'|Sort-Object LastWriteTime;if(-not$logs){throw "$($t.N) log missing"};$raw=Get-Content $logs[-1].FullName -Raw;Copy-Item $logs[-1].FullName "$b\$($t.N)-native.log" -Force;Write-Host $raw;$m=[regex]::Match($raw,$t.P);if(-not$m.Success-or[int]$m.Groups[1].Value-ne$t.E-or[int]$m.Groups[2].Value-ne0-or$raw-notmatch'ALL GREEN'){throw "$($t.N) native mismatch expected $($t.E)/0"}}
          Write-Host 'FINAL T17.16 NATIVE MATRIX GREEN'
      - uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t1716-final-owner-qa
          path: build-t1716-final/
          if-no-files-found: error
