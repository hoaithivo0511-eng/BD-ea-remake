name: Verify Recovery T14-T16.3 Exact Tree

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/**'
      - '.github/workflows/verify-t14-execution-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  model-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Compile and run Recovery model suites
        shell: bash
        run: |
          set -euo pipefail
          ROOT='BlackDragon_v14/Scripts/BlackDragon/Tests'
          suites=(offline_suite.cpp recovery_foundation_suite.cpp execution_t2_suite.cpp \
                  recovery_t3_shadow_suite.cpp recovery_t4_bundle_suite.cpp \
                  recovery_t5_exit_suite.cpp recovery_t6_lock_suite.cpp \
                  recovery_t7_dca_suite.cpp recovery_t8_coord_suite.cpp \
                  recovery_t9_persistence_suite.cpp recovery_t10_runtime_guard_suite.cpp \
                  execution_t14_identity_suite.cpp recovery_t16_arcs_suite.cpp \
                  recovery_t16_event_order_suite.cpp recovery_t162_overlap_slreject_suite.cpp \
                  recovery_t163_liveness_suite.cpp)
          for src in "${suites[@]}"; do
            echo "::group::$src"
            exe="/tmp/${src%.cpp}"
            g++ -std=c++17 -O2 -Wall -Wextra "$ROOT/$src" -o "$exe"
            "$exe"
            echo '::endgroup::'
          done

      - name: Verify T14-T16.3 source invariants
        shell: python
        run: |
          from pathlib import Path
          e=Path('BlackDragon_v14/Include/BlackDragon/ExecutionLayer.mqh').read_text(encoding='utf-8')
          r=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh').read_text(encoding='utf-8')
          c=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh').read_text(encoding='utf-8')
          p=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExecutionIdentity.mqh').read_text(encoding='utf-8')
          t=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryT16Config.mqh').read_text(encoding='utf-8')
          a=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStack.mqh').read_text(encoding='utf-8')
          ah=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStackHardened.mqh').read_text(encoding='utf-8')
          af=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStackPostDeal.mqh').read_text(encoding='utf-8')
          af2=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStackPostDealT162Base.mqh').read_text(encoding='utf-8')
          at=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsTypes.mqh').read_text(encoding='utf-8')
          ap=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsPersistence.mqh').read_text(encoding='utf-8')
          assert all(x in e for x in ['Journal_OpenIdentityResolved','Journal_CorrelatedOpenVolume','targetVolume immutable','flat-account journal blocker:','requestId=','serverOrder=','serverDeal='])
          assert 'Recovery_T14PendingVolumeEffectConfirmed' in r and 'RecoveryEngineT13Base.mqh' in r
          assert 'CRecoveryArcsStack' in r and 'Recovery_T16UseStackEngine' in r
          assert 'T16FinalizeExpectedOverlapMutation' in r
          assert 'IsExpectedRecoveryLockSlT14' in c and 'T16ExpectedBrokerSlDeal' in c and 'RecoveryExitCoordinatorT13Base.mqh' in c
          assert 'OverlapAfterHedge_' in c and 'DriveT16OverlapCycle' in c and 'retained Hedge layers preserved' in c
          assert 'Recovery_ProtectiveSlIdentityPure' in p
          assert 'HedgeVolumePercent_' in t and 'ARCS_XEP_LOP' in t and 'SL_BROKER' in t and 'SL_VIRTUAL' in t
          assert 'OverlapAfterHedge_' in t and 'Recovery_T162ModifyDispositionPure' in t and 'Recovery_T162PostOverlapGenerationUnitsPure' in t
          assert 'Recovery_T16NewGenerationUnitsPure' in t and 'MathFloor' in t
          assert 'BD_ARCS_MAX_LAYERS 64' in t and 'MaxHedgeGenerations_ > BD_ARCS_MAX_LAYERS' in t
          assert 'ARCS_LAYER_LOCKED' in a and 'ARCS_GLOBAL_ACTIVE' in a and 'ARCS_TRANSITION' in a
          assert 'ARCS_LAYER_PROTECTIVE_CLOSE_PENDING' in at and 'ARCS_PROTECTIVE_CLOSE_WAIT' in at
          assert 'Exec_T14ModifyProofMatches' in ah and 'waiting exact DEAL_ADD before next generation' in ah
          assert 'FreshBrokerTick' in af2 and 'RECOVERY_MODIFY_DEFER_NO_EFFECT' in af2
          assert 'FinalizeExpectedOverlapMutation' in af2 and 'post-Overlap ARCS live-book mismatch' in af2
          assert 'Recovery_T163DeferredLockYieldPure' in af
          assert 'Recovery_T163MaxedNoHedgePure' in af
          assert 'Recovery_T163SchedulingStatePure' in af
          assert 'recovery_REHEDGE_PENDING' in af and 'recovery_HEDGE_LOCKED' in af
          assert 'BD_ARCS_PERSIST_VERSION 4' in ap and 'ARCSv4_' in ap and 'Recovery_T16SemanticFingerprint' in ap
          print('T14-T16.3 static integration gates PASS')

      - name: Record exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"

  metaeditor-native:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$env:MT5_DIR\metaeditor64.exe")) { throw 'metaeditor64.exe not found' }
          if (-not (Test-Path "$env:MT5_DIR\terminal64.exe")) { throw 'terminal64.exe not found' }

      - name: Warm terminal and mirror exact tree
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "checkout mismatch actual=$actual expected=$env:SOURCE_SHA" }
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 40
          $t | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')) {
            New-Item -ItemType Directory -Force -Path "$mql5\$d" | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force
          }
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")) {
            if(Test-Path $r) {
              Get-ChildItem $r -Recurse -File | Where-Object {$_.Extension -in '.mq5','.mqh'} | ForEach-Object {
                $txt=Get-Content $_.FullName -Raw -Encoding UTF8
                [System.IO.File]::WriteAllText($_.FullName,$txt,$enc)
              }
            }
          }

      - name: Compile exact-tree targets T14-T16.3
        shell: pwsh
        run: |
          $editor="$env:MT5_DIR\metaeditor64.exe"; $mql5="$env:MT5_DIR\MQL5"; $build="$env:GITHUB_WORKSPACE\build-t163"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $targets=@(
            @{N='RunTests';S="$mql5\Scripts\BlackDragon\Tests\RunTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunTests.ex5"},
            @{N='RunRecoveryMutationTests';S="$mql5\Scripts\BlackDragon\Tests\RunRecoveryMutationTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunRecoveryMutationTests.ex5"},
            @{N='RunRecoveryIdentityTests';S="$mql5\Scripts\BlackDragon\Tests\RunRecoveryIdentityTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunRecoveryIdentityTests.ex5"},
            @{N='RunRecoveryArcsTests';S="$mql5\Scripts\BlackDragon\Tests\RunRecoveryArcsTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunRecoveryArcsTests.ex5"},
            @{N='RunRecoveryLivenessTests';S="$mql5\Scripts\BlackDragon\Tests\RunRecoveryLivenessTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunRecoveryLivenessTests.ex5"},
            @{N='BlackDragon';S="$mql5\Experts\BlackDragon\BlackDragon.mq5";O="$mql5\Experts\BlackDragon\BlackDragon.ex5"}
          )
          foreach($t in $targets) {
            $log="$build\$($t.N).log"
            Start-Process $editor -ArgumentList "/compile:`"$($t.S)`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow
            if(-not (Test-Path $log)){throw "$($t.N): no log"}
            $text=Get-Content $log -Encoding Unicode -Raw; Write-Host $text
            $err=@(($text -split "`r?`n")|Where-Object{$_ -match ' : error '}); $warn=@(($text -split "`r?`n")|Where-Object{$_ -match ' : warning '})
            if(-not(Test-Path $t.O)){throw "$($t.N): EX5 missing"}
            if($err.Count -or $warn.Count){throw "$($t.N): $($err.Count) errors / $($warn.Count) warnings"}
            Copy-Item $t.O $build -Force
          }
          $head=(git rev-parse HEAD).Trim(); $tree=(git show -s --format=%T HEAD).Trim()
          if($head -ne $env:SOURCE_SHA){throw 'provenance HEAD mismatch'}
          $ea=Join-Path $build 'BlackDragon.ex5'; $eaHash=(Get-FileHash $ea -Algorithm SHA256).Hash.ToLowerInvariant()
          "HEAD=$head`nTREE=$tree`nBLACKDRAGON_EX5_SHA256=$eaHash`n" | Out-File "$build\PROVENANCE.txt" -Encoding utf8
          Write-Host "T16.3 MetaEditor exact-tree compile PASS: 0 errors / 0 warnings"
          Write-Host "HEAD=$head TREE=$tree BlackDragon.ex5 SHA256=$eaHash"

      - name: Execute exact native MT5 scripts
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t163"
          $tests=@(
            @{N='RunTests';P='BlackDragon v14 unit tests:\s*(\d+) passed,\s*(\d+) failed';E=246},
            @{N='RunRecoveryMutationTests';P='Recovery T13 mutation policy tests:\s*(\d+) passed,\s*(\d+) failed';E=26},
            @{N='RunRecoveryIdentityTests';P='Recovery T14 identity tests:\s*(\d+) passed,\s*(\d+) failed';E=17},
            @{N='RunRecoveryArcsTests';P='Recovery T16 ARCS tests:\s*(\d+) passed,\s*(\d+) failed';E=33},
            @{N='RunRecoveryLivenessTests';P='Recovery T16.3 liveness tests:\s*(\d+) passed,\s*(\d+) failed';E=18}
          )
          foreach($t in $tests) {
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
            $logDir="$env:MT5_DIR\MQL5\Logs"
            New-Item -ItemType Directory -Force -Path $logDir | Out-Null
            Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
            $cfg=Join-Path $build "$($t.N).ini"
            $cfgText="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\$($t.N)`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n"
            [IO.File]::WriteAllText($cfg,$cfgText,[Text.Encoding]::Unicode)
            $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru
            $deadline=(Get-Date).AddMinutes(4)
            while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw "$($t.N) timeout"}
            $logs=Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
            if(-not $logs){throw "$($t.N) native log missing"}
            $latest=$logs[-1]; Copy-Item $latest.FullName (Join-Path $build "$($t.N)-native.log") -Force
            $raw=Get-Content $latest.FullName -Raw; Write-Host "--- native $($t.N) ---`n$raw"
            $m=[regex]::Match($raw,$t.P); if(-not $m.Success){throw "$($t.N) summary missing"}
            $pass=[int]$m.Groups[1].Value; $fail=[int]$m.Groups[2].Value
            if($pass -ne $t.E -or $fail -ne 0 -or $raw -notmatch 'ALL GREEN'){throw "$($t.N): expected $($t.E)/0 got $pass/$fail"}
            Write-Host "$($t.N): native PASS $pass/0"
          }
          Write-Host 'T16.3 exact native gates PASS: legacy 246/0; T13 mutation 26/0; T14 identity 17/0; T16.2 ARCS 33/0; T16.3 liveness 18/0'

      - name: Package exact T16.3 evidence
        shell: pwsh
        run: |
          Compress-Archive "$env:GITHUB_WORKSPACE\build-t163\*" "$env:GITHUB_WORKSPACE\BlackDragon-T16.3-evidence.zip" -Force
          $h=(Get-FileHash "$env:GITHUB_WORKSPACE\BlackDragon-T16.3-evidence.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "PACKAGE_SHA256=$h" | Add-Content "$env:GITHUB_WORKSPACE\build-t163\PROVENANCE.txt"
          Write-Host "PACKAGE_SHA256=$h"

      - name: Upload exact T16.3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t163-exact-tree
          path: |
            build-t163/
            BlackDragon-T16.3-evidence.zip
          if-no-files-found: error
