name: Verify T17.7 C6 Vietnamese Journal

on:
  pull_request:
    branches: [ feat/recovery-t16-arcs-stacked ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/RunT177JournalTests.mq5'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t177_journal_model.cpp'
      - '.github/workflows/verify-t177-c6.yml'
  workflow_dispatch:
permissions: { contents: read }
env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  t177-c6-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0 }
      - name: Run journal model
        shell: bash
        run: |
          set -euo pipefail
          SRC='BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t177_journal_model.cpp'
          g++ -std=c++17 -O2 -Wall -Wextra "$SRC" -o /tmp/t177c6
          /tmp/t177c6 | tee /tmp/t177c6.out
          grep -q 'T17.7 C6 journal model: 24 passed, 0 failed' /tmp/t177c6.out
          grep -q 'ALL GREEN' /tmp/t177c6.out
      - name: Verify C6 journal contract
        shell: python
        run: |
          from pathlib import Path
          r=Path('BlackDragon_v14/Include/BlackDragon')
          journal=(r/'JournalT177.mqh').read_text(encoding='utf-8')
          logger=(r/'Logger.mqh').read_text(encoding='utf-8')
          cfg=(r/'Recovery/RecoveryT16Config.mqh').read_text(encoding='utf-8')
          scheduler=(r/'Recovery/RecoveryArcsStackT177Scheduler.mqh').read_text(encoding='utf-8')
          ladder=(r/'Recovery/RecoveryArcsStackT177HedgeLadderC4Base.mqh').read_text(encoding='utf-8')
          overlap=(r/'Overlap/OverlapT177CoordinatorT177C3Base.mqh').read_text(encoding='utf-8')
          native=Path('BlackDragon_v14/Scripts/BlackDragon/Tests/RunT177JournalTests.mq5').read_text(encoding='utf-8')
          for t in ['Journal_T177HumanReasonPure','Journal_T177LinePure','BLOCK_GAP','BLOCK_RECOVERY','LEG2_WAIT_SAFE']:
              assert t in journal
          assert 'THÔNG TIN |' in logger and 'CẢNH BÁO |' in logger and 'LỖI |' in logger
          assert 'Journal_T177NormalizePayloadPure' in logger
          assert 'Journal_T177StartsWithPure(human,"CHỜ ")' in logger
          assert 'Recovery_T177PrintMigrationSummaryC6' in cfg
          assert 'ReHedgeGapPips_ không còn dùng trong ARCS' in cfg
          assert 'target Hedge=' in cfg and 'hardCap=' in cfg
          assert 'CHỜ ' in scheduler and 'không khóa Pyramid phía đối diện' in scheduler
          assert 'CHỜ ' in ladder and 'target yêu cầu=' in ladder and 'bỏ=' in ladder
          assert 'Lệnh 1 đã đóng, lệnh 2 chưa an toàn' in overlap and 'dự kiến=' in overlap
          assert 'T17.7 C6 journal tests:' in native
          print('T17.7 C6 journal/source contract PASS')
      - name: Record exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"

  t177-c6-native:
    runs-on: windows-latest
    timeout-minutes: 45
    env: { MT5_DIR: 'C:\Program Files\MetaTrader 5' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0 }
      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if(-not(Test-Path "$env:MT5_DIR\metaeditor64.exe")){throw 'metaeditor64.exe not found'}
      - name: Warm terminal and mirror exact tree
        shell: pwsh
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA){throw 'checkout mismatch'}
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru; Start-Sleep 40; $t|Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')){New-Item -ItemType Directory -Force "$mql5\$d"|Out-Null; Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force}
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")){if(Test-Path $r){Get-ChildItem $r -Recurse -File|?{$_.Extension -in '.mq5','.mqh'}|%{$txt=Get-Content $_.FullName -Raw -Encoding UTF8;[IO.File]::WriteAllText($_.FullName,$txt,$enc)}}}
      - name: Compile C6 and full EA
        shell: pwsh
        run: |
          $mql5="$env:MT5_DIR\MQL5";$editor="$env:MT5_DIR\metaeditor64.exe";$b="$env:GITHUB_WORKSPACE\build-t177c6";New-Item -ItemType Directory -Force $b|Out-Null
          $targets=@(@{N='RunT177JournalTests';S="$mql5\Scripts\BlackDragon\Tests\RunT177JournalTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunT177JournalTests.ex5"},@{N='BlackDragon';S="$mql5\Experts\BlackDragon\BlackDragon.mq5";O="$mql5\Experts\BlackDragon\BlackDragon.ex5"})
          foreach($t in $targets){$l="$b\$($t.N).log";Start-Process $editor -ArgumentList "/compile:`"$($t.S)`" /inc:`"$mql5`" /log:`"$l`"" -Wait -NoNewWindow;$x=Get-Content $l -Encoding Unicode -Raw;Write-Host $x;$e=@(($x-split"`r?`n")|?{$_-match' : error '});$w=@(($x-split"`r?`n")|?{$_-match' : warning '});if(-not(Test-Path $t.O)-or$e.Count-or$w.Count){throw "$($t.N) compile failed"};Copy-Item $t.O $b -Force}
          $head=(git rev-parse HEAD).Trim();$tree=(git show -s --format=%T HEAD).Trim();$hash=(Get-FileHash "$b\BlackDragon.ex5" -Algorithm SHA256).Hash.ToLowerInvariant();"HEAD=$head`nTREE=$tree`nBLACKDRAGON_EX5_SHA256=$hash"|Out-File "$b\PROVENANCE.txt" -Encoding utf8;Write-Host "T17.7 C6 MetaEditor PASS 0/0 HEAD=$head TREE=$tree EX5=$hash"
      - name: Execute native C6 script
        shell: pwsh
        run: |
          $b="$env:GITHUB_WORKSPACE\build-t177c6";$ld="$env:MT5_DIR\MQL5\Logs";Get-Process terminal64 -ErrorAction SilentlyContinue|Stop-Process -Force;New-Item -ItemType Directory -Force $ld|Out-Null;Get-ChildItem $ld -Filter '*.log' -ErrorAction SilentlyContinue|Remove-Item -Force
          $cfg="$b\RunT177JournalTests.ini";$txt="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\RunT177JournalTests`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n";[IO.File]::WriteAllText($cfg,$txt,[Text.Encoding]::Unicode)
          $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru;$dl=(Get-Date).AddMinutes(4);while(-not$p.HasExited-and(Get-Date)-lt$dl){Start-Sleep 2;$p.Refresh()};if(-not$p.HasExited){Stop-Process $p.Id -Force;throw 'C6 timeout'}
          $l=(Get-ChildItem $ld -Filter '*.log'|Sort-Object LastWriteTime)[-1];Copy-Item $l.FullName "$b\RunT177JournalTests-native.log";$raw=Get-Content $l.FullName -Raw;Write-Host $raw;$m=[regex]::Match($raw,'T17\.7 C6 journal tests:\s*(\d+) passed,\s*(\d+) failed');if(-not$m.Success-or[int]$m.Groups[1].Value-ne24-or[int]$m.Groups[2].Value-ne0-or$raw-notmatch'ALL GREEN'){throw 'C6 expected 24/0'}
      - name: Package C6 evidence
        shell: pwsh
        run: |
          $b="$env:GITHUB_WORKSPACE\build-t177c6";Compress-Archive "$b\*" "$env:GITHUB_WORKSPACE\BlackDragon-T17.7-C6-evidence.zip" -Force;$h=(Get-FileHash "$env:GITHUB_WORKSPACE\BlackDragon-T17.7-C6-evidence.zip" -Algorithm SHA256).Hash.ToLowerInvariant();"PACKAGE_SHA256=$h"|Add-Content "$b\PROVENANCE.txt";Write-Host "PACKAGE_SHA256=$h"
      - uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t177-c6-exact-tree
          path: |
            build-t177c6/
            BlackDragon-T17.7-C6-evidence.zip
          if-no-files-found: error
