name: Verify T17.7 C5 Input Migration

on:
  pull_request:
    branches: [ feat/recovery-t16-arcs-stacked ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/RunT177MigrationTests.mq5'
      - 'BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t177_migration_model.cpp'
      - '.github/workflows/verify-t177-c5.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  t177-c5-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Run T17.7 C5 independent migration model
        shell: bash
        run: |
          set -euo pipefail
          SRC='BlackDragon_v14/Scripts/BlackDragon/Tests/pyramid_t177_migration_model.cpp'
          g++ -std=c++17 -O2 -Wall -Wextra "$SRC" -o /tmp/t177c5
          /tmp/t177c5 | tee /tmp/t177c5.out
          grep -q 'T17.7 C5 migration model: 32 passed, 0 failed' /tmp/t177c5.out
          grep -q 'ALL GREEN' /tmp/t177c5.out

      - name: Verify C5 source and migration contracts
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          root=Path('BlackDragon_v14/Include/BlackDragon')
          cfg=(root/'Recovery/RecoveryT16Config.mqh').read_text(encoding='utf-8')
          cfgbase=(root/'Recovery/RecoveryT16ConfigT177C4Base.mqh').read_text(encoding='utf-8')
          persist=(root/'Recovery/RecoveryArcsPersistence.mqh').read_text(encoding='utf-8')
          persistbase=(root/'Recovery/RecoveryArcsPersistenceT177C4Base.mqh').read_text(encoding='utf-8')
          coord=(root/'Overlap/OverlapT177Coordinator.mqh').read_text(encoding='utf-8')
          coordbase=(root/'Overlap/OverlapT177CoordinatorT177C3Base.mqh').read_text(encoding='utf-8')
          c4=(root/'Recovery/RecoveryArcsStackT177HedgeLadder.mqh').read_text(encoding='utf-8')
          native=Path('BlackDragon_v14/Scripts/BlackDragon/Tests/RunT177MigrationTests.mq5').read_text(encoding='utf-8')

          assert '#define BD_T177_CONFIG_POLICY_REV       1' in cfg
          assert '#define BD_T177_PERSIST_MIGRATION_REV   1' in cfg
          for token in ['OverlapPolicy_','HedgeTargetCoveragePercent_',
                        'HedgeAbsoluteMaxCoveragePercent_',
                        'OVERLAP_LEGACY_AUTO','OVERLAP_CORE_ONLY',
                        'OVERLAP_ALLOW_DURING_RECOVERY']:
              assert token in cfg
          assert '#define HedgeVolumePercent_' in cfg
          assert '#define HedgePyramidMaxCoveragePercent_' in cfg
          assert '#define EnableGlobalHedgeSL_' in cfg
          assert '#define GlobalSLAfterGenerations_' in cfg
          assert '#define Overlap' in cfg
          assert 'Recovery_T177ConditionalDcaTextPure' in cfg
          assert 'Recovery_T177ConditionalGlobalTextPure' in cfg
          assert 'Recovery_T177ConditionalOverlapTextPure' in cfg
          fp=cfg[cfg.index('uint Recovery_T177SemanticFingerprintC5()'):cfg.index('double Recovery_T177RuntimeHedgePercentC5')]
          assert 'ReHedgeGapPips_' not in fp
          assert 'if(CorePyramidMode_ != pyramid_TAT)' in fp
          assert 'if(HedgePyramidMode_ != hedge_pyramid_TAT)' in fp
          assert 't177HedgeLadderRev=1' in fp
          newgen=cfg[cfg.index('long Recovery_T177NewGenerationUnitsC5'):cfg.index('long Recovery_T177PostOverlapGenerationUnitsC5')]
          assert 'raw < minUnits' in newgen and 'return 0;' in newgen

          for token in ['input double HedgeVolumePercent_',
                        'input bool   EnableGlobalHedgeSL_',
                        'input bool OverlapAfterHedge_']:
              assert token in cfgbase
          assert 'ReHedgeGapPips_' in (root/'Recovery/RecoveryTypes.mqh').read_text(encoding='utf-8')

          assert 'Recovery_T177LegacySemanticFingerprintC5()' in persist
          assert 'Recovery_T177CanAcceptLegacyPersistenceC5()' in persist
          assert 'ARCS_BUILDING' in persist and 'ARCS_ACTIVE' in persist
          assert 'State ARCS cũ đang BUILDING/ACTIVE/PENDING' in persist
          assert 'CRecoveryArcsPersistenceT177C4Base::Load' in persist
          assert 'BD_ARCS_PERSIST_VERSION 4' in persistbase

          assert 'OVERLAP_OFF' in coord
          assert 'OVERLAP_CORE_ONLY' in coord
          assert 'Recovery_T177OverlapCoreOnlyBlockedPure' in coord
          assert 'COverlapT177CoordinatorT177C3Base::Arm' in coord
          assert 'overlap_T177_LEG2_WAIT_SAFE' in coordbase
          assert 'ReadLeg1Realized' in coordbase
          assert 'SaveAll(persistWhy)' in coordbase

          assert 'BuildExecutablePlan' in c4
          assert 'Recovery_T177BuildExecutableHedgeLadderPure' in c4
          assert 'C5 fingerprint revision rotates default semantic' in native

          def blob(path):
              return subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
          assert blob(root/'Recovery/RecoveryT16ConfigT177C4Base.mqh') == 'bdf5771bd36712120ef47d90971d63f61e653f6c'
          assert blob(root/'Recovery/RecoveryArcsPersistenceT177C4Base.mqh') == 'a1b89d117d92570fe5e15751b035343d01fc39a4'
          assert blob(root/'Overlap/OverlapT177CoordinatorT177C3Base.mqh') == '79ac34fee03218f396d3600ce2ae83f09f259ffa'
          print('T17.7 C5 source/migration contracts PASS')

      - name: Record exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"

  t177-c5-native:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$env:MT5_DIR\metaeditor64.exe")) { throw 'metaeditor64.exe not found' }
          if (-not (Test-Path "$env:MT5_DIR\terminal64.exe")) { throw 'terminal64.exe not found' }

      - name: Warm terminal and mirror exact tree
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "checkout mismatch actual=$actual expected=$env:SOURCE_SHA" }
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 40
          $t | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')) {
            New-Item -ItemType Directory -Force -Path "$mql5\$d" | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force
          }
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")) {
            if(Test-Path $r) {
              Get-ChildItem $r -Recurse -File | Where-Object {$_.Extension -in '.mq5','.mqh'} | ForEach-Object {
                $txt=Get-Content $_.FullName -Raw -Encoding UTF8
                [System.IO.File]::WriteAllText($_.FullName,$txt,$enc)
              }
            }
          }

      - name: Compile exact C5 targets
        shell: pwsh
        run: |
          $editor="$env:MT5_DIR\metaeditor64.exe"; $mql5="$env:MT5_DIR\MQL5"; $build="$env:GITHUB_WORKSPACE\build-t177c5"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $targets=@(
            @{N='RunT177MigrationTests';S="$mql5\Scripts\BlackDragon\Tests\RunT177MigrationTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunT177MigrationTests.ex5"},
            @{N='BlackDragon';S="$mql5\Experts\BlackDragon\BlackDragon.mq5";O="$mql5\Experts\BlackDragon\BlackDragon.ex5"}
          )
          foreach($t in $targets) {
            $log="$build\$($t.N).log"
            Start-Process $editor -ArgumentList "/compile:`"$($t.S)`" /inc:`"$mql5`" /log:`"$log`"" -Wait -NoNewWindow
            if(-not(Test-Path $log)){throw "$($t.N): no compile log"}
            $text=Get-Content $log -Encoding Unicode -Raw; Write-Host $text
            $err=@(($text -split "`r?`n")|Where-Object{$_ -match ' : error '})
            $warn=@(($text -split "`r?`n")|Where-Object{$_ -match ' : warning '})
            if(-not(Test-Path $t.O)){throw "$($t.N): EX5 missing"}
            if($err.Count -or $warn.Count){throw "$($t.N): $($err.Count) errors / $($warn.Count) warnings"}
            Copy-Item $t.O $build -Force
          }
          $head=(git rev-parse HEAD).Trim(); $tree=(git show -s --format=%T HEAD).Trim()
          if($head-ne$env:SOURCE_SHA){throw 'provenance HEAD mismatch'}
          $eaHash=(Get-FileHash (Join-Path $build 'BlackDragon.ex5') -Algorithm SHA256).Hash.ToLowerInvariant()
          "HEAD=$head`nTREE=$tree`nBLACKDRAGON_EX5_SHA256=$eaHash`n" | Out-File "$build\PROVENANCE.txt" -Encoding utf8
          Write-Host "T17.7 C5 MetaEditor PASS: 0 errors / 0 warnings"
          Write-Host "HEAD=$head TREE=$tree BlackDragon.ex5 SHA256=$eaHash"

      - name: Execute native C5 migration script
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t177c5"; $logDir="$env:MT5_DIR\MQL5\Logs"
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $cfg=Join-Path $build 'RunT177MigrationTests.ini'
          $cfgText="[Common]`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nScript=BlackDragon\Tests\RunT177MigrationTests`r`nSymbol=EURUSD`r`nPeriod=M1`r`nShutdownTerminal=1`r`n"
          [IO.File]::WriteAllText($cfg,$cfgText,[Text.Encoding]::Unicode)
          $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru
          $deadline=(Get-Date).AddMinutes(4)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'T17.7 C5 native timeout'}
          $logs=Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          if(-not $logs){throw 'T17.7 C5 native log missing'}
          $latest=$logs[-1]
          Copy-Item $latest.FullName (Join-Path $build 'RunT177MigrationTests-native.log') -Force
          $raw=Get-Content $latest.FullName -Raw; Write-Host $raw
          $m=[regex]::Match($raw,'T17\.7 C5 migration tests:\s*(\d+) passed,\s*(\d+) failed')
          if(-not $m.Success){throw 'T17.7 C5 summary missing'}
          if([int]$m.Groups[1].Value -ne 39 -or [int]$m.Groups[2].Value -ne 0 -or $raw -notmatch 'ALL GREEN')
          { throw 'T17.7 C5 expected 39/0' }
          Write-Host 'T17.7 C5 native PASS 39/0'

      - name: Package exact C5 evidence
        shell: pwsh
        run: |
          $build="$env:GITHUB_WORKSPACE\build-t177c5"
          Compress-Archive "$build\*" "$env:GITHUB_WORKSPACE\BlackDragon-T17.7-C5-evidence.zip" -Force
          $h=(Get-FileHash "$env:GITHUB_WORKSPACE\BlackDragon-T17.7-C5-evidence.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "PACKAGE_SHA256=$h" | Add-Content "$build\PROVENANCE.txt"
          Write-Host "PACKAGE_SHA256=$h"

      - name: Upload exact C5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t177-c5-exact-tree
          path: |
            build-t177c5/
            BlackDragon-T17.7-C5-evidence.zip
          if-no-files-found: error
