name: Verify T10 Runtime Fix

on:
  push:
    branches: [ feat/adaptive-recovery-t9-persistence-active ]
    paths:
      - 'BlackDragon_v14/Experts/**'
      - 'BlackDragon_v14/Include/**'
      - 'BlackDragon_v14/Scripts/**'
      - '.github/workflows/verify-t10-runtime-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compile and run T10 regression model
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            BlackDragon_v14/Scripts/BlackDragon/Tests/recovery_t10_runtime_guard_suite.cpp \
            -o /tmp/t10
          /tmp/t10

      - name: Verify integration ordering and localized labels
        shell: python
        run: |
          from pathlib import Path

          strategy = Path('BlackDragon_v14/Include/BlackDragon/Strategy.mqh').read_text(encoding='utf-8')
          coord = Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh').read_text(encoding='utf-8')
          types = Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryTypes.mqh').read_text(encoding='utf-8')
          dca = Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryDca.mqh').read_text(encoding='utf-8')

          pending = strategy.index('if(m_exec.HasAnyPendingClose())')
          guard = strategy.index('if(ApplyGuard(ctx))')
          cleanup = strategy.index('if(m_recoveryExit != NULL && m_recoveryExit.HasBlockingWork())')
          assert pending < guard < cleanup, (pending, guard, cleanup)

          expected = coord.index('IsExpectedRecoveryLockSl(dir, trans.deal)')
          external = coord.index('if(Recovery_ExitExternalDealReason(reason))')
          assert expected < external, (expected, external)
          assert 'Recovery_ExitExpectedLockSlPure' in coord

          assert '16 — Phục hồi thích ứng bằng Hedge' in types
          assert '17 — DCA khi Recovery đang hoạt động' in dca
          assert 'recovery_ACTIVE = 2' in types
          print('T10 static integration gates PASS')

      - name: Record exact source identity
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git show -s --format=%T HEAD)"

  metaeditor:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$env:MT5_DIR\metaeditor64.exe")) { throw 'metaeditor64.exe not found' }

      - name: Warm terminal and mirror sources
        shell: pwsh
        run: |
          $t = Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 40
          $t | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5 = "$env:MT5_DIR\MQL5"
          foreach ($d in @('Experts','Include','Scripts')) {
            New-Item -ItemType Directory -Force -Path "$mql5\$d" | Out-Null
            Copy-Item -Path "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" -Destination "$mql5\$d" -Recurse -Force
          }
          $enc = New-Object System.Text.UnicodeEncoding($false, $true)
          foreach ($r in @("$mql5\Experts\BlackDragon", "$mql5\Include\BlackDragon", "$mql5\Scripts\BlackDragon")) {
            if (-not (Test-Path $r)) { continue }
            Get-ChildItem -LiteralPath $r -Recurse -File | Where-Object { $_.Extension -in '.mq5','.mqh' } | ForEach-Object {
              $txt = Get-Content -LiteralPath $_.FullName -Raw -Encoding UTF8
              [System.IO.File]::WriteAllText($_.FullName, $txt, $enc)
            }
          }

      - name: Compile exact T10 sources
        shell: pwsh
        run: |
          $editor = "$env:MT5_DIR\metaeditor64.exe"
          $mql5 = "$env:MT5_DIR\MQL5"
          $build = "$env:GITHUB_WORKSPACE\build-t10"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $targets = @(
            @{Name='RunTests'; Src="$mql5\Scripts\BlackDragon\Tests\RunTests.mq5"; Out="$mql5\Scripts\BlackDragon\Tests\RunTests.ex5"},
            @{Name='RunRecoveryFoundationTests'; Src="$mql5\Scripts\BlackDragon\Tests\RunRecoveryFoundationTests.mq5"; Out="$mql5\Scripts\BlackDragon\Tests\RunRecoveryFoundationTests.ex5"},
            @{Name='BlackDragon'; Src="$mql5\Experts\BlackDragon\BlackDragon.mq5"; Out="$mql5\Experts\BlackDragon\BlackDragon.ex5"}
          )
          foreach ($t in $targets) {
            $log = "$build\$($t.Name).log"
            $p = Start-Process -FilePath $editor -ArgumentList "/compile:`"$($t.Src)`" /inc:`"$mql5`" /log:`"$log`"" -Wait -PassThru -NoNewWindow
            if (-not (Test-Path $log)) { throw "$($t.Name): no compiler log" }
            $text = Get-Content -LiteralPath $log -Encoding Unicode -Raw
            Write-Host $text
            $errors = @(($text -split "`r?`n") | Where-Object { $_ -match ' : error ' })
            $warnings = @(($text -split "`r?`n") | Where-Object { $_ -match ' : warning ' })
            if (-not (Test-Path $t.Out)) { throw "$($t.Name): EX5 not produced" }
            if ($errors.Count -gt 0 -or $warnings.Count -gt 0) { throw "$($t.Name): $($errors.Count) errors / $($warnings.Count) warnings" }
            Copy-Item -LiteralPath $t.Out -Destination $build -Force
          }
          $head = git rev-parse HEAD
          $tree = git show -s --format=%T HEAD
          "HEAD=$head`nTREE=$tree`n" | Out-File "$build\PROVENANCE.txt" -Encoding utf8
          Write-Host "T10 MetaEditor compile PASS: 0 errors / 0 warnings"

      - name: Upload exact T10 EX5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t10-runtime-fix
          path: build-t10/
          if-no-files-found: error
