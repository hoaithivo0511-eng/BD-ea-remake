name: T11 Apply Global Flatten Fix

on:
  push:
    branches: [ feat/adaptive-recovery-t11-global-flatten-reset ]
    paths: [ '.github/workflows/t11-apply-global-flatten-fix.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-compile-native:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
      T11_BRANCH: 'feat/adaptive-recovery-t11-global-flatten-reset'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact T11 source patch
        shell: python
        run: |
          from pathlib import Path

          def patch_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  print(f'{path}: already patched')
                  return
              if old not in s:
                  raise SystemExit(f'{path}: expected anchor not found')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print(f'{path}: patched')

          # 1) Pure finalization gate used by coordinator + unit tests.
          sm = 'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryStateMachine.mqh'
          old = '''bool Recovery_AdverseGapHitTicks(const eRecoveryCoreDirection dir,
          '''
          new = '''// T11: global MoneyGuard flatten may release Recovery only after the broker\n// account is observably flat and no execution request remains unresolved.\nbool Recovery_GlobalFlattenReadyPure(const int livePositions,\n                                     const bool executionPending)\n{\n   return livePositions == 0 && !executionPending;\n}\n\nbool Recovery_AdverseGapHitTicks(const eRecoveryCoreDirection dir,\n          '''
          patch_once(sm, old, new)

          # 2) RecoveryEngine finalizes BOTH logical cycles only after exact flat proof.
          eng = 'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh'
          old = '''   bool ActiveReady() const
   {
      return m_cfg.mode != recovery_ACTIVE || m_activeReady;
   }

   bool HasDurableCommand(const eRecoveryCoreDirection dir) const
'''
          new = '''   bool ActiveReady() const
   {
      return m_cfg.mode != recovery_ACTIVE || m_activeReady;
   }

   // T11: account-wide MoneyGuard is a terminal boundary for the current
   // Recovery cycles, but only AFTER the broker account is observably flat
   // and ExecutionLayer has no unresolved request that could refill exposure.
   // This clears stale T5/T6/durable state, persists COMPLETED, and leaves
   // ACTIVE ready so the next confirmed Core series can reuse the slot.
   bool FinalizeAccountWideFlatten(CExecutionLayer &exec,
                                   const datetime now,
                                   string &why)
   {
      why = "";
      if(m_cfg.mode != recovery_ACTIVE) return true;
      if(!m_initialized)
      {
         why = "RecoveryEngine is not initialized";
         return false;
      }
      if(m_persistenceBlocked)
      {
         m_activeReady = false;
         why = "Recovery persistence is blocked; global flatten cannot be finalized durably";
         return false;
      }
      if(!Recovery_GlobalFlattenReadyPure(PositionsTotal(), exec.HasPending()))
      {
         why = "global flatten still has live positions or unresolved execution requests";
         return false;
      }

      // The account-wide guard is stronger than any prior Core/Recovery intent.
      // At this point PositionsTotal()==0, so clearing a durable command cannot
      // hide live exposure; any unresolved broker request would have failed the
      // gate above and kept the coordinator latched.
      for(int idx = 0; idx < 2; idx++)
      {
         eRecoveryCoreDirection dir = idx == 0 ? recovery_CORE_BUY : recovery_CORE_SELL;
         if(CoreUnits(dir) != 0 || RawRecoveryUnits(dir) != 0)
         {
            why = "directional exposure is not flat after account-wide close";
            return false;
         }
      }

      for(int idx = 0; idx < 2; idx++)
      {
         eRecoveryCoreDirection dir = idx == 0 ? recovery_CORE_BUY : recovery_CORE_SELL;
         SRecoveryCycle c;
         m_registry.GetCycle(dir, c);
         if(c.state != recovery_COMPLETED &&
            !m_registry.Transition(dir, recovery_COMPLETED, now,
                                   "account-wide MoneyGuard flatten confirmed"))
         {
            why = "FSM rejected terminal COMPLETED transition after confirmed global flatten";
            return false;
         }

         m_registry.ObserveCore(dir, 0, 0.0, 0.0, now);
         m_registry.ObserveHedgeMetrics(dir, 0.0, 0.0);
         Recovery_T5RuntimeInit(m_t5[idx]);
         ResetT6Cycle(idx);
         Recovery_PendingInit(m_pending[idx]);
         m_registry.GetCycle(dir, c);
         m_t5CycleSerial[idx] = c.cycleSerial;
      }

      m_activeReady = true;
      m_dirty = true;
      string saveWhy = "";
      if(!SaveState(saveWhy))
      {
         m_activeReady = false;
         why = "confirmed global flatten could not persist COMPLETED state: " + saveWhy;
         return false;
      }

      Log_Info("Recovery", "GLOBAL FLATTEN complete — Recovery cycle COMPLETED; new Core series enabled");
      return true;
   }

   bool HasDurableCommand(const eRecoveryCoreDirection dir) const
'''
          patch_once(eng, old, new)

          # 3) Coordinator waits for ALL journal work, finalizes Recovery, then releases.
          coord = 'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh'
          old = '''      if(m_accountWidePending)
      {
         if(m_exec.HasAnyPendingClose()) return true;
         if(PositionsTotal() > 0)
         {
            int sent = m_exec.CloseAllAccount();
            if(sent <= 0)
               why = "account-wide close still has positions but no close request was accepted";
            return true;
         }
         m_accountWidePending = false;
         m_accountWideStartedAt = 0;
         ResetCycle(0);
         ResetCycle(1);
         return false;
      }
'''
          new = '''      if(m_accountWidePending)
      {
         // Do not duplicate an in-flight close. If an OPEN/MODIFY request from
         // before the global guard is still unresolved, keep this latch alive;
         // a late fill will be observed and closed on a later Drive() pass.
         if(m_exec.HasAnyPendingClose()) return true;
         if(PositionsTotal() > 0)
         {
            int sent = m_exec.CloseAllAccount();
            if(sent <= 0)
               why = "account-wide close still has positions but no close request was accepted";
            return true;
         }
         if(!Recovery_GlobalFlattenReadyPure(PositionsTotal(), m_exec.HasPending()))
         {
            why = "account-wide close is flat but execution journal still has unresolved request(s)";
            return true;
         }

         string finalizeWhy = "";
         if(!m_recovery.FinalizeAccountWideFlatten(*m_exec, now, finalizeWhy))
         {
            why = "account-wide close cannot finalize Recovery lifecycle: " + finalizeWhy;
            return true;
         }

         m_accountWidePending = false;
         m_accountWideStartedAt = 0;
         ResetCycle(0);
         ResetCycle(1);
         return false;
      }
'''
          patch_once(coord, old, new)

          # 4) Make a blocked ACTIVE new-series gate visible in Journal.
          dca = 'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryDca.mqh'
          old = '''   bool Allow(const EAContext &ctx, const int dir)
   {
      if(RecoveryMode_ != recovery_ACTIVE) return true;
      return m_recovery != NULL && m_recovery.ActiveReady();
   }
'''
          new = '''   bool Allow(const EAContext &ctx, const int dir)
   {
      if(RecoveryMode_ != recovery_ACTIVE) return true;
      if(m_recovery == NULL)
      {
         Log_Warn("Recovery", "newseriesgate" + (string)dir,
                  "new Core series blocked: Recovery engine is unavailable");
         return false;
      }
      if(!m_recovery.ActiveReady())
      {
         Log_Warn("Recovery", "newseriesgate" + (string)dir,
                  "new Core series blocked: Recovery ACTIVE is not reconciled/ready");
         return false;
      }
      return true;
   }
'''
          patch_once(dca, old, new)

          # 5) Regression assertions: global-flat gate + legal terminal transitions.
          tests = 'BlackDragon_v14/Scripts/BlackDragon/Tests/RunTests.mq5'
          old = '#include <BlackDragon/WmfSignal.mqh>        // v14.6: WMF_* pure functions\n'
          new = old + '#include <BlackDragon/Recovery/RecoveryStateMachine.mqh> // T11 global-flatten lifecycle\n'
          patch_once(tests, old, new)

          old = '''   //--- BD-R10: account-wide closes preserve position ownership ----------
   CheckEq("BD-R10 own position keeps bot magic",    (double)Exec_CloseRequestMagic(1111), 1111);
   CheckEq("BD-R10 foreign position stays foreign",  (double)Exec_CloseRequestMagic(2222), 2222);
   CheckEq("BD-R10 manual position stays magic-0",   (double)Exec_CloseRequestMagic(0), 0);
   CheckEq("BD-R10 invalid negative magic clamps 0", (double)Exec_CloseRequestMagic(-1), 0);

   PrintFormat("BlackDragon v14 unit tests: %d passed, %d failed", g_pass, g_fail);
'''
          new = '''   //--- BD-R10: account-wide closes preserve position ownership ----------
   CheckEq("BD-R10 own position keeps bot magic",    (double)Exec_CloseRequestMagic(1111), 1111);
   CheckEq("BD-R10 foreign position stays foreign",  (double)Exec_CloseRequestMagic(2222), 2222);
   CheckEq("BD-R10 manual position stays magic-0",   (double)Exec_CloseRequestMagic(0), 0);
   CheckEq("BD-R10 invalid negative magic clamps 0", (double)Exec_CloseRequestMagic(-1), 0);

   //--- T11: MoneyGuard global flatten must become a clean cycle boundary --
   Check("T11 flat + no journal -> finalizable", Recovery_GlobalFlattenReadyPure(0, false));
   Check("T11 flat + pending journal -> BLOCK", !Recovery_GlobalFlattenReadyPure(0, true));
   Check("T11 live position -> BLOCK", !Recovery_GlobalFlattenReadyPure(1, false));

   Check("T11 CORE_ONLY -> COMPLETED", Recovery_StateTransitionAllowed(recovery_CORE_ONLY, recovery_COMPLETED));
   Check("T11 ARMED -> COMPLETED", Recovery_StateTransitionAllowed(recovery_ARMED, recovery_COMPLETED));
   Check("T11 HEDGE_BUILDING -> COMPLETED", Recovery_StateTransitionAllowed(recovery_HEDGE_BUILDING, recovery_COMPLETED));
   Check("T11 HEDGE_ACTIVE -> COMPLETED", Recovery_StateTransitionAllowed(recovery_HEDGE_ACTIVE, recovery_COMPLETED));
   Check("T11 HEDGE_TP_PENDING -> COMPLETED", Recovery_StateTransitionAllowed(recovery_HEDGE_TP_PENDING, recovery_COMPLETED));
   Check("T11 CORE_CLOSE_PENDING -> COMPLETED", Recovery_StateTransitionAllowed(recovery_CORE_CLOSE_PENDING, recovery_COMPLETED));
   Check("T11 HEDGE_LOCK_PENDING -> COMPLETED", Recovery_StateTransitionAllowed(recovery_HEDGE_LOCK_PENDING, recovery_COMPLETED));
   Check("T11 HEDGE_LOCKED -> COMPLETED", Recovery_StateTransitionAllowed(recovery_HEDGE_LOCKED, recovery_COMPLETED));
   Check("T11 REHEDGE_PENDING -> COMPLETED", Recovery_StateTransitionAllowed(recovery_REHEDGE_PENDING, recovery_COMPLETED));
   Check("T11 PAUSE_SOFT -> COMPLETED", Recovery_StateTransitionAllowed(recovery_PAUSE_SOFT, recovery_COMPLETED));
   Check("T11 PAUSE_HARD -> COMPLETED", Recovery_StateTransitionAllowed(recovery_PAUSE_HARD, recovery_COMPLETED));
   Check("T11 RECONCILE_REQUIRED -> COMPLETED", Recovery_StateTransitionAllowed(recovery_RECONCILE_REQUIRED, recovery_COMPLETED));
   Check("T11 GLOBAL_STOP -> COMPLETED", Recovery_StateTransitionAllowed(recovery_GLOBAL_STOP, recovery_COMPLETED));
   Check("T11 COMPLETED -> CORE_ONLY reusable", Recovery_StateTransitionAllowed(recovery_COMPLETED, recovery_CORE_ONLY));

   PrintFormat("BlackDragon v14 unit tests: %d passed, %d failed", g_pass, g_fail);
'''
          patch_once(tests, old, new)

          notes = Path('BlackDragon_v14/docs/vibecode/T11_GLOBAL_FLATTEN_QA_NOTES.md')
          notes.write_text('''# T11 Global Flatten / New-Cycle QA\n\nStatus: IMPLEMENTED; OWNER STRATEGY TESTER RE-VERIFY REQUIRED.\n\nRuntime evidence showed MoneyTPAllAccount correctly closed the account, but RecoveryEngine did not receive a terminal lifecycle boundary. T11 makes a confirmed account-wide flatten transition both Recovery directions to COMPLETED, clears stale T5/T6/durable runtime, persists the terminal state, and keeps ACTIVE ready so a later Core signal may start a clean cycle.\n\nSafety gates:\n- Never finalize while any account position remains.\n- Never finalize while ExecutionLayer has an unresolved request; a late async fill remains covered by the account-wide close latch.\n- Persistence/integrity failure remains fail-closed.\n- COMPLETED is reused only when a new Core series is actually observed.\n- A blocked ACTIVE new-series gate now writes a throttled Journal warning.\n\nEvidence required before release claim: exact MetaEditor compile, native RunTests, and owner Strategy Tester reproduction using the same MoneyTPAllAccount preset.\n''', encoding='utf-8')

      - name: Static T11 integration gates
        shell: python
        run: |
          from pathlib import Path
          eng = Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh').read_text(encoding='utf-8')
          coord = Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh').read_text(encoding='utf-8')
          dca = Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryDca.mqh').read_text(encoding='utf-8')
          tests = Path('BlackDragon_v14/Scripts/BlackDragon/Tests/RunTests.mq5').read_text(encoding='utf-8')
          assert 'FinalizeAccountWideFlatten' in eng
          assert 'Recovery_GlobalFlattenReadyPure(PositionsTotal(), exec.HasPending())' in eng
          assert coord.index('m_exec.HasPending()') < coord.index('FinalizeAccountWideFlatten')
          assert 'new Core series blocked: Recovery ACTIVE is not reconciled/ready' in dca
          assert 'T11 HEDGE_ACTIVE -> COMPLETED' in tests
          assert 'T11 COMPLETED -> CORE_ONLY reusable' in tests
          print('T11 static integration gates PASS')

      - name: Create exact T11 commit locally
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryStateMachine.mqh `
                  BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh `
                  BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh `
                  BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryDca.mqh `
                  BlackDragon_v14/Scripts/BlackDragon/Tests/RunTests.mq5 `
                  BlackDragon_v14/docs/vibecode/T11_GLOBAL_FLATTEN_QA_NOTES.md
          git diff --cached --check
          git commit -m 'fix(recovery): finalize global flatten before new cycle'
          $head=(git rev-parse HEAD).Trim()
          $tree=(git show -s --format=%T HEAD).Trim()
          "T11_HEAD=$head" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T11_TREE=$tree" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "T11_HEAD=$head"
          Write-Host "T11_TREE=$tree"

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile 'mt5setup.exe' -UseBasicParsing
          Start-Process -FilePath '.\mt5setup.exe' -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 10
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$env:MT5_DIR\metaeditor64.exe")) { throw 'metaeditor64.exe not found' }

      - name: Warm terminal and mirror exact committed sources
        shell: pwsh
        run: |
          $t = Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep -Seconds 35
          $t | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $mql5 = "$env:MT5_DIR\MQL5"
          foreach ($d in @('Experts','Include','Scripts')) {
            New-Item -ItemType Directory -Force -Path "$mql5\$d" | Out-Null
            Copy-Item -Path "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" -Destination "$mql5\$d" -Recurse -Force
          }
          $enc = New-Object System.Text.UnicodeEncoding($false, $true)
          foreach ($r in @("$mql5\Experts\BlackDragon", "$mql5\Include\BlackDragon", "$mql5\Scripts\BlackDragon")) {
            if (-not (Test-Path $r)) { continue }
            Get-ChildItem -LiteralPath $r -Recurse -File | Where-Object { $_.Extension -in '.mq5','.mqh' } | ForEach-Object {
              $txt = Get-Content -LiteralPath $_.FullName -Raw -Encoding UTF8
              [System.IO.File]::WriteAllText($_.FullName, $txt, $enc)
            }
          }

      - name: Compile exact T11 sources
        shell: pwsh
        run: |
          $editor = "$env:MT5_DIR\metaeditor64.exe"
          $mql5 = "$env:MT5_DIR\MQL5"
          $build = "$env:GITHUB_WORKSPACE\build-t11"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $targets = @(
            @{Name='RunTests'; Src="$mql5\Scripts\BlackDragon\Tests\RunTests.mq5"; Out="$mql5\Scripts\BlackDragon\Tests\RunTests.ex5"},
            @{Name='RunRecoveryFoundationTests'; Src="$mql5\Scripts\BlackDragon\Tests\RunRecoveryFoundationTests.mq5"; Out="$mql5\Scripts\BlackDragon\Tests\RunRecoveryFoundationTests.ex5"},
            @{Name='BlackDragon'; Src="$mql5\Experts\BlackDragon\BlackDragon.mq5"; Out="$mql5\Experts\BlackDragon\BlackDragon.ex5"}
          )
          foreach ($t in $targets) {
            $log = "$build\$($t.Name).log"
            $p = Start-Process -FilePath $editor -ArgumentList "/compile:`"$($t.Src)`" /inc:`"$mql5`" /log:`"$log`"" -Wait -PassThru -NoNewWindow
            if (-not (Test-Path $log)) { throw "$($t.Name): no compiler log" }
            $text = Get-Content -LiteralPath $log -Encoding Unicode -Raw
            Write-Host $text
            $errors = @(($text -split "`r?`n") | Where-Object { $_ -match ' : error ' })
            $warnings = @(($text -split "`r?`n") | Where-Object { $_ -match ' : warning ' })
            if (-not (Test-Path $t.Out)) { throw "$($t.Name): EX5 not produced" }
            if ($errors.Count -gt 0 -or $warnings.Count -gt 0) { throw "$($t.Name): $($errors.Count) errors / $($warnings.Count) warnings" }
            Copy-Item -LiteralPath $t.Out -Destination $build -Force
          }
          "HEAD=$env:T11_HEAD`nTREE=$env:T11_TREE`n" | Out-File "$build\PROVENANCE.txt" -Encoding utf8
          Write-Host 'T11 MetaEditor compile PASS: 0 errors / 0 warnings'

      - name: Execute native T11 RunTests
        shell: pwsh
        run: |
          $mql5="$env:MT5_DIR\MQL5"
          $out="$env:GITHUB_WORKSPACE\native-t11"
          New-Item -ItemType Directory -Force $out|Out-Null
          $cfg=Join-Path $out runtests.ini
          $txt=@"
          [Common]
          NewsEnable=0
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1
          [StartUp]
          Script=BlackDragon\Tests\RunTests
          Symbol=EURUSD
          Period=M1
          ShutdownTerminal=1
          "@
          [IO.File]::WriteAllText($cfg,$txt,[Text.Encoding]::Unicode)
          $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru
          $deadline=(Get-Date).AddMinutes(4)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 3;$p.Refresh()}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'native timeout'}
          $logs=Get-ChildItem "$env:MT5_DIR\MQL5\Logs" -Filter '*.log'|Sort-Object LastWriteTime
          if(-not $logs){throw 'MQL5 log missing'}
          $latest=$logs[-1]
          Copy-Item $latest.FullName (Join-Path $out runtests-mql5.log) -Force
          $raw=Get-Content $latest.FullName -Raw
          Write-Host $raw
          $m=[regex]::Match($raw,'BlackDragon v14 unit tests:\s*(\d+) passed,\s*(\d+) failed')
          if(-not $m.Success){throw 'summary missing'}
          $pcount=[int]$m.Groups[1].Value;$fcount=[int]$m.Groups[2].Value
          "passed=$pcount failed=$fcount`nHEAD=$env:T11_HEAD`nTREE=$env:T11_TREE"|Out-File (Join-Path $out SUMMARY.txt)
          if($fcount -ne 0 -or $pcount -le 221 -or $raw -notmatch 'ALL GREEN'){throw "native assertions failed: $pcount/$fcount"}
          Write-Host "T11 native PASS: $pcount passed / $fcount failed"

      - name: Push exact verified T11 commit
        shell: pwsh
        run: |
          git status --short
          if((git rev-parse HEAD).Trim() -ne $env:T11_HEAD){throw 'HEAD moved after verification'}
          git push origin "HEAD:$env:T11_BRANCH"

      - name: Upload exact T11 build and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t11-global-flatten-fix
          path: |
            build-t11/
            native-t11/
          if-no-files-found: warn
