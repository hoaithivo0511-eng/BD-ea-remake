name: T12 Apply Atomic Global Flatten + Verify

on:
  push:
    branches: [ feat/adaptive-recovery-t12-atomic-global-flatten ]
    paths: [ '.github/workflows/t12-apply-verify.yml' ]

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'
      EXPECTED_RUNTESTS: '246'
      EXPECTED_FOUNDATION: '26'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-recovery-t12-atomic-global-flatten
          fetch-depth: 0
          persist-credentials: true

      - name: Apply T12 source patch with exact anchors
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path.cwd()
          gf = root / 'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryGlobalFlatten.mqh'
          eng = root / 'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh'
          coord = root / 'BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh'
          tests = root / 'BlackDragon_v14/Scripts/BlackDragon/Tests/RunTests.mq5'

          def read(p): return p.read_text(encoding='utf-8')
          def write(p, s): p.write_text(s, encoding='utf-8', newline='\n')

          # 1) Shared pure gate + serial idempotency helpers.
          s = read(gf)
          old = '''bool Recovery_GlobalFlattenReadyPure(const int livePositions,
                                               const bool executionPending)
          {
             return livePositions == 0 && !executionPending;
          }
          '''
          new = '''bool Recovery_GlobalFlattenReadyPure(const int livePositions,
                                               const bool executionPending)
          {
             return livePositions == 0 && !executionPending;
          }

          // T12: a confirmed account-wide flatten is a new known-empty broker
          // boundary. It may recover ACTIVE from an earlier runtime
          // reconcile/fail-closed state, but never through persistence or
          // execution ambiguity.
          bool Recovery_GlobalFlattenCanFinalizePure(const int livePositions,
                                                      const bool executionPending,
                                                      const bool persistenceBlocked,
                                                      const bool buyReconcileRequired,
                                                      const bool sellReconcileRequired)
          {
             return Recovery_GlobalFlattenReadyPure(livePositions, executionPending) &&
                    !persistenceBlocked &&
                    !buyReconcileRequired &&
                    !sellReconcileRequired;
          }

          // Roll exactly once when a non-terminal slot is terminalized. If a
          // persistence retry re-enters with COMPLETED already visible, keep
          // the serial stable so T5/T6 cannot be reset repeatedly.
          int Recovery_GlobalFlattenNextSerialPure(const int currentSerial,
                                                   const bool alreadyCompleted)
          {
             int serial = currentSerial < 1 ? 1 : currentSerial;
             return alreadyCompleted ? serial : serial + 1;
          }
          '''
          if 'Recovery_GlobalFlattenCanFinalizePure' not in s:
              if old not in s:
                  raise SystemExit('T12 patch anchor missing in RecoveryGlobalFlatten.mqh')
              s = s.replace(old, new, 1)
              s = s.replace('RecoveryGlobalFlatten.mqh — T11 global-close lifecycle latch',
                            'RecoveryGlobalFlatten.mqh — T12 atomic global-close gates')
              write(gf, s)

          # 2) Atomic finalizer lives inside RecoveryEngine so it can reset the
          # private registry/T5/T6/durable state without depending on normal
          # OnTick or ActiveReady().
          s = read(eng)
          method = r'''

             //--- T12 atomic global MoneyGuard flatten boundary ----------------
             // Called ONLY after the exit coordinator proves the whole account is
             // flat and the execution journal is quiet. This path deliberately does
             // not require m_activeReady: a confirmed global flatten is precisely
             // the recovery boundary that must be able to clear a prior runtime
             // reconcile latch without deadlocking normal OnTick.
             bool FinalizeConfirmedGlobalFlatten(CExecutionLayer &exec,
                                                 const datetime now,
                                                 string &why)
             {
                why = "";
                if(m_cfg.mode != recovery_ACTIVE) return true;
                if(!m_initialized)
                {
                   why = "RecoveryEngine is not initialized";
                   return false;
                }

                const int buyKey = Recovery_CycleKey(recovery_CORE_BUY);
                const int sellKey = Recovery_CycleKey(recovery_CORE_SELL);
                exec.ReconcileCycle(buyKey);
                exec.ReconcileCycle(sellKey);

                bool buyReconcile = exec.HasReconcileRequired(buyKey);
                bool sellReconcile = exec.HasReconcileRequired(sellKey);
                if(!Recovery_GlobalFlattenCanFinalizePure(PositionsTotal(),
                                                          exec.HasPending(),
                                                          m_persistenceBlocked,
                                                          buyReconcile,
                                                          sellReconcile))
                {
                   if(PositionsTotal() != 0)
                      why = "global flatten finalizer requires zero live account positions";
                   else if(exec.HasPending())
                      why = "global flatten finalizer requires a quiet execution journal";
                   else if(m_persistenceBlocked)
                      why = "Recovery persistence is blocked by startup integrity/identity failure";
                   else if(buyReconcile || sellReconcile)
                      why = "Recovery execution journal still requires strict reconciliation";
                   else
                      why = "global flatten finalizer preconditions are not proven";
                   return false;
                }

                for(int i = 0; i < 2; i++)
                {
                   eRecoveryCoreDirection dir = i == 0 ? recovery_CORE_BUY : recovery_CORE_SELL;
                   SRecoveryCycle c;
                   m_registry.GetCycle(dir, c);
                   bool alreadyCompleted = c.state == recovery_COMPLETED;

                   if(!alreadyCompleted)
                   {
                      if(!Recovery_StateTransitionAllowed(c.state, recovery_COMPLETED) ||
                         !m_registry.Transition(dir, recovery_COMPLETED, now,
                                               "confirmed account-wide MoneyGuard flatten"))
                      {
                         why = "Recovery registry rejected global flatten completion for " +
                               Recovery_DirectionName(dir);
                         m_activeReady = false;
                         return false;
                      }
                      m_registry.GetCycle(dir, c);
                   }

                   c.cycleSerial = Recovery_GlobalFlattenNextSerialPure(c.cycleSerial,
                                                                        alreadyCompleted);
                   c.state                    = recovery_COMPLETED;
                   c.armed                    = false;
                   c.coreCount                = 0;
                   c.coreLots                 = 0.0;
                   c.coreNetBE                = 0.0;
                   c.activeHedgeLots          = 0.0;
                   c.hedgeNetBE               = 0.0;
                   c.coveragePercent          = 0.0;
                   c.corridorPrice            = 0.0;
                   c.armedDcaCount            = 0;
                   c.anchorDeal               = 0;
                   c.anchorPosition           = 0;
                   c.anchorPrice              = 0.0;
                   c.anchorTicks              = 0;
                   c.anchorTime               = 0;
                   c.hedgeGeneration          = 0;
                   c.bundleId                 = 0;
                   c.bundleTargetUnits        = 0;
                   c.bundleBaselineActiveUnits= 0;
                   c.bundleConfirmedUnits     = 0;
                   c.bundleSubmittedChildren  = 0;
                   c.bundleChildInFlight      = false;
                   c.bundlePartialCoverage    = false;
                   c.bundleBlockedAfterReject = false;
                   c.bundleReconcileRequired  = false;
                   c.bundleComplete           = false;
                   c.bundleCoveragePercent    = 0.0;
                   c.shadowDecision           = recovery_SHADOW_NONE;
                   c.shadowDecisionLatched    = false;
                   c.shadowTargetUnits        = 0;
                   c.shadowTriggerPrice       = 0.0;
                   c.shadowDecisionAt         = 0;
                   c.shadowPlannedChildren    = 0;
                   c.shadowPlanValid          = false;
                   c.anchorEvidenceWaitLogged = false;

                   if(!m_registry.RestoreCycle(dir, c))
                   {
                      why = "Recovery registry rejected sanitized COMPLETED cycle for " +
                            Recovery_DirectionName(dir);
                      m_activeReady = false;
                      return false;
                   }

                   // Reset all per-cycle mutation/accounting state in memory before
                   // writing the terminal snapshot. No per-command intermediate save:
                   // this is one atomic logical boundary.
                   Recovery_PendingInit(m_pending[i]);
                   Recovery_T5RuntimeInit(m_t5[i]);
                   ResetT6Cycle(i);
                   m_t5CycleSerial[i] = c.cycleSerial;
                }

                // Closing deals owned by Core/Recovery are normally cursor-tracked by
                // OnTradeTransaction; reseed once at this boundary so persistence can
                // never replay a pre-flatten close after a later restart.
                SeedLatestRelevantCursor();
                Recovery_ClearGlobalFlattenFinalization(); // clear obsolete T11 latch

                m_activeReady = true;
                m_dirty = true;
                string saveWhy = "";
                if(!SaveState(saveWhy))
                {
                   m_activeReady = false;
                   why = "atomic global flatten state could not be persisted: " + saveWhy;
                   return false;
                }

                m_persistLoaded = true;
                m_persistMissing = false;
                m_startupFaultReason = "";
                Log_Info("Recovery",
                         "T12 GLOBAL FLATTEN finalized atomically — BUY/SELL COMPLETED, runtime reset, persistence durable, ACTIVE re-armed");
                return true;
             }
          '''
          if 'bool FinalizeConfirmedGlobalFlatten' not in s:
              anchor = '\n\n\n   bool StartupReconcile(CExecutionLayer &exec, string &why)\n'
              if anchor not in s:
                  anchor = '\n\n   bool StartupReconcile(CExecutionLayer &exec, string &why)\n'
              if anchor not in s:
                  raise SystemExit('T12 insertion anchor missing in RecoveryEngine.mqh')
              s = s.replace(anchor, method + anchor, 1)
              write(eng, s)

          # 3) Replace T11 two-phase OnTick-dependent wait with one direct
          # engine transaction. The account-wide coordinator stays latched on
          # any failed precondition/save, so safety remains fail-closed.
          s = read(coord)
          if 'T12 global flatten finalizer blocked' not in s:
              start_marker = '         // A durable command from the pre-empted Recovery mutation chain is\n'
              end_marker = '      bool blocking = false;\n'
              start = s.find(start_marker)
              end = s.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('T12 replacement anchors missing in RecoveryExitCoordinator.mqh')
              replacement = '''         string finalizeWhy = "";
                   if(!m_recovery.FinalizeConfirmedGlobalFlatten(*m_exec, now, finalizeWhy))
                   {
                      why = "T12 global flatten finalizer blocked: " + finalizeWhy;
                      return true;
                   }

                   Recovery_ClearGlobalFlattenFinalization();
                   m_accountWidePending = false;
                   m_accountWideStartedAt = 0;
                   ResetCycle(0);
                   ResetCycle(1);
                   Log_Info("Recovery",
                            "GLOBAL FLATTEN complete — atomic Recovery state persisted; ACTIVE re-armed; new Core series enabled");
                   return false;
                }

          '''
              s = s[:start] + replacement + s[end:]
              write(coord, s)

          # 4) Add pure regression gates. These exercise the exact shared
          # precondition/serial helpers used by production T12.
          s = read(tests)
          if 'T12 atomic finalizer: safe known-empty boundary' not in s:
              needle = '   PrintFormat("BlackDragon v14 unit tests: %d passed, %d failed", g_pass, g_fail);\n'
              if needle not in s:
                  raise SystemExit('RunTests summary anchor missing')
              add = '''   //--- T12: atomic global-flatten finalizer ---------------------------
                   Check("T12 atomic finalizer: safe known-empty boundary",
                         Recovery_GlobalFlattenCanFinalizePure(0, false, false, false, false));
                   Check("T12 atomic finalizer: live position blocks",
                         !Recovery_GlobalFlattenCanFinalizePure(1, false, false, false, false));
                   Check("T12 atomic finalizer: pending journal blocks",
                         !Recovery_GlobalFlattenCanFinalizePure(0, true, false, false, false));
                   Check("T12 atomic finalizer: persistence fault blocks",
                         !Recovery_GlobalFlattenCanFinalizePure(0, false, true, false, false));
                   Check("T12 atomic finalizer: BUY reconcile blocks",
                         !Recovery_GlobalFlattenCanFinalizePure(0, false, false, true, false));
                   Check("T12 atomic finalizer: SELL reconcile blocks",
                         !Recovery_GlobalFlattenCanFinalizePure(0, false, false, false, true));
                   CheckEq("T12 non-terminal completion rolls serial once",
                           Recovery_GlobalFlattenNextSerialPure(7, false), 8);
                   CheckEq("T12 persistence retry on COMPLETED keeps serial",
                           Recovery_GlobalFlattenNextSerialPure(8, true), 8);

          '''
              s = s.replace(needle, add + needle, 1)
              write(tests, s)

          # Source-contract checks catch accidental partial patching before we
          # spend time installing MT5.
          engine = read(eng)
          coordinator = read(coord)
          test_text = read(tests)
          required = [
              ('engine finalizer', 'FinalizeConfirmedGlobalFlatten' in engine),
              ('engine explicit re-arm', 'm_activeReady = true;' in engine),
              ('engine atomic pending reset', 'Recovery_PendingInit(m_pending[i]);' in engine),
              ('coordinator calls finalizer', 'FinalizeConfirmedGlobalFlatten(*m_exec' in coordinator),
              ('old T11 wait removed', 'waiting for BUY/SELL Recovery cycles to reach COMPLETED' not in coordinator),
              ('T12 tests present', 'T12 persistence retry on COMPLETED keeps serial' in test_text),
          ]
          bad = [name for name, ok in required if not ok]
          if bad:
              raise SystemExit('T12 source contract failed: ' + ', '.join(bad))

          # Remove this one-shot workflow in the SAME product commit. The job
          # continues from the checked-out workflow, while the final branch tree
          # contains only product/test changes and is exactly what gets compiled.
          self_path = root / '.github/workflows/t12-apply-verify.yml'
          if self_path.exists():
              self_path.unlink()
          print('T12 patch applied; one-shot workflow scheduled for deletion in product commit')
          '@ | Set-Content -Path t12_patch.py -Encoding UTF8
          python t12_patch.py
          git diff --check
          git status --short

      - name: Commit exact T12 product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryGlobalFlatten.mqh \
                  BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh \
                  BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh \
                  BlackDragon_v14/Scripts/BlackDragon/Tests/RunTests.mq5 \
                  .github/workflows/t12-apply-verify.yml
          git commit -m "fix(recovery): T12 atomic global flatten finalizer"
          git push origin HEAD:feat/adaptive-recovery-t12-atomic-global-flatten
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git show -s --format=%T HEAD)" >> "$GITHUB_ENV"
          echo "T12 committed head=$(git rev-parse HEAD) tree=$(git show -s --format=%T HEAD)"

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile mt5setup.exe -UseBasicParsing
          Start-Process .\mt5setup.exe -ArgumentList '/auto' -Wait
          Start-Sleep 10
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if(!(Test-Path "$env:MT5_DIR\metaeditor64.exe")){ throw 'MetaEditor missing' }
          $t=Start-Process "$env:MT5_DIR\terminal64.exe" -PassThru
          Start-Sleep 35
          $t|Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 3

      - name: Mirror and re-encode sources
        shell: pwsh
        run: |
          $mql5="$env:MT5_DIR\MQL5"
          foreach($d in @('Experts','Include','Scripts')){
            New-Item -ItemType Directory -Force "$mql5\$d"|Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\BlackDragon_v14\$d\*" "$mql5\$d" -Recurse -Force
          }
          $enc=New-Object System.Text.UnicodeEncoding($false,$true)
          foreach($r in @("$mql5\Experts\BlackDragon","$mql5\Include\BlackDragon","$mql5\Scripts\BlackDragon")){
            if(Test-Path $r){
              Get-ChildItem $r -Recurse -File|Where-Object{$_.Extension -in '.mq5','.mqh'}|ForEach-Object{
                $txt=Get-Content $_.FullName -Raw -Encoding UTF8
                [IO.File]::WriteAllText($_.FullName,$txt,$enc)
              }
            }
          }

      - name: Compile T12 exact product
        shell: pwsh
        run: |
          $editor="$env:MT5_DIR\metaeditor64.exe";$mql5="$env:MT5_DIR\MQL5";$build="$env:GITHUB_WORKSPACE\t12-build"
          New-Item -ItemType Directory -Force $build|Out-Null
          $targets=@(
            @{N='RunTests';S="$mql5\Scripts\BlackDragon\Tests\RunTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunTests.ex5"},
            @{N='RunRecoveryFoundationTests';S="$mql5\Scripts\BlackDragon\Tests\RunRecoveryFoundationTests.mq5";O="$mql5\Scripts\BlackDragon\Tests\RunRecoveryFoundationTests.ex5"},
            @{N='BlackDragon';S="$mql5\Experts\BlackDragon\BlackDragon.mq5";O="$mql5\Experts\BlackDragon\BlackDragon.ex5"}
          )
          foreach($t in $targets){
            $log="$build\$($t.N).log"
            $p=Start-Process $editor -ArgumentList "/compile:`"$($t.S)`" /inc:`"$mql5`" /log:`"$log`"" -Wait -PassThru -NoNewWindow
            $raw=Get-Content $log -Raw -Encoding Unicode;Write-Host $raw
            $errs=@(($raw -split "`r?`n")|Where-Object{$_ -match ' : error '})
            $warns=@(($raw -split "`r?`n")|Where-Object{$_ -match ' : warning '})
            if($errs.Count -ne 0 -or $warns.Count -ne 0 -or !(Test-Path $t.O)){
              throw "$($t.N) compile gate failed: errors=$($errs.Count) warnings=$($warns.Count) built=$(Test-Path $t.O)"
            }
            Copy-Item $t.O $build -Force
            Write-Host "$($t.N): 0 errors / 0 warnings; EX5=$((Get-Item $t.O).Length) bytes"
          }
          $head=(git rev-parse HEAD).Trim();$tree=(git show -s --format=%T HEAD).Trim()
          if($head -ne $env:PRODUCT_HEAD -or $tree -ne $env:PRODUCT_TREE){throw 'source identity moved during compile'}
          "PRODUCT_HEAD=$head`nPRODUCT_TREE=$tree"|Out-File "$build\SOURCE_ID.txt"
          Get-FileHash "$build\*.ex5" -Algorithm SHA256|Format-Table -AutoSize|Out-String|Out-File "$build\EX5_SHA256.txt"

      - name: Execute native RunTests and foundation
        shell: pwsh
        run: |
          $mql5="$env:MT5_DIR\MQL5";$out="$env:GITHUB_WORKSPACE\t12-native";New-Item -ItemType Directory -Force $out|Out-Null
          function Run-Script([string]$name,[string]$pattern,[int]$expected){
            $cfg=Join-Path $out "$name.ini"
            $txt=@"
          [Common]
          NewsEnable=0
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1
          [StartUp]
          Script=BlackDragon\Tests\$name
          Symbol=EURUSD
          Period=M1
          ShutdownTerminal=1
          "@
            [IO.File]::WriteAllText($cfg,$txt,[Text.Encoding]::Unicode)
            $before=Get-Date
            $p=Start-Process "$env:MT5_DIR\terminal64.exe" -ArgumentList "/portable /config:`"$cfg`"" -PassThru
            $deadline=(Get-Date).AddMinutes(4)
            while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw "$name native timeout"}
            $logs=Get-ChildItem "$mql5\Logs" -Filter '*.log'|Where-Object{$_.LastWriteTime -ge $before.AddSeconds(-2)}|Sort-Object LastWriteTime
            if(-not $logs){throw "$name MQL5 log missing"}
            $raw=Get-Content $logs[-1].FullName -Raw;Copy-Item $logs[-1].FullName (Join-Path $out "$name.log") -Force;Write-Host $raw
            $m=[regex]::Match($raw,$pattern)
            if(-not $m.Success){throw "$name summary missing"}
            $pass=[int]$m.Groups[1].Value;$fail=[int]$m.Groups[2].Value
            if($pass -ne $expected -or $fail -ne 0 -or $raw -notmatch 'ALL GREEN'){
              throw "$name native gate failed expected=$expected/0 got=$pass/$fail"
            }
            Write-Host "$name native PASS: $pass passed / $fail failed"
            return "$name=$pass/$fail"
          }
          $a=Run-Script 'RunTests' 'BlackDragon v14 unit tests:\s*(\d+) passed,\s*(\d+) failed' ([int]$env:EXPECTED_RUNTESTS)
          $b=Run-Script 'RunRecoveryFoundationTests' 'Recovery T1 foundation tests:\s*(\d+) passed,\s*(\d+) failed' ([int]$env:EXPECTED_FOUNDATION)
          "$a`n$b`nPRODUCT_HEAD=$env:PRODUCT_HEAD`nPRODUCT_TREE=$env:PRODUCT_TREE"|Out-File "$out\SUMMARY.txt"

      - name: Upload exact T12 QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackdragon-t12-atomic-global-flatten
          path: |
            t12-build/
            t12-native/
          if-no-files-found: warn
