name: One-shot BD-R10 patch and verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-bd-r10.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/bd-r10-offline-r1-r9
      TARGET_PR: '4'

    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/bd-r10-offline-r1-r9
          fetch-depth: 0

      - name: Apply exact-match patch and prove 37/37 parity
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_bd_r10_offline_port.py | tee /tmp/parity.log
          git diff --check
          git diff --stat

      - name: Compile and run native C++ suite
        id: cpp
        shell: bash
        run: |
          set -euo pipefail
          SRC='BlackDragon_v14/Scripts/BlackDragon/Tests/offline_suite.cpp'
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic "$SRC" -o /tmp/offline_suite 2>&1 | tee /tmp/build.log
          /tmp/offline_suite | tee /tmp/run.log
          grep -Eq 'BlackDragon v14\.7\.2 offline suite: [0-9]+ passed, 0 failed' /tmp/run.log

      - name: Run AddressSanitizer and UBSan
        id: san
        shell: bash
        run: |
          set -euo pipefail
          SRC='BlackDragon_v14/Scripts/BlackDragon/Tests/offline_suite.cpp'
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
              "$SRC" -o /tmp/offline_suite_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              /tmp/offline_suite_san | tee /tmp/sanitized.log
          grep -Eq 'BlackDragon v14\.7\.2 offline suite: [0-9]+ passed, 0 failed' /tmp/sanitized.log

      - name: Commit only production source and tests to the PR branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-bd-r10-offline-port.yml
          git rm tools/apply_bd_r10_offline_port.py
          git add \
            BlackDragon_v14/Include/BlackDragon/ExecutionLayer.mqh \
            BlackDragon_v14/Scripts/BlackDragon/Tests/RunTests.mq5 \
            BlackDragon_v14/Scripts/BlackDragon/Tests/offline_suite.cpp
          git diff --cached --check
          git commit -m 'fix: preserve close ownership and port BD-R1..R9 tests'
          git push origin HEAD:"$TARGET_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish verification evidence to PR 4
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          CPP_OUTCOME: ${{ steps.cpp.outcome }}
          SAN_OUTCOME: ${{ steps.san.outcome }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          {
            echo '## Automated verification — BD-R10 + offline port'
            echo
            echo "- exact patch/parity: **${PATCH_OUTCOME}**"
            echo "- native C++ suite: **${CPP_OUTCOME}**"
            echo "- ASan + UBSan: **${SAN_OUTCOME}**"
            echo "- patched commit: \`${PATCH_SHA:-not-created}\`"
            if [ -f /tmp/parity.log ]; then
              echo '- parity contract: `37/37` BD-R1…R9 assertion names match MQL in exact order; BD-R10 has 4 locking assertions'
            fi
            echo
            if [ -f /tmp/run.log ]; then
              echo '```text'
              tail -n 3 /tmp/run.log
              echo '```'
            fi
            echo
            echo 'MetaEditor compilation remains a separate PR check and fail-closed.'
          } > /tmp/pr-comment.md
          cat /tmp/pr-comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-comment.md

      - name: Remove this one-shot runner from main
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/bd-main-cleanup
          git worktree add --detach /tmp/bd-main-cleanup origin/main
          cd /tmp/bd-main-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-bd-r10.yml
          git commit -m 'chore: remove one-shot BD-R10 verifier'
          git push origin HEAD:main
