name: T13 Temporary PR Patcher

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/adaptive-recovery-t13-overlap-side-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute embedded T13 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/t13-apply-fix.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          if marker not in src:
              raise SystemExit('embedded patch marker not found')
          raw = src.split(marker, 1)[1].split('\n          PY', 1)[0]
          lines = raw.splitlines()
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(body, 't13_embedded_patch.py', 'exec'))
          PY

      - name: Validate and push
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryStateMachine.mqh \
                  BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryMutationPolicy.mqh \
                  BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryEngine.mqh \
                  BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryExitCoordinator.mqh \
                  BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryDca.mqh \
                  BlackDragon_v14/Scripts/BlackDragon/Tests/RunRecoveryMutationTests.mq5
          git commit -m "fix(recovery): T13 reconcile overlap and side mutations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
