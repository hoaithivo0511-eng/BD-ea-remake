problem:
  - Legacy basket distances, DCA pip chains, Recovery/Pyramid pip distances and broker points use different conversion paths.
  - DistanceSequence_ assumes ten points per pip and is wrong on four-digit FX quotes.
  - Basket breakeven pairs tick value with point instead of tick size.
  - TP_=300 and a Pips-suffixed value of 300 have materially different meaning without an explicit policy.
invariants:
  - Every strategy distance becomes a price before comparison or level construction.
  - Every broker deviation becomes broker points only at the execution boundary.
  - Tick-value cash conversion always pairs with tick size.
  - Inputs already named/documented as pips remain pips.
  - LEGACY_COMPAT preserves existing .set behavior, including the historical DCA ten-reference-point bridge.
  - PIP_UNIFIED interprets TP_, SL_, iTS, iTD, MaxSpred and Slippage_ as pips and corrects DCA for the symbol pip size.
  - AutoGoldPip affects LEGACY_COMPAT only and is ignored by PIP_UNIFIED.
  - Invalid point, tick-size or derived pip metadata fails OnInit closed.
