problem:
  - A new same-side Core/Pyramid can open after broker TP is reached but before every old-cohort callback is consumed.
  - Live-cohort classification then sees the new position's different TP and misclassifies expected old broker TP as external/manual.
  - A stale cached ticket can reach SL/TP maintenance after its broker-side close.
invariants:
  - Strict Core owner, DEAL_REASON_TP, programmed-TP and fill-tolerance proof is sufficient before Recovery owns the side.
  - When Recovery owns the side, expected broker TP must match a durable pre-close epoch and exact position identifier.
  - A settling epoch blocks only same-side Seed, DCA and Core Pyramid ADD; opposite-side work and risk reduction remain eligible.
  - The epoch is persisted before broker TP maintenance can create a Recovery-owned closing obligation.
  - A cached position is reselected and revalidated immediately before ModifySlTp; vanished/mismatched tickets are skipped.
  - Missing or corrupt Recovery-owned epoch evidence fails closed; it never becomes external/manual evidence.
  - Settlement completion permits a later clean campaign; it does not reopen in the completion event itself.
