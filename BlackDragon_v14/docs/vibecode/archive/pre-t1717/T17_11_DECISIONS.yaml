schema: vibecode-decisions/1.0
decisions:
  - id: T1711-D1
    status: approved
    decision: Make stable ACTIVE/no-TP read-only at the common per-direction boundary and remove global early return ownership.
    locking_tests: [scheduler_buy_passive_sell_actionable, scheduler_mirror, both_passive_no_mutation]
  - id: T1711-D2
    status: approved
    decision: Derive terminalNoHedge without changing persisted enums and preserve the pre-T17.11 T16.3 terminal phase set. DCA and CORE_ONLY Overlap consume the same derived truth; ContinueDcaAfterHedge remains the opt-in for terminal Core progression.
    facts: [phase_is_locked_or_reversal_hold, generation_at_max, core_units_positive, hedge_units_zero]
    baseline_note: e0ad9c59 already classified ARCS_LOCKED and ARCS_REVERSAL_HOLD as terminal phases; T17.11 must not narrow or broaden that production semantic without separate evidence.
    locking_tests: [terminal_locked_true, terminal_reversal_hold_true, premax_false, active_missing_hedge_false, terminal_dca_overlap_continue, terminal_dca_overlap_opt_out]
  - id: T1711-D3
    status: approved
    decision: One complete top-level Recovery validator composes all existing validators while preserving Recovery OFF bypasses.
    locking_tests: [partial_150_fails, partial_100_passes, t6_invalid_fails, recovery_off_parity]
  - id: T1711-D4
    status: approved
    decision: Preserve typed legacy submit outcome and keep the capacity latch in Strategy, scoped to Core DCA.
    locking_tests: [no_money_once_per_bar, next_bar_retry, smaller_lot_release, margin_release, direction_independence, success_clear]

