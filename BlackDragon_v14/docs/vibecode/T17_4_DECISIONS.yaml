schema_version: "1.0"
decisions:
  - id: T174-D1
    status: APPROVED
    decision: Keep MoneyTPAllAccount and MoneySLAllAccount on raw current ACCOUNT_PROFIT.
    rationale: Historical Pyramid realized cash must not postpone an absolute account floating threshold.
    locking_tests:
      - raw floating 350 hits account MoneyTP 300 despite historical loss
  - id: T174-D2
    status: APPROVED
    decision: Keep the PctDiff ratio floating-only, but require its close surplus to repay active Pyramid campaign realized debt before execution reserve.
    rationale: The owner log proves Peel converts floating loss to realized debt and the old floating-only surplus gate can then flatten a negative campaign.
    numeric_example:
      buy_floating: 26.71
      sell_floating: -9.42
      pyramid_realized: -73.23
      execution_reserve: 2.64
      economic_surplus: -55.94
      expected: BLOCK
    locking_tests:
      - campaign debt blocks otherwise eligible PctDiff
      - recovered campaign permits PctDiff
  - id: T174-D3
    status: APPROVED
    decision: Fixed LOT_CHUOI remains exact and is never risk-budget resized; unsafe ADD is blocked instead. Funding excludes live Pyramid floating because that floating is consumed on the path to the existing legs' Peel exits.
    rationale: The owner log shows 0.05 lot Peel risk near 30 USD while median serial-1 economic cash was 3.05 USD. Counting a profitable live Pyramid leg as both funding and an open Peel liability understates residual loss from the current state to Peel.
    numeric_example:
      economic_cash: 32.00
      min_lock_cash: 2.00
      open_peel_risk_cash: 0.00
      candidate_peel_risk_cash: 30.00
      expected: ALLOW_BOUNDARY
    locking_tests:
      - underfunded fixed candidate blocked
      - existing open risk remains reserved
      - live Pyramid floating is excluded from funding
      - exact boundary allowed
      - realized Peel debt blocks refill until recovered
  - id: T174-D4
    status: APPROVED
    decision: PctDiff execution reserve is ticket-aware and fail-closed on invalid symbol metadata.
    rationale: Five actual PctDiff close-to-flat episodes were gross-negative under the old one-spread reserve and synchronous 150 ms sequential execution.
    numeric_example:
      spread_price: 0.24
      deviation_price_after_point_scaling: 0.03
      close_requests: 9
      total_lots: 0.11
      tick_size: 0.001
      tick_value: 0.10
      expected_reserve_cash: 8.25
    locking_tests:
      - reserve includes two spreads and per-request deviation
      - invalid tick metadata returns fail-closed sentinel
