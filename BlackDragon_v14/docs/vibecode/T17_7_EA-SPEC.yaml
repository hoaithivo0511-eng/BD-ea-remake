schema_version: "1.0"
task: T17.7
project: BlackDragon Adaptive Recovery / Full Pyramid
status: OWNER_APPROVED_CONTRACT
baseline:
  branch: feat/t17-full-pyramid
  head: 904dad4d92e31ebed56c75a54d8bd0537b0012a1
  tree: 3cf49aed71288e5dfd0b1651c712763e7e55fbef

objectives:
  - Fix Recovery WAIT starving Core Pyramid on the opposite side.
  - Add selectable Core Pyramid anchor semantics: DYNAMIC and FIRST_CORE_CUMULATIVE.
  - Make Overlap two-leg execution durable and revalidate economics after leg 1 is broker-confirmed.
  - Normalize Hedge Pyramid stages by executable broker volume, not only raw percentages.
  - Consolidate overlapping Recovery/Hedge inputs with versioned compatibility migration.
  - Make semantic persistence fingerprint conditional on inputs that are actually active.
  - Make runtime journals short, Vietnamese-first, state-oriented and immediately understandable.

core_pyramid:
  cycle_modes:
    CHU_KY_SACH:
      rule: "Sau khi Pyramid đã Peel/exit trong campaign, không ADD mới cho tới khi Core side về flat."
    TAI_KICH_HOAT:
      rule: "Sau Peel có thể ADD lại khi đủ điều kiện; serial chỉ tăng, không dùng lại level cũ."
  anchor_modes:
    DYNAMIC:
      rule: "Giữ semantics hiện tại: DCA mới -> basket BE; sau Peel -> giá Peel; có Pyramid live -> giá Pyramid mới nhất; còn lại -> basket BE."
    FIRST_CORE_CUMULATIVE:
      rule: "Anchor cố định tại giá lệnh Core exact-Magic đầu tiên của campaign; DCA/Peel không đổi anchor. Distance sequence là ladder cộng dồn từ First Core."
  scheduler:
    dispositions: [NO_EFFECT, WAIT, MUTATED, PENDING, RECONCILE]
    rules:
      - "WAIT không được chiếm toàn Strategy tick."
      - "MUTATED/PENDING dừng mutation chain trong tick."
      - "RECONCILE fail-closed."
      - "Recovery đã sở hữu cùng Core side thì Core Pyramid cùng side bị block."
      - "Recovery opposite-side chỉ WAIT thì không block Core Pyramid side còn lại."
      - "Tối đa một trade mutation chain trong mỗi tick."

overlap_stage_c:
  lifecycle:
    - PAIR_ARMED
    - LEG1_SUBMITTED
    - LEG1_CONFIRMED
    - LEG2_RECHECK
    - LEG2_WAIT_SAFE
    - LEG2_SUBMITTED
    - COMPLETE
    - RECONCILE
  rules:
    - "Persist pair obligation trước mutation đầu tiên."
    - "Sau khi leg 1 được broker xác nhận, refresh giá/P&L/chi phí và đánh giá lại leg 2."
    - "Nếu leg 2 không còn an toàn, giữ durable WAIT; không ép đóng âm."
    - "Outcome mơ hồ -> RECONCILE; không retry mù."

hedge_pyramid:
  target_semantics:
    public_target: HedgeTargetCoveragePercent_
    meaning: "Target cuối cùng của TOTAL live Recovery Hedge / current exact-Magic Core."
    intermediate_ladder: HedgePyramidCoverageSequence_
    absolute_cap: HedgeAbsoluteMaxCoveragePercent_
  broker_stage_normalization:
    rule: "Raw coverage -> target units theo broker step -> bỏ các stage trùng executable volume -> map gap theo effective stage."
    example: "Core 0.42: 81%=0.34 và 82%=0.34 => chỉ giữ một effective stage."

input_consolidation:
  overlap_policy: [OVERLAP_OFF, OVERLAP_CORE_ONLY, OVERLAP_ALLOW_DURING_RECOVERY]
  global_sl: "GlobalSLAfterGenerations_=0 nghĩa là OFF; >0 nghĩa là bật sau N generations."
  rehedge_gap: "ReHedgeGapPips_ chuyển LEGACY/DEPRECATED; không còn active ARCS semantic; migration giữ .set cũ."
  migration: "Không xóa tên cũ đột ngột; dùng compatibility/migration versioned."
  fingerprint: "Chỉ hash input có ảnh hưởng executable semantics trong mode đang bật."

logging_contract:
  language: vi
  goals:
    - "Nhìn một dòng biết module đang ở trạng thái gì."
    - "Nếu đang chờ, biết đang chờ điều kiện nào và còn thiếu bao nhiêu."
    - "Nếu bị chặn, biết chính xác nguyên nhân."
    - "Nếu lỗi, biết module + side + trạng thái + hành động cần xử lý."
  style:
    - "Câu ngắn, tiếng Việt phổ thông; hạn chế thuật ngữ nội bộ."
    - "Không log code enum thô nếu có thể đổi thành tên tiếng Việt."
    - "Không spam mỗi tick; heartbeat theo RecoveryWaitLogSeconds_ hoặc khi trạng thái/giá trị quan trọng thay đổi."
    - "Giữ ticket, lot, giá, side, generation/serial khi cần điều tra."
  recommended_format: "[BD:<MODULE>] <MỨC> <SIDE> | <TRẠNG THÁI> | <LÝ DO/VIỆC ĐANG LÀM> | <SỐ LIỆU CẦN THIẾT>"
  examples:
    - "[BD:Pyramid] CHỜ SELL | Chưa đủ khoảng giá | mốc=4410.50 hiện=4402.10 còn=14.0 pip"
    - "[BD:Recovery] CHỜ BUY | Hedge đang chờ bậc tiếp | đang=81% mục tiêu=85% còn=4%"
    - "[BD:Overlap] CHỜ BUY | Lệnh 1 đã đóng, lệnh 2 chưa an toàn | dự kiến=-0.42 USD"
    - "[BD:Recovery] LỖI BUY | Không xác định kết quả khớp lệnh | chuyển sang đối soát"

verification:
  stages:
    C0: "SPEC/DECISIONS/CONTRACT/PROJECT_STATE/migration map"
    C1: "Scheduler WAIT != MUTATION"
    C2: "Core Pyramid AnchorMode"
    C3: "Durable Overlap Stage C"
    C4: "Broker-normalized Hedge ladder + single target semantics"
    C5: "Input consolidation + compatibility migration + conditional fingerprint"
    C6: "Vietnamese observability + cross-input validators + input group cleanup"
    C7: "Exact-head model/source/MetaEditor/native/full regression + QA EX5"
  owner_strategy_tester_required: true
  required_runtime_cases:
    - "4 tổ hợp cycle mode x anchor mode"
    - "Seed-only -> Pyramid; Seed+DCA -> Pyramid; Peel -> re-arm; restart giữa campaign"
    - "BUY Recovery WAIT + SELL Pyramid qualified và ngược lại"
    - "same-side Recovery owns topology -> Core Pyramid block"
    - "MaxHedgeGenerations >= 2"
    - "flag_Hand_Ord=true"
    - "coverage 80-81-82-85 broker dedup"
    - "Overlap 150ms adverse post-leg1"
    - "MoneyTPAllAccount=300"
    - "tester tới end date; no reconcile/no-money/stopout/balance bleed"

release:
  pr_must_remain_draft: true
  merge_authorized: false
  forward_live_eligible: false
